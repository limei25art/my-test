<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube 歌曲加拍子 Game</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'Noto Sans TC', system-ui, sans-serif;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  
  h1 {
    font-size: 1.8rem;
    margin-bottom: 8px;
    text-shadow: 0 0 20px #ff6b6b;
  }
  
  .subtitle {
    opacity: 0.7;
    margin-bottom: 20px;
    font-size: 0.95rem;
  }
  
  .panel {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(12px);
    border-radius: 16px;
    padding: 20px;
    width: 100%;
    max-width: 720px;
    margin-bottom: 16px;
    border: 1px solid rgba(255,255,255,0.1);
  }
  
  label {
    display: block;
    margin-bottom: 6px;
    font-weight: 700;
    font-size: 0.9rem;
  }
  
  input[type="text"] {
    width: 100%;
    padding: 12px 16px;
    border-radius: 10px;
    border: none;
    background: rgba(0,0,0,0.4);
    color: #fff;
    font-size: 1rem;
    margin-bottom: 12px;
  }
  
  input[type="text"]::placeholder {
    color: rgba(255,255,255,0.4);
  }
  
  .btn-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  
  button {
    flex: 1;
    min-width: 120px;
    padding: 12px 16px;
    border: none;
    border-radius: 10px;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  
  button:hover { transform: translateY(-2px); }
  button:active { transform: translateY(0); }
  
  .btn-primary {
    background: linear-gradient(135deg, #ff6b6b, #ee5a24);
    color: white;
  }
  
  .btn-secondary {
    background: rgba(255,255,255,0.15);
    color: white;
  }
  
  .btn-success {
    background: linear-gradient(135deg, #00b894, #00cec9);
    color: white;
  }
  
  .btn-danger {
    background: linear-gradient(135deg, #e17055, #d63031);
    color: white;
  }
  
  #player-container {
    width: 100%;
    max-width: 720px;
    aspect-ratio: 16/9;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 16px;
    position: relative;
  }
  
  #player {
    width: 100%;
    height: 100%;
  }
  
  .status {
    text-align: center;
    padding: 8px;
    font-size: 0.9rem;
    opacity: 0.85;
  }
  
  /* Game Area */
  #game-area {
    width: 100%;
    max-width: 720px;
    height: 380px;
    background: rgba(0,0,0,0.5);
    border-radius: 16px;
    position: relative;
    overflow: hidden;
    border: 2px solid rgba(255,255,255,0.15);
    display: none;
  }
  
  .lane {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 25%;
    border-right: 1px solid rgba(255,255,255,0.08);
  }
  
  .lane:nth-child(1) { left: 0; background: linear-gradient(to bottom, transparent, rgba(255,107,107,0.15)); }
  .lane:nth-child(2) { left: 25%; background: linear-gradient(to bottom, transparent, rgba(253,203,110,0.15)); }
  .lane:nth-child(3) { left: 50%; background: linear-gradient(to bottom, transparent, rgba(0,206,201,0.15)); }
  .lane:nth-child(4) { left: 75%; border-right: none; background: linear-gradient(to bottom, transparent, rgba(108,92,231,0.15)); }
  
  .judge-line {
    position: absolute;
    bottom: 60px;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(90deg, #ff6b6b, #fdcb6e, #00cec9, #6c5ce7);
    box-shadow: 0 0 20px rgba(255,255,255,0.6);
    z-index: 10;
  }
  
  .key-hint {
    position: absolute;
    bottom: 12px;
    width: 25%;
    text-align: center;
    font-size: 1.4rem;
    font-weight: 700;
    opacity: 0.6;
  }
  
  .key-hint:nth-of-type(1) { left: 0; color: #ff6b6b; }
  .key-hint:nth-of-type(2) { left: 25%; color: #fdcb6e; }
  .key-hint:nth-of-type(3) { left: 50%; color: #00cec9; }
  .key-hint:nth-of-type(4) { left: 75%; color: #6c5ce7; }
  
  .note {
    position: absolute;
    width: 70%;
    height: 22px;
    border-radius: 6px;
    left: 15%;
    z-index: 5;
    box-shadow: 0 0 12px currentColor;
  }
  
  .note.lane0 { background: #ff6b6b; color: #ff6b6b; }
  .note.lane1 { background: #fdcb6e; color: #fdcb6e; }
  .note.lane2 { background: #00cec9; color: #00cec9; }
  .note.lane3 { background: #6c5ce7; color: #6c5ce7; }
  
  .score-board {
    position: absolute;
    top: 12px;
    left: 12px;
    font-size: 1.1rem;
    font-weight: 700;
    z-index: 20;
    text-shadow: 0 2px 8px #000;
  }
  
  .combo {
    position: absolute;
    top: 40px;
    left: 12px;
    font-size: 0.95rem;
    color: #fdcb6e;
    z-index: 20;
  }
  
  .judgement {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 2rem;
    font-weight: 700;
    opacity: 0;
    pointer-events: none;
    z-index: 30;
    text-shadow: 0 0 20px currentColor;
    transition: opacity 0.1s;
  }
  
  .info-text {
    font-size: 0.85rem;
    opacity: 0.7;
    line-height: 1.5;
    margin-top: 8px;
  }
  
  .mode-badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.8rem;
    font-weight: 700;
    margin-bottom: 10px;
  }
  
  .mode-record { background: #e17055; }
  .mode-play { background: #00b894; }
  
  #note-count {
    font-weight: 700;
    color: #fdcb6e;
  }
</style>
</head>
<body>
  <h1>🎵 YouTube 歌曲加拍子 Game</h1>
  <p class="subtitle">貼上 YouTube 連結 → 邊聽邊敲擊加拍子 → 變成節奏遊戲！</p>
  
  <div class="panel">
    <label>YouTube 連結或影片 ID</label>
    <input type="text" id="yt-url" placeholder="例如：https://www.youtube.com/watch?v=dQw4w9WgXcQ 或 dQw4w9WgXcQ">
    <div class="btn-row">
      <button class="btn-primary" onclick="loadVideo()">載入影片</button>
      <button class="btn-secondary" onclick="clearChart()">清除拍子</button>
    </div>
    <p class="info-text">
      支援任意公開 YouTube 影片。載入後請先播放影片，再開始「錄製拍子」。
    </p>
  </div>
  
  <div id="player-container">
    <div id="player"></div>
  </div>
  
  <div class="panel" id="control-panel">
    <div id="mode-display">
      <span class="mode-badge mode-record">錄製模式</span>
      <span>目前拍子數：<span id="note-count">0</span></span>
    </div>
    
    <div class="btn-row" style="margin-top:12px;">
      <button class="btn-success" id="btn-record" onclick="toggleRecord()">開始錄製拍子</button>
      <button class="btn-primary" id="btn-play" onclick="startPlay()" disabled>開始遊玩</button>
    </div>
    
    <p class="info-text" id="help-text">
      【錄製說明】先播放 YouTube 影片，點「開始錄製」後，用鍵盤 <b>D F J K</b>（或畫面下方按鈕）跟著節奏敲擊。每個敲擊會記錄當下時間與軌道。
    </p>
  </div>
  
  <div id="game-area">
    <div class="lane"></div>
    <div class="lane"></div>
    <div class="lane"></div>
    <div class="lane"></div>
    <div class="judge-line"></div>
    <div class="key-hint">D</div>
    <div class="key-hint">F</div>
    <div class="key-hint">J</div>
    <div class="key-hint">K</div>
    <div class="score-board">Score: <span id="score">0</span></div>
    <div class="combo">Combo: <span id="combo">0</span></div>
    <div class="judgement" id="judgement"></div>
  </div>
  
  <div class="panel" style="margin-top:16px;">
    <p class="info-text" style="text-align:center;">
      操作：鍵盤 <b>D F J K</b> 對應四條軌道　｜　錄製時跟著感覺敲　｜　遊玩時準確擊中判定線
    </p>
  </div>

<script>
  // ========== State ==========
  let player = null;
  let videoId = null;
  let notes = [];          // {time: number, lane: 0-3}
  let isRecording = false;
  let isPlaying = false;
  let score = 0;
  let combo = 0;
  let activeNotes = [];    // DOM elements currently falling
  let animFrame = null;
  let startOffset = 0;     // video time when play started
  
  const KEY_MAP = { 'd': 0, 'f': 1, 'j': 2, 'k': 3 };
  const LANE_COLORS = ['#ff6b6b', '#fdcb6e', '#00cec9', '#6c5ce7'];
  
  // ========== YouTube API ==========
  function onYouTubeIframeAPIReady() {
    // called by YT API
  }
  
  function loadVideo() {
    const input = document.getElementById('yt-url').value.trim();
    if (!input) {
      alert('請輸入 YouTube 連結或影片 ID');
      return;
    }
    
    // Extract video ID
    let id = input;
    const match = input.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([a-zA-Z0-9_-]{11})/);
    if (match) id = match[1];
    else if (input.length === 11) id = input;
    else {
      alert('無法識別影片 ID，請確認連結正確');
      return;
    }
    
    videoId = id;
    
    if (player) {
      player.loadVideoById(id);
    } else {
      player = new YT.Player('player', {
        height: '100%',
        width: '100%',
        videoId: id,
        playerVars: {
          'playsinline': 1,
          'rel': 0,
          'modestbranding': 1
        },
        events: {
          'onReady': () => console.log('Player ready'),
          'onStateChange': onPlayerStateChange
        }
      });
    }
    
    notes = [];
    updateNoteCount();
    document.getElementById('btn-play').disabled = true;
  }
  
  function onPlayerStateChange(event) {
    // 1 = playing
  }
  
  // ========== Recording ==========
  function toggleRecord() {
    if (!player || !videoId) {
      alert('請先載入 YouTube 影片');
      return;
    }
    
    isRecording = !isRecording;
    const btn = document.getElementById('btn-record');
    const modeBadge = document.querySelector('.mode-badge');
    const help = document.getElementById('help-text');
    
    if (isRecording) {
      btn.textContent = '停止錄製';
      btn.className = 'btn-danger';
      modeBadge.textContent = '錄製中...';
      modeBadge.className = 'mode-badge mode-record';
      help.innerHTML = '【錄製中】用 <b>D F J K</b> 跟著節奏敲擊！再次點擊按鈕可停止。';
      // Ensure video is playing
      if (player.getPlayerState() !== 1) {
        player.playVideo();
      }
    } else {
      btn.textContent = '開始錄製拍子';
      btn.className = 'btn-success';
      modeBadge.textContent = '錄製模式';
      modeBadge.className = 'mode-badge mode-record';
      help.innerHTML = '【錄製說明】先播放 YouTube 影片，點「開始錄製」後，用鍵盤 <b>D F J K</b> 跟著節奏敲擊。';
      if (notes.length > 0) {
        document.getElementById('btn-play').disabled = false;
      }
    }
  }
  
  function addNote(lane) {
    if (!isRecording || !player) return;
    const time = player.getCurrentTime();
    notes.push({ time, lane });
    notes.sort((a, b) => a.time - b.time);
    updateNoteCount();
    
    // Visual feedback
    flashLane(lane);
  }
  
  function updateNoteCount() {
    document.getElementById('note-count').textContent = notes.length;
  }
  
  function clearChart() {
    if (confirm('確定要清除所有已錄製的拍子嗎？')) {
      notes = [];
      updateNoteCount();
      document.getElementById('btn-play').disabled = true;
      stopPlay();
    }
  }
  
  // ========== Play Mode ==========
  function startPlay() {
    if (notes.length === 0) {
      alert('還沒有任何拍子！請先錄製。');
      return;
    }
    
    isPlaying = true;
    isRecording = false;
    score = 0;
    combo = 0;
    document.getElementById('score').textContent = '0';
    document.getElementById('combo').textContent = '0';
    
    document.getElementById('game-area').style.display = 'block';
    document.getElementById('control-panel').style.display = 'none';
    
    // Seek to a bit before first note
    const firstTime = Math.max(0, notes[0].time - 2);
    player.seekTo(firstTime, true);
    player.playVideo();
    
    startOffset = performance.now() / 1000 - firstTime;
    
    // Create all note elements in advance
    const area = document.getElementById('game-area');
    // Clear old notes
    area.querySelectorAll('.note').forEach(n => n.remove());
    activeNotes = [];
    
    notes.forEach(n => {
      const el = document.createElement('div');
      el.className = `note lane${n.lane}`;
      el.style.left = (n.lane * 25 + 3.75) + '%';
      el.dataset.time = n.time;
      el.dataset.lane = n.lane;
      el.dataset.hit = 'false';
      area.appendChild(el);
      activeNotes.push(el);
    });
    
    animFrame = requestAnimationFrame(gameLoop);
  }
  
  function stopPlay() {
    isPlaying = false;
    if (animFrame) cancelAnimationFrame(animFrame);
    document.getElementById('game-area').style.display = 'none';
    document.getElementById('control-panel').style.display = 'block';
    document.querySelectorAll('.note').forEach(n => n.remove());
  }
  
  function gameLoop() {
    if (!isPlaying) return;
    
    const now = player.getCurrentTime();
    const leadTime = 1.8; // seconds before judge line
    
    activeNotes.forEach(el => {
      if (el.dataset.hit === 'true') return;
      
      const noteTime = parseFloat(el.dataset.time);
      const progress = (noteTime - now) / leadTime; // 1 = top, 0 = judge line
      
      if (progress > 1.2) {
        el.style.display = 'none';
      } else if (progress < -0.3) {
        // Missed
        if (el.dataset.hit === 'false') {
          el.dataset.hit = 'miss';
          el.style.opacity = '0.3';
          combo = 0;
          document.getElementById('combo').textContent = '0';
          showJudgement('MISS', '#e17055');
        }
        el.style.display = 'none';
      } else {
        el.style.display = 'block';
        // Map progress 1→0 to top→judge line (bottom: 60px from bottom)
        const areaH = document.getElementById('game-area').clientHeight;
        const judgeY = areaH - 60 - 11; // center of note
        const topY = 20;
        const y = topY + (1 - progress) * (judgeY - topY);
        el.style.top = y + 'px';
      }
    });
    
    // Check if song ended or all notes processed
    if (player.getPlayerState() === 0 || now > notes[notes.length-1].time + 3) {
      // Game over
      setTimeout(() => {
        alert(`遊戲結束！\n得分：${score}\n最高連擊：看你自己記～\n共 ${notes.length} 個拍子`);
        stopPlay();
      }, 500);
      return;
    }
    
    animFrame = requestAnimationFrame(gameLoop);
  }
  
  function tryHit(lane) {
    if (!isPlaying) return;
    
    const now = player.getCurrentTime();
    let best = null;
    let bestDiff = 999;
    
    activeNotes.forEach(el => {
      if (el.dataset.hit !== 'false') return;
      if (parseInt(el.dataset.lane) !== lane) return;
      
      const diff = Math.abs(parseFloat(el.dataset.time) - now);
      if (diff < bestDiff && diff < 0.25) {
        bestDiff = diff;
        best = el;
      }
    });
    
    if (best) {
      best.dataset.hit = 'true';
      best.style.display = 'none';
      
      let judgement, points;
      if (bestDiff < 0.06) {
        judgement = 'PERFECT';
        points = 300;
        showJudgement(judgement, '#00cec9');
      } else if (bestDiff < 0.12) {
        judgement = 'GREAT';
        points = 200;
        showJudgement(judgement, '#fdcb6e');
      } else {
        judgement = 'GOOD';
        points = 100;
        showJudgement(judgement, '#a29bfe');
      }
      
      score += points + Math.floor(combo * 5);
      combo++;
      document.getElementById('score').textContent = score;
      document.getElementById('combo').textContent = combo;
    } else {
      // empty hit, no penalty for now
    }
    
    flashLane(lane);
  }
  
  function showJudgement(text, color) {
    const el = document.getElementById('judgement');
    el.textContent = text;
    el.style.color = color;
    el.style.opacity = '1';
    setTimeout(() => el.style.opacity = '0', 400);
  }
  
  function flashLane(lane) {
    const lanes = document.querySelectorAll('.lane');
    if (lanes[lane]) {
      lanes[lane].style.background = `linear-gradient(to bottom, transparent, ${LANE_COLORS[lane]}55)`;
      setTimeout(() => {
        lanes[lane].style.background = '';
      }, 120);
    }
  }
  
  // ========== Keyboard ==========
  document.addEventListener('keydown', (e) => {
    const key = e.key.toLowerCase();
    if (KEY_MAP[key] !== undefined) {
      e.preventDefault();
      const lane = KEY_MAP[key];
      if (isRecording) {
        addNote(lane);
      } else if (isPlaying) {
        tryHit(lane);
      }
    }
    
    // Space to toggle play/pause of video
    if (e.code === 'Space' && player) {
      e.preventDefault();
      const state = player.getPlayerState();
      if (state === 1) player.pauseVideo();
      else player.playVideo();
    }
  });
  
  // Touch / click support for mobile
  document.querySelectorAll('.key-hint').forEach((el, i) => {
    el.style.cursor = 'pointer';
    el.addEventListener('click', () => {
      if (isRecording) addNote(i);
      else if (isPlaying) tryHit(i);
    });
  });
</script>

<!-- YouTube IFrame API -->
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
