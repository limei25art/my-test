<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>倉頡／速成字典 · 手寫查碼</title>
<style>
  :root {
    --bg: #0f1419;
    --card: #1a2332;
    --border: #2d3a4f;
    --text: #e7ecf3;
    --muted: #8b9bb4;
    --accent: #3b82f6;
    --accent2: #22c55e;
    --danger: #ef4444;
    --rad: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
  }
  .wrap {
    max-width: 960px;
    margin: 0 auto;
    padding: 16px;
  }
  header {
    text-align: center;
    padding: 20px 0 12px;
  }
  header h1 {
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: 0.05em;
  }
  header p {
    color: var(--muted);
    font-size: 0.9rem;
    margin-top: 4px;
  }
  .tabs {
    display: flex;
    gap: 8px;
    margin: 16px 0;
    flex-wrap: wrap;
  }
  .tab {
    flex: 1;
    min-width: 100px;
    padding: 10px 14px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    border-radius: 999px;
    cursor: pointer;
    font-size: 0.95rem;
    transition: all 0.15s;
  }
  .tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .panel { display: none; }
  .panel.active { display: block; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--rad);
    padding: 16px;
    margin-bottom: 16px;
  }
  .card h2 {
    font-size: 1rem;
    margin-bottom: 12px;
    color: var(--muted);
    font-weight: 600;
  }

  input[type="text"], textarea {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #0d1218;
    color: var(--text);
    font-size: 1.15rem;
    outline: none;
  }
  input:focus, textarea:focus {
    border-color: var(--accent);
  }

  .btn-row {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  button, .btn {
    padding: 10px 16px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 0.95rem;
    cursor: pointer;
    font-family: inherit;
  }
  button.secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
  }
  button.danger { background: var(--danger); }
  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  /* 手寫區 */
  #pad-wrap {
    position: relative;
    width: 100%;
    max-width: 360px;
    margin: 0 auto;
    aspect-ratio: 1;
    background: #0a0e14;
    border: 2px dashed var(--border);
    border-radius: var(--rad);
    touch-action: none;
  }
  #pad {
    width: 100%;
    height: 100%;
    display: block;
    border-radius: var(--rad);
  }
  .pad-hint {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    pointer-events: none;
    font-size: 0.95rem;
  }
  .pad-hint.hide { display: none; }

  .candidates {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 14px;
    min-height: 48px;
  }
  .cand {
    width: 48px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    background: #0d1218;
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    transition: 0.12s;
  }
  .cand:hover, .cand:active {
    border-color: var(--accent);
    background: #152033;
  }

  /* 結果 */
  .result-list {
    display: grid;
    gap: 10px;
  }
  .result-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px;
    background: #0d1218;
    border-radius: 10px;
    border: 1px solid var(--border);
  }
  .char-big {
    font-size: 2.4rem;
    width: 64px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #152033;
    border-radius: 10px;
    flex-shrink: 0;
  }
  .codes {
    flex: 1;
  }
  .codes .label {
    font-size: 0.75rem;
    color: var(--muted);
  }
  .codes .code {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 1.1rem;
    letter-spacing: 0.08em;
  }
  .codes .cj-zh {
    color: var(--accent2);
    font-size: 0.95rem;
    margin-top: 2px;
  }

  /* 字根鍵盤 */
  .kb {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 6px;
  }
  .kb-key {
    aspect-ratio: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0d1218;
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.85rem;
    user-select: none;
  }
  .kb-key:active { background: #1e2a3c; }
  .kb-key .en {
    font-weight: 700;
    color: var(--accent);
    font-size: 0.8rem;
  }
  .kb-key .zh {
    font-size: 0.95rem;
  }
  .kb-key.wide {
    grid-column: span 2;
  }

  .status {
    text-align: center;
    color: var(--muted);
    font-size: 0.85rem;
    margin: 8px 0;
  }
  .status.ok { color: var(--accent2); }
  .status.err { color: var(--danger); }

  footer {
    text-align: center;
    padding: 24px 0 40px;
    color: var(--muted);
    font-size: 0.8rem;
  }
  footer a { color: var(--accent); }

  @media (max-width: 480px) {
    .char-big { font-size: 2rem; width: 52px; height: 52px; }
    .kb { gap: 4px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>倉頡／速成字典</h1>
    <p>完整倉頡五代資料庫 · 手寫查碼 (Google API)</p>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="hand">手寫查字</button>
    <button class="tab" data-tab="char">漢字查碼</button>
    <button class="tab" data-tab="code">碼查漢字</button>
    <button class="tab" data-tab="kb">字根鍵盤</button>
  </div>

  <!-- 手寫 -->
  <div id="panel-hand" class="panel active">
    <div class="card">
      <h2>手寫辨識</h2>
      <div id="pad-wrap">
        <canvas id="pad"></canvas>
        <div class="pad-hint" id="padHint">在此書寫漢字</div>
      </div>
      <div class="btn-row" style="justify-content:center;margin-top:12px">
        <button class="secondary" id="btnClear">清除</button>
        <button class="secondary" id="btnUndo">復原上一筆</button>
        <button id="btnRecognize" disabled>手動辨識</button>
      </div>
      <div class="candidates" id="handCands"></div>
      <div class="status" id="handStatus"></div>
    </div>
    <div class="card" id="handResultCard" style="display:none">
      <h2>查詢結果</h2>
      <div class="result-list" id="handResult"></div>
    </div>
  </div>

  <!-- 漢字查碼 -->
  <div id="panel-char" class="panel">
    <div class="card">
      <h2>輸入漢字（可多字）</h2>
      <input type="text" id="charInput" placeholder="例如：倉頡輸入法" autocomplete="off">
      <div class="btn-row">
        <button id="btnCharSearch">查碼</button>
        <button class="secondary" id="btnCharClear">清除</button>
      </div>
    </div>
    <div class="card" id="charResultCard" style="display:none">
      <h2>結果</h2>
      <div class="result-list" id="charResult"></div>
    </div>
  </div>

  <!-- 碼查字 -->
  <div id="panel-code" class="panel">
    <div class="card">
      <h2>輸入倉頡碼（英文字母，可 * 模糊）</h2>
      <input type="text" id="codeInput" placeholder="例如：oiar 或 oi* " autocomplete="off" style="text-transform:uppercase">
      <div class="btn-row">
        <button id="btnCodeSearch">查字</button>
        <button class="secondary" id="btnCodeClear">清除</button>
      </div>
    </div>
    <div class="card" id="codeResultCard" style="display:none">
      <h2>結果 <span id="codeCount" style="color:var(--muted);font-weight:400"></span></h2>
      <div class="result-list" id="codeResult"></div>
    </div>
  </div>

  <!-- 字根鍵盤 -->
  <div id="panel-kb" class="panel">
    <div class="card">
      <h2>倉頡 24 字根</h2>
      <div class="kb" id="kb"></div>
      <div style="margin-top:14px">
        <input type="text" id="kbInput" placeholder="點選字根組成碼…" readonly style="text-transform:uppercase">
        <div class="btn-row">
          <button id="btnKbSearch">查字</button>
          <button class="secondary" id="btnKbBack">倒退</button>
          <button class="secondary" id="btnKbClear">清除</button>
        </div>
      </div>
    </div>
    <div class="card" id="kbResultCard" style="display:none">
      <h2>結果</h2>
      <div class="result-list" id="kbResult"></div>
    </div>
  </div>

  <div class="status" id="dbStatus">正在載入倉頡完整資料庫…</div>

  <footer>
    資料來源：倉頡五代（五倉世紀衍生）<br>
    手寫辨識引擎：Google Input Tools API
  </footer>
</div>

<script>
/* ========== 倉頡字根對照 ========== */
const CJ_RADICALS = {
  A:'日', B:'月', C:'金', D:'木', E:'水', F:'火', G:'土',
  H:'竹', I:'戈', J:'十', K:'大', L:'中', M:'一', N:'弓',
  O:'人', P:'心', Q:'手', R:'口', S:'尸', T:'廿', U:'山',
  V:'女', W:'田', X:'難', Y:'卜', Z:'重'
};

function codeToZh(code) {
  if (!code) return '';
  return code.toUpperCase().split('').map(c => CJ_RADICALS[c] || c).join('');
}

function toSucheng(code) {
  if (!code) return '';
  const c = code.toUpperCase();
  if (c.length <= 2) return c;
  return c[0] + c[c.length - 1];
}

/* ========== 資料庫 ========== */
let CJ_DB = null;          
let CJ_INV = null;         
let DB_READY = false;

async function loadCangjieDB() {
  const urls = [
    'https://cdn.jsdelivr.net/gh/zac15987/cangjie-dictionary@main/src/data/cangjie5.json',
    'https://raw.githubusercontent.com/zac15987/cangjie-dictionary/main/src/data/cangjie5.json'
  ];
  for (const url of urls) {
    try {
      const r = await fetch(url);
      if (!r.ok) throw new Error(r.status);
      CJ_DB = await r.json();
      CJ_INV = {};
      for (const [ch, code] of Object.entries(CJ_DB)) {
        const c = (code || '').toUpperCase();
        if (!c) continue;
        if (!CJ_INV[c]) CJ_INV[c] = [];
        CJ_INV[c].push(ch);
      }
      DB_READY = true;
      document.getElementById('dbStatus').textContent =
        `✓ 倉頡資料庫已載入（${Object.keys(CJ_DB).length.toLocaleString()} 字）`;
      document.getElementById('dbStatus').className = 'status ok';
      return;
    } catch (e) {
      console.warn('load fail', url, e);
    }
  }
  document.getElementById('dbStatus').textContent = '✗ 倉頡資料庫載入失敗，請檢查網路後重新整理';
  document.getElementById('dbStatus').className = 'status err';
}

/* ========== UI 結果渲染 ========== */
function renderResults(container, items) {
  if (!items || !items.length) {
    container.innerHTML = '<div style="color:var(--muted);padding:8px">無結果</div>';
    return;
  }
  container.innerHTML = items.map(({ch, code}) => {
    const sc = toSucheng(code);
    return `
      <div class="result-item">
        <div class="char-big">${ch}</div>
        <div class="codes">
          <div class="label">倉頡</div>
          <div class="code">${code.toUpperCase()}</div>
          <div class="cj-zh">${codeToZh(code)}</div>
          <div class="label" style="margin-top:6px">速成</div>
          <div class="code">${sc}</div>
          <div class="cj-zh">${codeToZh(sc)}</div>
        </div>
      </div>`;
  }).join('');
}

/* ========== Tab 切換 ========== */
document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
  });
});

/* ========== 漢字查碼 ========== */
document.getElementById('btnCharSearch').onclick = () => {
  if (!DB_READY) return alert('資料庫尚未載入完成');
  const text = document.getElementById('charInput').value.trim();
  if (!text) return;
  const items = [];
  for (const ch of text) {
    if (/\s/.test(ch)) continue;
    const code = CJ_DB[ch];
    items.push({ ch, code: code || '（無資料）' });
  }
  document.getElementById('charResultCard').style.display = 'block';
  renderResults(document.getElementById('charResult'), items);
};
document.getElementById('btnCharClear').onclick = () => {
  document.getElementById('charInput').value = '';
  document.getElementById('charResultCard').style.display = 'none';
};
document.getElementById('charInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('btnCharSearch').click();
});

/* ========== 碼查字 ========== */
function searchByCode(raw) {
  if (!DB_READY) return [];
  let q = raw.trim().toUpperCase().replace(/[^A-Z*]/g, '');
  if (!q) return [];
  const results = [];
  if (q.includes('*')) {
    const re = new RegExp('^' + q.replace(/\*/g, '.*') + '$');
    for (const [code, chars] of Object.entries(CJ_INV)) {
      if (re.test(code)) {
        for (const ch of chars) results.push({ ch, code });
      }
    }
  } else {
    const chars = CJ_INV[q] || [];
    for (const ch of chars) results.push({ ch, code: q });
  }
  return results.slice(0, 200);
}

document.getElementById('btnCodeSearch').onclick = () => {
  const q = document.getElementById('codeInput').value;
  const items = searchByCode(q);
  document.getElementById('codeResultCard').style.display = 'block';
  document.getElementById('codeCount').textContent =
    items.length ? `（顯示 ${items.length} 筆）` : '';
  renderResults(document.getElementById('codeResult'), items);
};
document.getElementById('btnCodeClear').onclick = () => {
  document.getElementById('codeInput').value = '';
  document.getElementById('codeResultCard').style.display = 'none';
};
document.getElementById('codeInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('btnCodeSearch').click();
});

/* ========== 字根鍵盤 ========== */
(function buildKB() {
  const layout = [
    'Q','W','E','R','T','Y','U','I','O','P',
    'A','S','D','F','G','H','J','K','L',
    'Z','X','C','V','B','N','M'
  ];
  const kb = document.getElementById('kb');
  layout.forEach(k => {
    if (!CJ_RADICALS[k]) return;
    const el = document.createElement('div');
    el.className = 'kb-key';
    el.innerHTML = `<span class="en">${k}</span><span class="zh">${CJ_RADICALS[k]}</span>`;
    el.onclick = () => {
      document.getElementById('kbInput').value += k;
    };
    kb.appendChild(el);
  });
})();

document.getElementById('btnKbSearch').onclick = () => {
  const q = document.getElementById('kbInput').value;
  const items = searchByCode(q);
  document.getElementById('kbResultCard').style.display = 'block';
  renderResults(document.getElementById('kbResult'), items);
};
document.getElementById('btnKbBack').onclick = () => {
  const el = document.getElementById('kbInput');
  el.value = el.value.slice(0, -1);
};
document.getElementById('btnKbClear').onclick = () => {
  document.getElementById('kbInput').value = '';
  document.getElementById('kbResultCard').style.display = 'none';
};

/* ========== 重寫手寫辨識 (Google API) ========== */
// 資料結構變更為 Google API 接受的格式: [[x1, x2...], [y1, y2...]]
let strokes = [];       
let currentStroke = null; 
const canvas = document.getElementById('pad');
const ctx = canvas.getContext('2d');
const hint = document.getElementById('padHint');

function resizeCanvas() {
  const wrap = document.getElementById('pad-wrap');
  const dpr = window.devicePixelRatio || 1;
  const w = wrap.clientWidth;
  const h = wrap.clientHeight;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  redraw();
}

function redraw() {
  const w = canvas.clientWidth;
  const h = canvas.clientHeight;
  ctx.clearRect(0, 0, w, h);
  ctx.strokeStyle = '#e7ecf3';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  
  for (const stroke of strokes) {
    if (!stroke[0] || stroke[0].length < 2) continue;
    ctx.beginPath();
    ctx.moveTo(stroke[0][0], stroke[1][0]);
    for (let i = 1; i < stroke[0].length; i++) {
      ctx.lineTo(stroke[0][i], stroke[1][i]);
    }
    ctx.stroke();
  }
}

function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  return [Math.round(t.clientX - rect.left), Math.round(t.clientY - rect.top)];
}

function startDraw(e) {
  e.preventDefault();
  hint.classList.add('hide');
  const p = getPos(e);
  // 建立新的筆劃 [ [x陣列], [y陣列] ]
  currentStroke = [[p[0]], [p[1]]];
  strokes.push(currentStroke);
}

function moveDraw(e) {
  e.preventDefault();
  if (!currentStroke) return;
  const p = getPos(e);
  currentStroke[0].push(p[0]);
  currentStroke[1].push(p[1]);
  redraw();
}

function endDraw(e) {
  e.preventDefault();
  currentStroke = null;
  document.getElementById('btnRecognize').disabled = strokes.length === 0;
  
  // 停止繪畫 450 毫秒後自動觸發辨識
  clearTimeout(window._recogTimer);
  window._recogTimer = setTimeout(() => {
    if (strokes.length > 0) doRecognize();
  }, 450);
}

canvas.addEventListener('mousedown', startDraw);
canvas.addEventListener('mousemove', moveDraw);
canvas.addEventListener('mouseup', endDraw);
canvas.addEventListener('mouseleave', endDraw);
canvas.addEventListener('touchstart', startDraw, {passive:false});
canvas.addEventListener('touchmove', moveDraw, {passive:false});
canvas.addEventListener('touchend', endDraw, {passive:false});

document.getElementById('btnClear').onclick = () => {
  strokes = [];
  currentStroke = null;
  redraw();
  hint.classList.remove('hide');
  document.getElementById('handCands').innerHTML = '';
  document.getElementById('handResultCard').style.display = 'none';
  document.getElementById('handStatus').textContent = '';
  document.getElementById('btnRecognize').disabled = true;
};

document.getElementById('btnUndo').onclick = () => {
  if (strokes.length > 0) {
    strokes.pop();
    redraw();
    if (strokes.length === 0) {
      document.getElementById('btnClear').click();
    } else {
      doRecognize();
    }
  }
};

// 呼叫 Google 辨識 API
async function doRecognize() {
  if (strokes.length === 0) return;
  const status = document.getElementById('handStatus');
  status.textContent = '辨識中…';
  status.className = 'status';

  const payload = {
    app_version: 0.4,
    api_level: "537.36",
    device: "5.0",
    input_type: 0,
    options: "enable_homophone_dict",
    requests: [{
      writer_words: [],
      ink: strokes,
      language: "zh-Hant"
    }]
  };

  try {
    const res = await fetch("https://inputtools.google.com/request?itc=zh-t-i0-handwrit", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    
    const data = await res.json();
    if (data[0] === "SUCCESS") {
      const matches = data[1][0][1];
      const cands = document.getElementById('handCands');
      cands.innerHTML = '';
      
      if (!matches || !matches.length) {
        status.textContent = '無法辨識，請再試一次';
        return;
      }
      
      status.textContent = '';
      matches.slice(0, 10).forEach(char => {
        const el = document.createElement('div');
        el.className = 'cand';
        el.textContent = char;
        el.onclick = () => showHandResult(char);
        cands.appendChild(el);
      });
      
      // 自動顯示第一個結果
      showHandResult(matches[0]);
    } else {
      status.textContent = '辨識請求失敗';
      status.className = 'status err';
    }
  } catch (err) {
    console.error(err);
    status.textContent = '辨識出錯（請檢查網路連線）';
    status.className = 'status err';
  }
}

document.getElementById('btnRecognize').onclick = doRecognize;

function showHandResult(ch) {
  if (!DB_READY) {
    document.getElementById('handResultCard').style.display = 'block';
    document.getElementById('handResult').innerHTML =
      `<div class="result-item"><div class="char-big">${ch}</div><div class="codes">資料庫尚未就緒</div></div>`;
    return;
  }
  const code = CJ_DB[ch] || '（無資料）';
  document.getElementById('handResultCard').style.display = 'block';
  renderResults(document.getElementById('handResult'), [{ ch, code }]);
}

function initHandwriting() {
  const status = document.getElementById('handStatus');
  status.textContent = '✓ 手寫辨識就緒，請開始書寫';
  status.className = 'status ok';
}

/* 啟動 */
window.addEventListener('resize', resizeCanvas);
resizeCanvas();
loadCangjieDB();
initHandwriting(); // 直接初始化
</script>
</body>
