<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>圖片+文字走馬燈</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  html, body {
    background: #111;
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    font-family: "Microsoft JhengHei", "PingFang TC", Arial, sans-serif;
    color: #fff;
    touch-action: manipulation;
  }

  .controls {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    background: rgba(0,0,0,0.95);
    padding: 6px 10px;
    padding-top: max(6px, env(safe-area-inset-top));
    display: flex;
    flex-wrap: wrap;
    gap: 6px 10px;
    align-items: center;
    z-index: 100;
    border-bottom: 1px solid #333;
    font-size: 13px;
  }
  .controls.hidden {
    display: none !important;
  }
  .controls label {
    color: #aaa;
    white-space: nowrap;
    font-size: 12px;
  }
  .controls input[type="text"] {
    flex: 1;
    min-width: 120px;
    padding: 5px 8px;
    font-size: 15px;
    border: 1px solid #555;
    border-radius: 5px;
    background: #222;
    color: #fff;
  }
  .controls input[type="range"] {
    width: 80px;
  }
  .controls input[type="color"] {
    width: 32px;
    height: 26px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    background: none;
    padding: 0;
  }
  .controls input[type="file"] {
    font-size: 12px;
    color: #ccc;
    max-width: 110px;
  }
  .value {
    min-width: 36px;
    font-size: 12px;
    color: #FFD700;
  }
  button {
    padding: 5px 10px;
    font-size: 13px;
    background: #FFD700;
    color: #000;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
  }
  .btn-remove {
    background: #ff5555;
    color: #fff;
    padding: 4px 8px;
    font-size: 12px;
  }

  .marquee-area {
    height: 100%;
    height: 100dvh;
    display: flex;
    align-items: center;
  }
  .marquee-container {
    width: 100%;
    overflow: hidden;
    white-space: nowrap;
  }
  .marquee {
    display: inline-flex;
    align-items: center;
    gap: 20px;
    font-weight: 900;
    animation: scroll linear infinite;
    padding-left: 100%;
  }
  .marquee img {
    height: 1em;
    width: auto;
    vertical-align: middle;
    border-radius: 6px;
  }
  @keyframes scroll {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-100%); }
  }

  .hint {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.75);
    color: #FFD700;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s;
    z-index: 50;
    white-space: nowrap;
  }
  .hint.show {
    opacity: 1;
  }
</style>
</head>
<body>

  <div class="controls" id="controls">
    <label>文字</label>
    <input type="text" id="textInput" value="★ 大大的字 ★ 走馬燈 ★" placeholder="輸入文字">

    <label>速度</label>
    <input type="range" id="speedRange" min="3" max="30" value="12" step="1">
    <span class="value" id="speedValue">12s</span>

    <label>大小</label>
    <input type="range" id="sizeRange" min="40" max="260" value="130" step="10">
    <span class="value" id="sizeValue">130</span>

    <label>字色</label>
    <input type="color" id="colorPicker" value="#FFD700">

    <label>背景</label>
    <input type="color" id="bgColorPicker" value="#111111">

    <label>圖片</label>
    <input type="file" id="imageInput" accept="image/*">
    <button class="btn-remove" id="removeImgBtn" style="display:none;" onclick="removeImage()">移除</button>

    <button onclick="goFullscreen()">全畫面</button>
  </div>

  <div class="marquee-area" id="marqueeArea">
    <div class="marquee-container">
      <div class="marquee" id="marqueeText">
        <span id="textSpan">★ 大大的字 ★ 走馬燈 ★</span>
      </div>
    </div>
  </div>

  <div class="hint" id="hint">連按兩下畫面可返回設定</div>

<script>
  const textInput     = document.getElementById('textInput');
  const speedRange    = document.getElementById('speedRange');
  const speedValue    = document.getElementById('speedValue');
  const sizeRange     = document.getElementById('sizeRange');
  const sizeValue     = document.getElementById('sizeValue');
  const colorPicker   = document.getElementById('colorPicker');
  const bgColorPicker = document.getElementById('bgColorPicker');
  const imageInput    = document.getElementById('imageInput');
  const removeImgBtn  = document.getElementById('removeImgBtn');
  const marqueeText   = document.getElementById('marqueeText');
  const textSpan      = document.getElementById('textSpan');
  const controls      = document.getElementById('controls');
  const hint          = document.getElementById('hint');
  const marqueeArea   = document.getElementById('marqueeArea');

  let currentImage = null;

  function applySettings() {
    const text  = textInput.value.trim() || '請輸入文字';
    const speed = speedRange.value;
    const size  = sizeRange.value;
    const color = colorPicker.value;
    const bg    = bgColorPicker.value;

    textSpan.textContent = text;
    marqueeText.style.animationDuration = speed + 's';
    marqueeText.style.fontSize = size + 'px';
    marqueeText.style.color = color;
    marqueeText.style.textShadow = `0 0 10px ${color}, 0 0 20px ${color}`;
    document.body.style.background = bg;
    marqueeArea.style.background = bg;
  }

  textInput.addEventListener('input', applySettings);
  speedRange.addEventListener('input', () => {
    speedValue.textContent = speedRange.value + 's';
    applySettings();
  });
  sizeRange.addEventListener('input', () => {
    sizeValue.textContent = sizeRange.value;
    applySettings();
  });
  colorPicker.addEventListener('input', applySettings);
  bgColorPicker.addEventListener('input', applySettings);

  imageInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (event) => {
      if (currentImage) currentImage.remove();

      const img = document.createElement('img');
      img.src = event.target.result;
      img.alt = '上傳圖片';
      marqueeText.insertBefore(img, textSpan);
      currentImage = img;
      removeImgBtn.style.display = 'inline-block';
    };
    reader.readAsDataURL(file);
  });

  function removeImage() {
    if (currentImage) {
      currentImage.remove();
      currentImage = null;
    }
    imageInput.value = '';
    removeImgBtn.style.display = 'none';
  }

  function goFullscreen() {
    controls.classList.add('hidden');

    const elem = document.documentElement;
    if (elem.requestFullscreen) {
      elem.requestFullscreen().catch(() => {});
    } else if (elem.webkitRequestFullscreen) {
      elem.webkitRequestFullscreen();
    }

    hint.classList.add('show');
    setTimeout(() => hint.classList.remove('show'), 2500);
  }

  function showUI() {
    controls.classList.remove('hidden');

    if (document.fullscreenElement || document.webkitFullscreenElement) {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
  }

  // 連按兩下返回
  let lastTap = 0;
  document.addEventListener('touchend', (e) => {
    if (controls.classList.contains('hidden')) {
      const now = Date.now();
      if (now - lastTap < 300) showUI();
      lastTap = now;
    }
  });
  document.addEventListener('dblclick', () => {
    if (controls.classList.contains('hidden')) showUI();
  });

  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement) controls.classList.remove('hidden');
  });
  document.addEventListener('webkitfullscreenchange', () => {
    if (!document.webkitFullscreenElement) controls.classList.remove('hidden');
  });

  applySettings();
</script>
</body>
</html>
