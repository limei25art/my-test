<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>圖片+文字走馬燈</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  html, body {
    background: #111;
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    font-family: "Microsoft JhengHei", "PingFang TC", Arial, sans-serif;
    color: #fff;
    touch-action: manipulation;
  }

  .controls {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    background: rgba(0,0,0,0.95);
    padding: 8px 12px;
    padding-top: max(8px, env(safe-area-inset-top));
    z-index: 100;
    border-bottom: 1px solid #333;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .controls.hidden {
    display: none !important;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .row label {
    color: #aaa;
    font-size: 13px;
    white-space: nowrap;
    min-width: 36px;
  }
  #textInput {
    flex: 1;
    padding: 6px 10px;
    font-size: 15px;
    border: 1px solid #555;
    border-radius: 5px;
    background: #222;
    color: #fff;
  }

  .row-controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 14px;
  }
  .control-item {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .control-item label {
    color: #aaa;
    font-size: 12px;
    white-space: nowrap;
  }
  .control-item input[type="range"] {
    width: 90px;
  }
  .control-item input[type="color"] {
    width: 30px;
    height: 24px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    background: none;
    padding: 0;
  }
  .control-item input[type="file"] {
    font-size: 12px;
    color: #ccc;
    max-width: 100px;
  }
  .value {
    font-size: 12px;
    color: #FFD700;
    min-width: 36px;
  }
  button {
    padding: 5px 12px;
    font-size: 13px;
    background: #FFD700;
    color: #000;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
  }
  .btn-remove {
    background: #ff5555;
    color: #fff;
    padding: 4px 8px;
    font-size: 12px;
  }
  .btn-running {
    background: #22c55e;
    color: #fff;
    min-width: 90px;
  }
  .btn-running.off {
    background: #ef4444;
  }

  /* 走馬燈 */
  .marquee-area {
    height: 100%;
    height: 100dvh;
    display: flex;
    align-items: center;
  }
  .marquee-container {
    width: 100%;
    overflow: hidden;
  }
  .marquee {
    display: inline-flex;
    align-items: center;
    white-space: nowrap;
    font-weight: 900;
    animation: scroll linear infinite;
  }
  .marquee-content {
    display: inline-flex;
    align-items: center;
    gap: 30px;
    padding-right: 80px; /* 兩段之間的間距 */
  }
  .marquee img {
    height: 1em;
    width: auto;
    vertical-align: middle;
    border-radius: 6px;
  }
  @keyframes scroll {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-50%); } /* 因為內容複製了兩份 */
  }

  /* 靜止模式 */
  .static-area {
    display: none;
    height: 100%;
    height: 100dvh;
    padding: 20px;
    padding-top: 120px;
    overflow: auto;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .static-area.active {
    display: flex;
  }
  .static-content {
    font-weight: 900;
    max-width: 95%;
    word-break: break-word;
  }
  .static-content img {
    height: 1em;
    width: auto;
    vertical-align: middle;
    margin-right: 12px;
    border-radius: 6px;
  }

  .hint {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.75);
    color: #FFD700;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s;
    z-index: 50;
    white-space: nowrap;
  }
  .hint.show {
    opacity: 1;
  }
</style>
</head>
<body>

  <div class="controls" id="controls">
    <div class="row">
      <label>文字</label>
      <input type="text" id="textInput" value="★ 大大的字 ★ 走馬燈 ★" placeholder="輸入要顯示的文字">
    </div>

    <div class="row-controls">
      <div class="control-item">
        <label>速度</label>
        <input type="range" id="speedRange" min="3" max="30" value="12" step="1">
        <span class="value" id="speedValue">12s</span>
      </div>

      <div class="control-item">
        <label>大小</label>
        <input type="range" id="sizeRange" min="40" max="300" value="130" step="10">
        <span class="value" id="sizeValue">130</span>
      </div>

      <div class="control-item" id="lineHeightItem" style="display:none;">
        <label>行距</label>
        <input type="range" id="lineHeightRange" min="1" max="3" value="1.4" step="0.1">
        <span class="value" id="lineHeightValue">1.4</span>
      </div>

      <div class="control-item">
        <label>字色</label>
        <input type="color" id="colorPicker" value="#FFD700">
      </div>

      <div class="control-item">
        <label>背景</label>
        <input type="color" id="bgColorPicker" value="#111111">
      </div>

      <div class="control-item">
        <label>圖片</label>
        <input type="file" id="imageInput" accept="image/*">
        <button class="btn-remove" id="removeImgBtn" style="display:none;" onclick="removeImage()">移除</button>
      </div>

      <button class="btn-running" id="runningBtn" onclick="toggleRunning()">Running ON</button>
      <button onclick="goFullscreen()">全畫面</button>
    </div>
  </div>

  <!-- 走馬燈模式 -->
  <div class="marquee-area" id="marqueeArea">
    <div class="marquee-container">
      <div class="marquee" id="marquee">
        <!-- 內容會由 JS 動態產生兩份，做到無縫 -->
        <div class="marquee-content" id="content1">
          <span id="textSpan1">★ 大大的字 ★ 走馬燈 ★</span>
        </div>
        <div class="marquee-content" id="content2">
          <span id="textSpan2">★ 大大的字 ★ 走馬燈 ★</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 靜止模式 -->
  <div class="static-area" id="staticArea">
    <div class="static-content" id="staticContent">
      <span id="staticText">★ 大大的字 ★ 走馬燈 ★</span>
    </div>
  </div>

  <div class="hint" id="hint">連按兩下畫面可返回設定</div>

<script>
  const textInput       = document.getElementById('textInput');
  const speedRange      = document.getElementById('speedRange');
  const speedValue      = document.getElementById('speedValue');
  const sizeRange       = document.getElementById('sizeRange');
  const sizeValue       = document.getElementById('sizeValue');
  const lineHeightRange = document.getElementById('lineHeightRange');
  const lineHeightValue = document.getElementById('lineHeightValue');
  const lineHeightItem  = document.getElementById('lineHeightItem');
  const colorPicker     = document.getElementById('colorPicker');
  const bgColorPicker   = document.getElementById('bgColorPicker');
  const imageInput      = document.getElementById('imageInput');
  const removeImgBtn    = document.getElementById('removeImgBtn');
  const marquee         = document.getElementById('marquee');
  const content1        = document.getElementById('content1');
  const content2        = document.getElementById('content2');
  const textSpan1       = document.getElementById('textSpan1');
  const textSpan2       = document.getElementById('textSpan2');
  const staticContent   = document.getElementById('staticContent');
  const staticText      = document.getElementById('staticText');
  const marqueeArea     = document.getElementById('marqueeArea');
  const staticArea      = document.getElementById('staticArea');
  const controls        = document.getElementById('controls');
  const runningBtn      = document.getElementById('runningBtn');
  const hint            = document.getElementById('hint');

  let currentImageSrc = null;
  let isRunning = true;

  function applySettings() {
    const text  = textInput.value.trim() || '請輸入文字';
    const speed = speedRange.value;
    const size  = sizeRange.value;
    const color = colorPicker.value;
    const bg    = bgColorPicker.value;
    const lh    = lineHeightRange.value;

    // 更新兩份走馬燈內容
    textSpan1.textContent = text;
    textSpan2.textContent = text;

    marquee.style.animationDuration = speed + 's';
    marquee.style.fontSize = size + 'px';
    marquee.style.color = color;
    marquee.style.textShadow = `0 0 10px ${color}, 0 0 20px ${color}`;

    // 更新靜止模式
    staticText.textContent = text;
    staticContent.style.fontSize = size + 'px';
    staticContent.style.color = color;
    staticContent.style.textShadow = `0 0 10px ${color}, 0 0 20px ${color}`;
    staticContent.style.lineHeight = lh;

    // 背景
    document.body.style.background = bg;
    marqueeArea.style.background = bg;
    staticArea.style.background = bg;

    // 同步圖片
    updateImages();
  }

  function updateImages() {
    // 清除舊圖片
    content1.querySelectorAll('img').forEach(img => img.remove());
    content2.querySelectorAll('img').forEach(img => img.remove());
    const oldStaticImg = staticContent.querySelector('img');
    if (oldStaticImg) oldStaticImg.remove();

    if (currentImageSrc) {
      // 走馬燈兩份都加圖片
      [content1, content2].forEach(container => {
        const img = document.createElement('img');
        img.src = currentImageSrc;
        container.insertBefore(img, container.querySelector('span'));
      });

      // 靜止模式
      const staticImg = document.createElement('img');
      staticImg.src = currentImageSrc;
      staticContent.insertBefore(staticImg, staticText);
    }
  }

  // 即時更新
  textInput.addEventListener('input', applySettings);
  speedRange.addEventListener('input', () => {
    speedValue.textContent = speedRange.value + 's';
    applySettings();
  });
  sizeRange.addEventListener('input', () => {
    sizeValue.textContent = sizeRange.value;
    applySettings();
  });
  lineHeightRange.addEventListener('input', () => {
    lineHeightValue.textContent = lineHeightRange.value;
    applySettings();
  });
  colorPicker.addEventListener('input', applySettings);
  bgColorPicker.addEventListener('input', applySettings);

  // 上傳圖片
  imageInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (event) => {
      currentImageSrc = event.target.result;
      removeImgBtn.style.display = 'inline-block';
      applySettings();
    };
    reader.readAsDataURL(file);
  });

  function removeImage() {
    currentImageSrc = null;
    imageInput.value = '';
    removeImgBtn.style.display = 'none';
    applySettings();
  }

  // Running ON / OFF
  function toggleRunning() {
    isRunning = !isRunning;

    if (isRunning) {
      runningBtn.textContent = 'Running ON';
      runningBtn.classList.remove('off');
      marqueeArea.style.display = 'flex';
      staticArea.classList.remove('active');
      lineHeightItem.style.display = 'none';
    } else {
      runningBtn.textContent = 'Running OFF';
      runningBtn.classList.add('off');
      marqueeArea.style.display = 'none';
      staticArea.classList.add('active');
      lineHeightItem.style.display = 'flex';
    }
    applySettings();
  }

  function goFullscreen() {
    controls.classList.add('hidden');

    const elem = document.documentElement;
    if (elem.requestFullscreen) {
      elem.requestFullscreen().catch(() => {});
    } else if (elem.webkitRequestFullscreen) {
      elem.webkitRequestFullscreen();
    }

    hint.classList.add('show');
    setTimeout(() => hint.classList.remove('show'), 2500);
  }

  function showUI() {
    controls.classList.remove('hidden');

    if (document.fullscreenElement || document.webkitFullscreenElement) {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
  }

  let lastTap = 0;
  document.addEventListener('touchend', (e) => {
    if (controls.classList.contains('hidden')) {
      const now = Date.now();
      if (now - lastTap < 300) showUI();
      lastTap = now;
    }
  });
  document.addEventListener('dblclick', () => {
    if (controls.classList.contains('hidden')) showUI();
  });

  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement) controls.classList.remove('hidden');
  });
  document.addEventListener('webkitfullscreenchange', () => {
    if (!document.webkitFullscreenElement) controls.classList.remove('hidden');
  });

  applySettings();
</script>
</body>
</html>
