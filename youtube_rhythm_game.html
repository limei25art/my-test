<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>YouTube 網頁節奏遊戲</title>
    <style>
        body {
            margin: 0; background-color: #111; color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column; align-items: center; overflow: hidden;
        }
        #game-container {
            position: relative; width: 800px; height: 600px; margin-top: 20px;
            background: #000; border: 2px solid #333; border-radius: 10px; box-shadow: 0 0 20px rgba(0,255,255,0.2);
        }
        /* 將 YouTube 影片放在背景並調暗 */
        #youtube-player {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.4; pointer-events: none; z-index: 1;
        }
        /* 遊戲畫布在影片上層 */
        #game-canvas {
            position: absolute; top: 0; left: 0; z-index: 2;
        }
        #ui-layer {
            position: absolute; top: 10px; left: 20px; z-index: 3; font-size: 24px; font-weight: bold;
            text-shadow: 2px 2px 4px #000;
        }
        #start-screen, #result-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); z-index: 10;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        #result-screen { display: none; }
        .btn {
            padding: 15px 40px; font-size: 24px; font-weight: bold; cursor: pointer;
            background: linear-gradient(45deg, #ff007f, #00f0ff); color: white;
            border: none; border-radius: 30px; margin-top: 20px; transition: transform 0.2s;
        }
        .btn:hover { transform: scale(1.1); }
        .result-text { font-size: 32px; margin: 10px 0; }
        .highlight { color: #00f0ff; }
        .controls-hint { margin-top: 20px; color: #aaa; font-size: 18px; }
    </style>
</head>
<body>

    <h2>YouTube Rhythm Game 🎵</h2>
    
    <div id="game-container">
        <div id="youtube-player"></div>
        <canvas id="game-canvas" width="800" height="600"></canvas>
        
        <div id="ui-layer">
            <div>Score: <span id="score-display">0</span></div>
            <div>Combo: <span id="combo-display">0</span></div>
        </div>

        <!-- 開始畫面 -->
        <div id="start-screen">
            <h1 style="font-size: 48px; margin-bottom: 0;">太鼓 X 音遊</h1>
            <p>歌曲: Edan 呂爵安 X Ryan 蔡俊彥《1206》</p>
            <button class="btn" id="start-btn">開始遊戲</button>
            <div class="controls-hint">操作按鍵: [D] [F] [J] [K]<br>(紅色=咚/D/K，藍色=咔/F/J)</div>
        </div>

        <!-- 結算畫面 (Pop-up Results) -->
        <div id="result-screen">
            <h1 style="font-size: 48px; color: #ffeb3b;">Game Clear!</h1>
            <div class="result-text">Total Score: <span id="res-score" class="highlight">0</span></div>
            <div class="result-text">Max Combo: <span id="res-combo" class="highlight">0</span></div>
            <div class="result-text">Perfect: <span id="res-perfect">0</span> | Great: <span id="res-great">0</span> | Miss: <span id="res-miss">0</span></div>
            <button class="btn" onclick="location.reload()">再玩一次</button>
        </div>
    </div>

    <!-- 引入 YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        // --- 遊戲狀態與變數 ---
        let player, audioCtx;
        let isPlaying = false;
        let notes = [];
        let score = 0, combo = 0, maxCombo = 0;
        let perfects = 0, greats = 0, misses = 0;
        let hitFeedback = { text: "", alpha: 0, color: "" };
        
        const KEYS = ['d', 'f', 'j', 'k']; // 4條軌道的按鍵
        const HIT_LINE_Y = 500; // 判定線的 Y 座標
        const SCROLL_SPEED = 600; // 音符下落速度 (像素/秒)
        
        // --- YouTube API 初始化 ---
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                videoId: 'x2fAnFXDj9Q', // Edan 1206
                playerVars: { 'controls': 0, 'disablekb': 1, 'fs': 0, 'rel': 0 },
                events: {
                    'onStateChange': function(event) {
                        if (event.data === YT.PlayerState.ENDED) showResults();
                    }
                }
            });
        }

        // --- 生成模擬譜面 (Mock Chart Generation) ---
        function generateChart() {
            notes = [];
            let bpm = 120;
            let beatInterval = 60 / bpm; // 每拍 0.5 秒
            let startTime = 2.0; // 2秒後開始掉落
            
            // 隨機生成 50 個音符作為測試
            for (let i = 0; i < 50; i++) {
                let lane = Math.floor(Math.random() * 4);
                // lane 0,3 (外側) 設定為 'don'(紅), lane 1,2 (內側) 設定為 'ka'(藍)
                let type = (lane === 0 || lane === 3) ? 'don' : 'ka';
                notes.push({
                    id: i,
                    time: startTime + (i * beatInterval),
                    lane: lane,
                    type: type,
                    hit: false,
                    missed: false
                });
            }
        }

        // --- Web Audio API 合成打擊聲 ---
        function playBeatSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            if (type === 'don') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            } else {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(500, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            }
            
            gainNode.gain.setValueAtTime(0.8, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        // --- 開始遊戲按鈕邏輯 ---
        document.getElementById('start-btn').addEventListener('click', () => {
            document.getElementById('start-screen').style.display = 'none';
            // 初始化音效 (必須由使用者互動觸發)
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            generateChart();
            player.playVideo();
            isPlaying = true;
            requestAnimationFrame(gameLoop);
            
            // 遊戲會在 30 秒後自動結束展示結算 (因為完整版 MV 太長)
            setTimeout(showResults, 30000); 
        });

        // --- 鍵盤輸入判定邏輯 ---
        window.addEventListener('keydown', (e) => {
            if (!isPlaying) return;
            let key = e.key.toLowerCase();
            let laneIndex = KEYS.indexOf(key);
            if (laneIndex === -1) return;

            let currentTime = player.getCurrentTime();
            
            // 根據類型發出音效
            playBeatSound((laneIndex === 0 || laneIndex === 3) ? 'don' : 'ka');

            // 尋找該軌道中最接近判定線且未打擊的音符
            let targetNote = notes.find(n => n.lane === laneIndex && !n.hit && !n.missed);
            
            if (targetNote) {
                let timeDiff = Math.abs(targetNote.time - currentTime);
                
                if (timeDiff <= 0.08) { // Perfect 判定 (80ms內)
                    handleHit(targetNote, "Perfect!", "#00ffff", 100);
                    perfects++;
                } else if (timeDiff <= 0.15) { // Great 判定 (150ms內)
                    handleHit(targetNote, "Great!", "#88ff00", 50);
                    greats++;
                }
            }
        });

        function handleHit(note, text, color, pts) {
            note.hit = true;
            score += pts + (combo * 2); // 連擊加成
            combo++;
            if (combo > maxCombo) maxCombo = combo;
            
            hitFeedback = { text: text, alpha: 1.0, color: color };
            
            document.getElementById('score-display').innerText = score;
            document.getElementById('combo-display').innerText = combo;
        }

        // --- 遊戲主渲染迴圈 (Canvas) ---
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const laneWidth = 100;
        const offsetX = (canvas.width - (laneWidth * 4)) / 2;

        function gameLoop() {
            if (!isPlaying) return;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let currentTime = player.getCurrentTime() || 0;

            // 1. 畫軌道與判定線
            ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
            for (let i=0; i<4; i++) {
                ctx.fillRect(offsetX + (i * laneWidth), 0, laneWidth - 2, canvas.height);
            }
            // 判定線
            ctx.fillStyle = '#fff';
            ctx.fillRect(offsetX, HIT_LINE_Y - 2, laneWidth * 4, 4);

            // 2. 畫音符與處理 Miss
            notes.forEach(note => {
                if (note.hit || note.missed) return;

                // 計算 Y 座標 ( 時間差 * 下落速度 )
                let y = HIT_LINE_Y - ((note.time - currentTime) * SCROLL_SPEED);

                // Miss 判定 (超過判定線 0.15 秒)
                if (currentTime - note.time > 0.15) {
                    note.missed = true;
                    combo = 0;
                    misses++;
                    hitFeedback = { text: "Miss", alpha: 1.0, color: "#ff0000" };
                    document.getElementById('combo-display').innerText = combo;
                }

                // 只畫出畫面內的音符
                if (y > -50 && y < canvas.height + 50) {
                    ctx.beginPath();
                    ctx.arc(offsetX + (note.lane * laneWidth) + (laneWidth/2), y, 30, 0, Math.PI * 2);
                    // 紅色(咚), 藍色(咔)
                    ctx.fillStyle = note.type === 'don' ? '#ff0055' : '#00aaff';
                    ctx.fill();
                    ctx.lineWidth = 3;
                    ctx.strokeStyle = '#fff';
                    ctx.stroke();
                }
            });

            // 3. 畫判定回饋文字 (Perfect / Great / Miss)
            if (hitFeedback.alpha > 0) {
                ctx.fillStyle = `rgba(${hexToRgb(hitFeedback.color)}, ${hitFeedback.alpha})`;
                ctx.font = 'bold 40px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(hitFeedback.text, canvas.width / 2, HIT_LINE_Y - 100);
                hitFeedback.alpha -= 0.02; // 淡出動畫
            }

            requestAnimationFrame(gameLoop);
        }

        // --- 顯示結算畫面 ---
        function showResults() {
            if (!isPlaying) return;
            isPlaying = false;
            player.pauseVideo();
            
            document.getElementById('res-score').innerText = score;
            document.getElementById('res-combo').innerText = maxCombo;
            document.getElementById('res-perfect').innerText = perfects;
            document.getElementById('res-great').innerText = greats;
            document.getElementById('res-miss').innerText = misses;
            
            document.getElementById('result-screen').style.display = 'flex';
        }

        // 輔助函式：Hex 色碼轉 RGB 供透明度動畫使用
        function hexToRgb(hex) {
            let result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? `${parseInt(result[1], 16)}, ${parseInt(result[2], 16)}, ${parseInt(result[3], 16)}` : "255,255,255";
        }
    </script>
</body>
</html>
