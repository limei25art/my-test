<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YouTube 節拍音遊 (AI 譜面片段生成版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Orbitron', sans-serif;
            background-color: #050505;
            color: white;
            overflow: hidden;
            touch-action: none;
        }

        .neon-text {
            text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px #0ff, 0 0 40px #0ff, 0 0 80px #0ff;
        }
        .neon-border {
            box-shadow: 0 0 5px #0ff, 0 0 10px #0ff inset;
            border: 1px solid #0ff;
        }
        
        .glass-panel {
            background: rgba(10, 10, 20, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #ytplayer-container {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 100vh;
            transform: translate(-50%, -50%);
            pointer-events: none;
            opacity: 0.35;
            z-index: 0;
        }
        @media (min-aspect-ratio: 16/9) {
            #ytplayer-container { height: 300vw; margin-top: -100vw; }
        }
        @media (max-aspect-ratio: 16/9) {
            #ytplayer-container { width: 300vh; margin-left: -100vh; }
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }

        .ui-layer {
            position: absolute;
            z-index: 20;
        }
        
        .loader {
            border: 4px solid rgba(0, 255, 255, 0.2);
            border-top: 4px solid #0ff;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="w-screen h-screen">

    <!-- YouTube 背景影片容器 -->
    <div id="ytplayer-container">
        <div id="player"></div>
    </div>

    <!-- 遊戲主繪圖畫布 -->
    <canvas id="gameCanvas"></canvas>

    <!-- 抬頭顯示器 (HUD) -->
    <div id="hud" class="ui-layer top-0 left-0 w-full p-6 flex justify-between items-start pointer-events-none hidden">
        <div class="flex flex-col">
            <span class="text-gray-400 text-sm tracking-widest font-bold">SCORE</span>
            <span id="scoreDisplay" class="text-4xl font-black text-white neon-text">000000</span>
        </div>
        <div class="flex flex-col items-center">
            <span class="text-cyan-400 text-xs tracking-widest font-bold bg-cyan-950/80 px-3 py-1 rounded-full border border-cyan-500/30 mb-1" id="timeDisplay">TIME: 01:00</span>
        </div>
        <div class="flex flex-col items-end">
            <span class="text-gray-400 text-sm tracking-widest font-bold">COMBO</span>
            <span id="comboDisplay" class="text-5xl font-black text-pink-400">0</span>
        </div>
    </div>

    <!-- 啟動與設定畫面 -->
    <div id="setupScreen" class="ui-layer inset-0 flex items-center justify-center bg-black/80 backdrop-blur-md transition-opacity duration-500">
        <div class="glass-panel p-8 rounded-2xl flex flex-col items-center w-11/12 max-w-md text-center border-t-2 border-cyan-400">
            <h1 class="text-3xl font-black mb-1 neon-text text-cyan-400 tracking-wider">AI TUBE RHYTHM</h1>
            <p class="text-gray-400 text-xs mb-6">C-LSTM AI Chart Generation with Time Offset</p>
            
            <!-- YouTube ID 輸入 -->
            <div class="w-full mb-4">
                <label class="block text-left text-xs text-cyan-200 mb-1 font-bold tracking-widest">YOUTUBE VIDEO ID</label>
                <input type="text" id="videoIdInput" value="x2fAnFXDj9Q" class="w-full bg-gray-900/90 border border-cyan-700/50 text-white px-4 py-2.5 rounded focus:outline-none focus:border-cyan-400 transition-colors text-center text-base tracking-widest font-mono">
            </div>

            <!-- 時間點設定 (預設 1 分鐘 = 60 秒) -->
            <div class="w-full mb-6">
                <div class="flex justify-between items-center mb-1">
                    <label class="text-left text-xs text-cyan-200 font-bold tracking-widest">START TIME (秒 / 秒數)</label>
                    <span id="timeLabel" class="text-xs text-pink-400 font-bold font-mono">60s (01:00)</span>
                </div>
                <div class="flex items-center gap-2">
                    <input type="number" id="startTimeInput" value="60" min="0" max="600" class="w-full bg-gray-900/90 border border-cyan-700/50 text-white px-4 py-2.5 rounded focus:outline-none focus:border-cyan-400 text-center text-lg font-bold font-mono text-cyan-300">
                    <button id="quick1MinBtn" class="bg-cyan-900/50 hover:bg-cyan-800 border border-cyan-500/50 text-cyan-200 text-xs px-3 py-3 rounded font-bold whitespace-nowrap">
                        1 分鐘
                    </button>
                </div>
            </div>

            <!-- 按鍵指引 -->
            <div class="w-full flex justify-between mb-8 text-sm text-gray-300">
                <div class="flex flex-col items-center"><span class="font-bold text-2xl mb-1 border-2 border-gray-600 rounded-lg w-10 h-10 flex items-center justify-center bg-gray-800">D</span><span class="text-xs">Lane 1</span></div>
                <div class="flex flex-col items-center"><span class="font-bold text-2xl mb-1 border-2 border-gray-600 rounded-lg w-10 h-10 flex items-center justify-center bg-gray-800">F</span><span class="text-xs">Lane 2</span></div>
                <div class="flex flex-col items-center"><span class="font-bold text-2xl mb-1 border-2 border-gray-600 rounded-lg w-10 h-10 flex items-center justify-center bg-gray-800">J</span><span class="text-xs">Lane 3</span></div>
                <div class="flex flex-col items-center"><span class="font-bold text-2xl mb-1 border-2 border-gray-600 rounded-lg w-10 h-10 flex items-center justify-center bg-gray-800">K</span><span class="text-xs">Lane 4</span></div>
            </div>

            <button id="startBtn" class="neon-border w-full py-4 rounded-xl text-cyan-400 font-bold tracking-widest text-lg hover:bg-cyan-900/40 transition-all active:scale-95 disabled:opacity-50 flex justify-center items-center gap-3">
                <span>GENERATE FROM 1 MIN & PLAY</span>
            </button>
        </div>
    </div>

    <!-- 結算彈出視窗 (Pop-up Results) -->
    <div id="resultsModal" class="ui-layer inset-0 flex items-center justify-center bg-black/90 hidden opacity-0 transition-opacity duration-500">
        <div class="glass-panel p-8 rounded-3xl flex flex-col items-center w-11/12 max-w-lg border-t-4 border-cyan-400 relative overflow-hidden">
            <div class="absolute -top-10 -right-10 w-32 h-32 bg-cyan-500/20 rounded-full blur-2xl"></div>
            <h2 class="text-4xl font-black mb-6 tracking-widest text-white">TRACK CLEARED</h2>
            <div class="w-full grid grid-cols-2 gap-4 mb-8">
                <div class="bg-gray-800/50 p-4 rounded-xl flex flex-col items-center border border-gray-700">
                    <span class="text-gray-400 text-xs mb-1">FINAL SCORE</span>
                    <span id="resScore" class="text-3xl font-bold text-cyan-400">0</span>
                </div>
                <div class="bg-gray-800/50 p-4 rounded-xl flex flex-col items-center border border-gray-700">
                    <span class="text-gray-400 text-xs mb-1">MAX COMBO</span>
                    <span id="resCombo" class="text-3xl font-bold text-pink-400">0</span>
                </div>
                <div class="bg-gray-800/50 p-4 rounded-xl flex flex-col items-center border border-gray-700 col-span-2">
                    <span class="text-gray-400 text-xs mb-1">ACCURACY</span>
                    <span id="resAccuracy" class="text-4xl font-bold text-yellow-400">0.00%</span>
                </div>
            </div>
            <div class="flex space-x-6 text-sm mb-8 w-full justify-center">
                <div class="text-center"><span class="block text-green-400 font-bold text-lg" id="resPerfect">0</span>Perfect</div>
                <div class="text-center"><span class="block text-blue-400 font-bold text-lg" id="resGreat">0</span>Great</div>
                <div class="text-center"><span class="block text-red-400 font-bold text-lg" id="resMiss">0</span>Miss</div>
            </div>
            <button id="restartBtn" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-3 rounded-lg tracking-widest transition-colors">
                RETURN TO MENU
            </button>
        </div>
    </div>

    <script>
        // --- Web Audio API (動態合成敲擊音效) ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }
        function playHitSound(isDon = true) {
            if (!audioCtx) return;
            const t = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            const startFreq = isDon ? 400 : 800; 
            const endFreq = isDon ? 50 : 150;

            osc.type = 'sine';
            osc.frequency.setValueAtTime(startFreq, t);
            osc.frequency.exponentialRampToValueAtTime(endFreq, t + 0.1);
            
            gain.gain.setValueAtTime(0.8, t);
            gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(t);
            osc.stop(t + 0.1);
        }

        // --- YouTube API ---
        let ytPlayer;
        let isYtReady = false;
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('player', {
                height: '100%', width: '100%',
                videoId: document.getElementById('videoIdInput').value,
                playerVars: { 'playsinline': 1, 'controls': 0, 'disablekb': 1, 'fs': 0, 'modestbranding': 1, 'rel': 0 },
                events: { 'onReady': onPlayerReady, 'onStateChange': onPlayerStateChange }
            });
        }
        function onPlayerReady(event) {
            isYtReady = true;
            document.getElementById('startBtn').innerText = "GENERATE FROM 1 MIN & PLAY";
            document.getElementById('startBtn').disabled = false;
        }
        function onPlayerStateChange(event) {
            if (event.data == YT.PlayerState.PLAYING && game.state === 'waiting_video') {
                game.startVideoSync();
            } else if (event.data == YT.PlayerState.ENDED) {
                game.endGame();
            }
        }

        // --- 模擬 AI 後端從指定時間點 (例: 60秒) 生成譜面 ---
        async function fetchAIGeneratedChart(videoId, startOffset = 60) {
            return new Promise(resolve => {
                setTimeout(() => {
                    const mockJson = {
                        metadata: { title: "AI Generated Track", bpm: 128, startOffset: startOffset },
                        notes: []
                    };
                    
                    // 從 startOffset 秒開始，生成 40 秒長度的精準 AI 節拍
                    let currentTime = startOffset + 1.5; 
                    const endTime = startOffset + 45.0;

                    while(currentTime < endTime) {
                        mockJson.notes.push({
                            id: Math.floor(Math.random()*100000),
                            time: currentTime,
                            type: Math.random() > 0.5 ? 'don' : 'ka',
                            lane: Math.floor(Math.random() * 4)
                        });
                        currentTime += (Math.random() > 0.75) ? 0.234 : 0.468; // 對齊 128 BPM 網格
                    }
                    resolve(mockJson);
                }, 1000); // 後端指定時間區段生成僅需 1 秒
            });
        }

        // --- 遊戲核心引擎 ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resize() {
            width = window.innerWidth; height = window.innerHeight;
            canvas.width = width; canvas.height = height;
            if (game) game.updateDimensions();
        }
        window.addEventListener('resize', resize);
        const keys = ['d', 'f', 'j', 'k'];
        
        class Game {
            constructor() {
                this.state = 'setup'; 
                this.chartData = null;
                this.notes = [];
                this.particles = [];
                this.judgments = [];
                
                this.score = 0; this.combo = 0; this.maxCombo = 0;
                this.stats = { perfect: 0, great: 0, miss: 0 };
                this.gameStartTime = 0;
                this.startTimeOffset = 60;
                
                this.lanes = 4;
                this.laneWidth = 0; this.startX = 0; this.hitY = 0; this.noteSpeed = 0;
                this.keyStates = [false, false, false, false];
                this.laneGlows = [0, 0, 0, 0];
                
                this.colors = ['#ff0055', '#00e5ff', '#00e5ff', '#ff0055'];
                this.updateDimensions();
            }

            updateDimensions() {
                const maxLaneWidth = 120;
                this.laneWidth = Math.min(width / 5, maxLaneWidth);
                this.startX = (width - (this.laneWidth * this.lanes)) / 2;
                this.hitY = height * 0.85;
                this.noteSpeed = height / 1.5;
            }

            async initPlay() {
                initAudio();
                const btn = document.getElementById('startBtn');
                this.startTimeOffset = parseFloat(document.getElementById('startTimeInput').value) || 60;
                
                btn.innerHTML = `<div class="loader"></div><span>ANALYZING FROM ${this.startTimeOffset}s...</span>`;
                btn.disabled = true;
                this.state = 'fetching';
                
                const vid = document.getElementById('videoIdInput').value.trim();
                
                try {
                    // 請求後端 AI 生成指定秒數之後的譜面
                    this.chartData = await fetchAIGeneratedChart(vid, this.startTimeOffset);
                    this.notes = this.chartData.notes.map(n => ({ ...n, active: true }));
                } catch (e) {
                    console.error("AI Chart fetch failed", e);
                    btn.innerText = "ERROR FETCHING CHART";
                    return;
                }

                this.state = 'waiting_video';
                document.getElementById('setupScreen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('setupScreen').classList.add('hidden');
                    document.getElementById('hud').classList.remove('hidden');
                }, 500);

                this.score = 0; this.combo = 0; this.maxCombo = 0;
                this.stats = { perfect: 0, great: 0, miss: 0 };
                this.updateHUD();
                
                // 跳轉影片至指定秒數 (如 60 秒) 並播放
                if (vid) {
                    ytPlayer.loadVideoById({ videoId: vid, startSeconds: this.startTimeOffset });
                } else {
                    ytPlayer.seekTo(this.startTimeOffset, true);
                    ytPlayer.playVideo();
                }
                
                requestAnimationFrame(() => this.loop());
            }

            startVideoSync() {
                this.state = 'playing';
                this.gameStartTime = performance.now() - (ytPlayer.getCurrentTime() * 1000);
            }

            getCurrentAudioTime() {
                const ytTime = ytPlayer.getCurrentTime() * 1000;
                const perfTime = performance.now() - this.gameStartTime;
                if (Math.abs(ytTime - perfTime) > 150 && ytPlayer.getPlayerState() === YT.PlayerState.PLAYING) {
                    this.gameStartTime = performance.now() - ytTime;
                }
                return (performance.now() - this.gameStartTime) / 1000;
            }

            handleInput(laneIdx) {
                if (this.state !== 'playing') return;
                this.keyStates[laneIdx] = true;
                this.laneGlows[laneIdx] = 1.0;
                
                const currentTime = this.getCurrentAudioTime();
                let targetNote = null;
                let minDiff = Infinity;
                
                for (let i = 0; i < this.notes.length; i++) {
                    const note = this.notes[i];
                    if (note.active && note.lane === laneIdx) {
                        const diff = Math.abs(note.time - currentTime);
                        if (diff < 0.15 && diff < minDiff) {
                            minDiff = diff;
                            targetNote = note;
                        }
                    }
                }

                if (targetNote) {
                    targetNote.active = false;
                    playHitSound(targetNote.type === 'don');
                    
                    if (minDiff < 0.05) {
                        this.score += 100 + (this.combo * 5);
                        this.combo++; this.stats.perfect++;
                        this.showJudgment('PERFECT', '#00ffcc', laneIdx);
                        this.spawnParticles(laneIdx, this.colors[laneIdx]);
                    } else {
                        this.score += 50 + (this.combo * 2);
                        this.combo++; this.stats.great++;
                        this.showJudgment('GREAT', '#44aaff', laneIdx);
                        this.spawnParticles(laneIdx, '#ffffff');
                    }
                    if (this.combo > this.maxCombo) this.maxCombo = this.combo;
                    this.updateHUD();
                } else {
                    playHitSound(laneIdx === 0 || laneIdx === 3);
                }
            }
            handleKeyUp(laneIdx) { this.keyStates[laneIdx] = false; }

            showJudgment(text, color, laneIdx) {
                const x = this.startX + laneIdx * this.laneWidth + this.laneWidth / 2;
                this.judgments.push({ text, color, x, y: this.hitY - 80, life: 1.0 });
            }
            spawnParticles(laneIdx, color) {
                const x = this.startX + laneIdx * this.laneWidth + this.laneWidth / 2;
                for (let i = 0; i < 15; i++) {
                    this.particles.push({
                        x, y: this.hitY,
                        vx: (Math.random() - 0.5) * 500,
                        vy: (Math.random() - 1) * 500,
                        life: 1.0, color, size: Math.random() * 6 + 2
                    });
                }
            }
            updateHUD() {
                document.getElementById('scoreDisplay').innerText = String(this.score).padStart(6, '0');
                const comboEl = document.getElementById('comboDisplay');
                comboEl.innerText = this.combo;
                comboEl.style.transform = 'scale(1.3)';
                setTimeout(() => comboEl.style.transform = 'scale(1)', 100);
            }

            loop() {
                if (this.state !== 'playing' && this.state !== 'waiting_video') return;
                ctx.clearRect(0, 0, width, height);
                
                if (this.state === 'playing') {
                    const currentTime = this.getCurrentAudioTime();
                    const dt = 1/60;
                    
                    // 更新頂部時間顯示 (例: 01:15)
                    const mins = String(Math.floor(currentTime / 60)).padStart(2, '0');
                    const secs = String(Math.floor(currentTime % 60)).padStart(2, '0');
                    document.getElementById('timeDisplay').innerText = `TIME: ${mins}:${secs}`;

                    this.updateLogic(currentTime, dt);
                    this.drawEnvironment();
                    this.drawNotes(currentTime);
                    this.drawEffects(dt);
                }
                requestAnimationFrame(() => this.loop());
            }

            updateLogic(currentTime, dt) {
                for (let i = 0; i < this.notes.length; i++) {
                    const note = this.notes[i];
                    if (note.active && (currentTime - note.time > 0.15)) { 
                        note.active = false;
                        this.combo = 0; this.stats.miss++;
                        this.showJudgment('MISS', '#ff3333', note.lane);
                        this.updateHUD();
                    }
                }
            }

            drawEnvironment() {
                const gradient = ctx.createLinearGradient(0, height/2, 0, height);
                gradient.addColorStop(0, 'rgba(0,0,0,0)');
                gradient.addColorStop(1, 'rgba(0, 255, 255, 0.05)');
                ctx.fillStyle = gradient;
                ctx.fillRect(this.startX, 0, this.lanes * this.laneWidth, height);

                ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                for (let i = 0; i <= this.lanes; i++) {
                    const x = this.startX + i * this.laneWidth;
                    ctx.moveTo(x, 0); ctx.lineTo(x, height);
                }
                ctx.stroke();

                ctx.shadowBlur = 15;
                ctx.shadowColor = '#0ff';
                ctx.strokeStyle = 'rgba(0, 255, 255, 0.8)';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(this.startX, this.hitY);
                ctx.lineTo(this.startX + this.lanes * this.laneWidth, this.hitY);
                ctx.stroke();
                ctx.shadowBlur = 0;

                for (let i = 0; i < this.lanes; i++) {
                    const x = this.startX + i * this.laneWidth;
                    if (this.laneGlows[i] > 0) {
                        this.laneGlows[i] -= 0.05;
                        if (this.laneGlows[i] < 0) this.laneGlows[i] = 0;
                        ctx.fillStyle = `rgba(255, 255, 255, ${this.laneGlows[i] * 0.2})`;
                        ctx.fillRect(x, 0, this.laneWidth, height);
                    }

                    ctx.fillStyle = this.keyStates[i] ? this.colors[i] : 'rgba(30, 30, 40, 0.8)';
                    ctx.strokeStyle = this.colors[i];
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    const w = this.laneWidth - 16;
                    ctx.roundRect ? ctx.roundRect(x + 8, this.hitY - 25, w, 50, 8) : ctx.rect(x + 8, this.hitY - 25, w, 50);
                    ctx.fill(); ctx.stroke();
                    
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 24px Orbitron';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(keys[i].toUpperCase(), x + this.laneWidth/2, this.hitY);
                }
            }

            drawNotes(currentTime) {
                for (let i = 0; i < this.notes.length; i++) {
                    const note = this.notes[i];
                    if (!note.active) continue;
                    
                    const timeDiff = note.time - currentTime;
                    const y = this.hitY - (timeDiff * this.noteSpeed);
                    
                    if (y > -100 && y < height + 100) {
                        const x = this.startX + note.lane * this.laneWidth;
                        const w = this.laneWidth - 24;
                        const h = 24;
                        const nx = x + 12;
                        const ny = y - h/2;
                        
                        ctx.shadowBlur = 10;
                        ctx.shadowColor = this.colors[note.lane];
                        ctx.fillStyle = '#ffffff';
                        ctx.beginPath();
                        ctx.roundRect ? ctx.roundRect(nx, ny, w, h, 12) : ctx.rect(nx, ny, w, h);
                        ctx.fill();
                        
                        ctx.shadowBlur = 0;
                        ctx.fillStyle = this.colors[note.lane];
                        ctx.beginPath();
                        ctx.roundRect ? ctx.roundRect(nx + 4, ny + 4, w - 8, h - 8, 8) : ctx.rect(nx + 4, ny + 4, w - 8, h - 8);
                        ctx.fill();
                    }
                }
            }

            drawEffects(dt) {
                for (let i = this.judgments.length - 1; i >= 0; i--) {
                    const j = this.judgments[i];
                    j.life -= dt * 2.0;
                    j.y -= dt * 40;
                    if (j.life <= 0) { this.judgments.splice(i, 1); continue; }
                    ctx.globalAlpha = j.life;
                    ctx.fillStyle = j.color;
                    ctx.font = '900 28px Orbitron';
                    ctx.textAlign = 'center';
                    ctx.shadowBlur = 15; ctx.shadowColor = j.color;
                    ctx.fillText(j.text, j.x, j.y);
                    ctx.shadowBlur = 0; ctx.globalAlpha = 1.0;
                }
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    p.x += p.vx * dt; p.y += p.vy * dt;
                    p.vy += 1000 * dt;
                    p.life -= dt * 2.0;
                    if (p.life <= 0) { this.particles.splice(i, 1); continue; }
                    ctx.globalAlpha = p.life;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1.0;
                }
            }

            endGame() {
                if (this.state === 'ended') return;
                this.state = 'ended';
                document.getElementById('hud').classList.add('hidden');
                
                const totalPlayed = this.stats.perfect + this.stats.great + this.stats.miss;
                let accuracy = totalPlayed > 0 ? ((this.stats.perfect * 1 + this.stats.great * 0.5) / totalPlayed) * 100 : 0;
                
                document.getElementById('resScore').innerText = this.score;
                document.getElementById('resCombo').innerText = this.maxCombo;
                document.getElementById('resAccuracy').innerText = accuracy.toFixed(2) + '%';
                document.getElementById('resPerfect').innerText = this.stats.perfect;
                document.getElementById('resGreat').innerText = this.stats.great;
                document.getElementById('resMiss').innerText = this.stats.miss;
                
                const modal = document.getElementById('resultsModal');
                modal.classList.remove('hidden');
                void modal.offsetWidth; 
                modal.style.opacity = '1';
            }

            reset() {
                const modal = document.getElementById('resultsModal');
                modal.style.opacity = '0';
                setTimeout(() => {
                    modal.classList.add('hidden');
                    const btn = document.getElementById('startBtn');
                    btn.innerHTML = `GENERATE FROM 1 MIN & PLAY`;
                    btn.disabled = false;
                    document.getElementById('setupScreen').classList.remove('hidden');
                    void document.getElementById('setupScreen').offsetWidth;
                    document.getElementById('setupScreen').style.opacity = '1';
                }, 500);
            }
        }

        const game = new Game();
        resize();

        // 快捷按鈕：快速設為 60 秒 (1 分鐘)
        document.getElementById('quick1MinBtn').addEventListener('click', () => {
            const input = document.getElementById('startTimeInput');
            input.value = 60;
            document.getElementById('timeLabel').innerText = "60s (01:00)";
        });

        document.getElementById('startTimeInput').addEventListener('input', (e) => {
            const val = parseInt(e.target.value) || 0;
            const m = String(Math.floor(val / 60)).padStart(2, '0');
            const s = String(val % 60).padStart(2, '0');
            document.getElementById('timeLabel').innerText = `${val}s (${m}:${s})`;
        });

        document.getElementById('startBtn').addEventListener('click', () => {
            if (isYtReady) game.initPlay();
        });
        document.getElementById('restartBtn').addEventListener('click', () => game.reset());

        window.addEventListener('keydown', (e) => {
            if (e.repeat) return;
            const idx = keys.indexOf(e.key.toLowerCase());
            if (idx !== -1) game.handleInput(idx);
        });
        window.addEventListener('keyup', (e) => {
            const idx = keys.indexOf(e.key.toLowerCase());
            if (idx !== -1) game.handleKeyUp(idx);
        });
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                if (touch.clientX >= game.startX && touch.clientX <= game.startX + game.lanes * game.laneWidth) {
                    const laneIdx = Math.floor((touch.clientX - game.startX) / game.laneWidth);
                    game.handleInput(laneIdx);
                }
            }
        }, { passive: false });
        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            for(let i=0; i<4; i++) game.handleKeyUp(i);
        }, { passive: false });

    </script>
</body>
</html>
