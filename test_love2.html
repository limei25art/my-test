<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>【追星族矛盾大對決】測你的雙標與情緒勒索指數</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
  
  :root {
    --pink: #ff6b9d;
    --purple: #9b59b6;
    --dark: #2c3e50;
    --light: #fef6f9;
    --card: #ffffff;
    --shadow: 0 10px 30px rgba(255, 107, 157, 0.15);
  }
  
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  
  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: linear-gradient(135deg, #fff0f5 0%, #f3e5f5 50%, #e8f4fd 100%);
    min-height: 100vh;
    color: var(--dark);
    line-height: 1.6;
  }
  
  .container {
    max-width: 720px;
    margin: 0 auto;
    padding: 20px;
  }
  
  /* Header */
  .header {
    text-align: center;
    padding: 40px 20px 30px;
    animation: fadeIn 0.8s ease;
  }
  
  .header h1 {
    font-size: 2rem;
    font-weight: 900;
    background: linear-gradient(90deg, var(--pink), var(--purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 10px;
  }
  
  .header p {
    color: #666;
    font-size: 1rem;
  }
  
  .badge {
    display: inline-block;
    background: linear-gradient(90deg, var(--pink), var(--purple));
    color: white;
    padding: 6px 16px;
    border-radius: 50px;
    font-size: 0.85rem;
    font-weight: 700;
    margin-top: 12px;
  }
  
  /* Progress */
  .progress-bar {
    height: 8px;
    background: #eee;
    border-radius: 10px;
    margin: 20px 0 30px;
    overflow: hidden;
  }
  
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--pink), var(--purple));
    border-radius: 10px;
    transition: width 0.4s ease;
    width: 0%;
  }
  
  /* Card */
  .card {
    background: var(--card);
    border-radius: 20px;
    padding: 30px;
    box-shadow: var(--shadow);
    margin-bottom: 20px;
    animation: slideUp 0.5s ease;
  }
  
  .question-num {
    font-size: 0.9rem;
    color: var(--pink);
    font-weight: 700;
    margin-bottom: 8px;
  }
  
  .question-text {
    font-size: 1.25rem;
    font-weight: 700;
    margin-bottom: 25px;
    color: var(--dark);
  }
  
  .option {
    display: block;
    width: 100%;
    text-align: left;
    padding: 16px 20px;
    margin-bottom: 12px;
    border: 2px solid #f0e6ef;
    border-radius: 14px;
    background: #fafafa;
    cursor: pointer;
    transition: all 0.25s ease;
    font-size: 1rem;
    color: var(--dark);
  }
  
  .option:hover {
    border-color: var(--pink);
    background: #fff5f8;
    transform: translateX(6px);
  }
  
  .option.selected {
    border-color: var(--pink);
    background: linear-gradient(90deg, #fff0f5, #fce4ec);
    box-shadow: 0 4px 15px rgba(255, 107, 157, 0.2);
  }
  
  .option span {
    font-weight: 700;
    color: var(--pink);
    margin-right: 10px;
  }
  
  /* Buttons */
  .btn-group {
    display: flex;
    gap: 12px;
    margin-top: 10px;
  }
  
  .btn {
    flex: 1;
    padding: 16px;
    border: none;
    border-radius: 14px;
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
    font-family: inherit;
  }
  
  .btn-primary {
    background: linear-gradient(90deg, var(--pink), var(--purple));
    color: white;
  }
  
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(255, 107, 157, 0.4);
  }
  
  .btn-primary:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }
  
  .btn-secondary {
    background: #f0e6ef;
    color: var(--dark);
  }
  
  .btn-secondary:hover {
    background: #e8d5e4;
  }
  
  /* Result */
  .result-card {
    text-align: center;
    padding: 40px 30px;
  }
  
  .result-level {
    font-size: 1.1rem;
    color: var(--pink);
    font-weight: 700;
    margin-bottom: 8px;
  }
  
  .result-title {
    font-size: 1.8rem;
    font-weight: 900;
    margin-bottom: 20px;
    background: linear-gradient(90deg, var(--pink), var(--purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  
  .result-emoji {
    font-size: 4rem;
    margin: 20px 0;
  }
  
  .result-desc {
    font-size: 1.05rem;
    color: #555;
    text-align: left;
    line-height: 1.8;
    background: #faf5f8;
    padding: 20px;
    border-radius: 14px;
    margin-bottom: 25px;
  }
  
  .result-score {
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--purple);
    margin-bottom: 25px;
  }
  
  .share-tip {
    font-size: 0.9rem;
    color: #888;
    margin-top: 15px;
  }
  
  /* Start Screen */
  .start-card {
    text-align: center;
    padding: 50px 30px;
  }
  
  .start-card h2 {
    font-size: 1.6rem;
    margin-bottom: 15px;
  }
  
  .start-card p {
    color: #666;
    margin-bottom: 30px;
    font-size: 1.05rem;
  }
  
  .feature-list {
    text-align: left;
    margin: 25px auto;
    max-width: 360px;
  }
  
  .feature-list li {
    margin-bottom: 10px;
    list-style: none;
    position: relative;
    padding-left: 28px;
  }
  
  .feature-list li::before {
    content: "✦";
    position: absolute;
    left: 0;
    color: var(--pink);
  }
  
  /* Animations */
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  
  /* Hidden */
  .hidden {
    display: none !important;
  }
  
  /* Responsive */
  @media (max-width: 480px) {
    .header h1 { font-size: 1.5rem; }
    .question-text { font-size: 1.1rem; }
    .card { padding: 22px; }
    .result-title { font-size: 1.5rem; }
  }
</style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <h1>追星族矛盾大對決</h1>
      <p>測測你的雙標指數 & 情緒勒索傾向</p>
      <div class="badge">10 題 · 6 級結果 · 誠實作答</div>
    </div>
    
    <!-- Progress -->
    <div class="progress-bar" id="progressBar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    
    <!-- Start Screen -->
    <div class="card start-card" id="startScreen">
      <h2>準備好面對真實的自己了嗎？</h2>
      <p>這個測試會挖掘你在追星路上可能出現的雙標行為與情緒勒索傾向。<br>沒有標準答案，只有更了解自己。</p>
      <ul class="feature-list">
        <li>共 10 題情境選擇</li>
        <li>每題選最符合你的敘述</li>
        <li>結果分 6 個等級</li>
        <li>完全匿名 · 本地計算</li>
      </ul>
      <button class="btn btn-primary" onclick="startQuiz()" style="max-width:280px;margin:0 auto;">開始挑戰</button>
    </div>
    
    <!-- Quiz Screen -->
    <div class="card hidden" id="quizScreen">
      <div class="question-num" id="qNum">第 1 題 / 10</div>
      <div class="question-text" id="qText"></div>
      <div id="options"></div>
      <div class="btn-group">
        <button class="btn btn-secondary" id="prevBtn" onclick="prevQuestion()" style="display:none;">上一題</button>
        <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" disabled>下一題</button>
      </div>
    </div>
    
    <!-- Result Screen -->
    <div class="card result-card hidden" id="resultScreen">
      <div class="result-level" id="resultLevel"></div>
      <div class="result-title" id="resultTitle"></div>
      <div class="result-emoji" id="resultEmoji"></div>
      <div class="result-score" id="resultScore"></div>
      <div class="result-desc" id="resultDesc"></div>
      <button class="btn btn-primary" onclick="restartQuiz()">再測一次</button>
      <p class="share-tip">截圖分享結果給同擔朋友，一起對決吧！</p>
    </div>
  </div>

<script>

// 6 級結果
const results = [

  },

let currentQ = 0;
let answers = new Array(questions.length).fill(null);
let scores = new Array(questions.length).fill(0);

function startQuiz() {
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('quizScreen').classList.remove('hidden');
  document.getElementById('progressBar').style.display = 'block';
  currentQ = 0;
  answers.fill(null);
  scores.fill(0);
  showQuestion();
}

function showQuestion() {
  const q = questions[currentQ];
  document.getElementById('qNum').textContent = `第 ${currentQ + 1} 題 / ${questions.length}`;
  document.getElementById('qText').textContent = q.q;
  
  const optionsDiv = document.getElementById('options');
  optionsDiv.innerHTML = '';
  
  q.options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'option' + (answers[currentQ] === idx ? ' selected' : '');
    btn.innerHTML = `<span>${String.fromCharCode(65 + idx)}</span>${opt.text}`;
    btn.onclick = () => selectOption(idx);
    optionsDiv.appendChild(btn);
  });
  
  // 更新進度
  const progress = ((currentQ) / questions.length) * 100;
  document.getElementById('progressFill').style.width = progress + '%';
  
  // 按鈕狀態
  document.getElementById('prevBtn').style.display = currentQ === 0 ? 'none' : 'block';
  document.getElementById('nextBtn').disabled = answers[currentQ] === null;
  document.getElementById('nextBtn').textContent = currentQ === questions.length - 1 ? '查看結果' : '下一題';
}

function selectOption(idx) {
  answers[currentQ] = idx;
  scores[currentQ] = questions[currentQ].options[idx].score;
  
  // 更新選中樣式
  const btns = document.querySelectorAll('#options .option');
  btns.forEach((b, i) => {
    b.classList.toggle('selected', i === idx);
  });
  
  document.getElementById('nextBtn').disabled = false;
}

function nextQuestion() {
  if (answers[currentQ] === null) return;
  
  if (currentQ < questions.length - 1) {
    currentQ++;
    showQuestion();
  } else {
    showResult();
  }
}

function prevQuestion() {
  if (currentQ > 0) {
    currentQ--;
    showQuestion();
  }
}

function showResult() {
  const total = scores.reduce((a, b) => a + b, 0);
  
  let result = results[results.length - 1];
  for (const r of results) {
    if (total >= r.min && total <= r.max) {
      result = r;
      break;
    }
  }
  
  document.getElementById('quizScreen').classList.add('hidden');
  document.getElementById('resultScreen').classList.remove('hidden');
  document.getElementById('progressFill').style.width = '100%';
  
  document.getElementById('resultLevel').textContent = result.level;
  document.getElementById('resultTitle').textContent = result.title;
  document.getElementById('resultEmoji').textContent = result.emoji;
  document.getElementById('resultScore').textContent = `你的矛盾指數：${total} / 40`;
  document.getElementById('resultDesc').textContent = result.desc;
}

function restartQuiz() {
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('startScreen').classList.remove('hidden');
  document.getElementById('progressFill').style.width = '0%';
  document.getElementById('progressBar').style.display = 'none';
}

// 初始隱藏進度條
document.getElementById('progressBar').style.display = 'none';
</script>
</body>
</html>
