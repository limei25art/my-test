<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>追星族矛盾大對決｜測試你的追星矛盾指數</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');

  :root {
    --bg: #0f0a1a;
    --card: #1a1229;
    --accent: #ff4d8d;
    --accent2: #c44dff;
    --text: #f5eef8;
    --muted: #b8a8c8;
    --option: #2a1f3d;
    --option-hover: #3d2a55;
    --option-selected: #ff4d8d33;
    --border: #3d2a55;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background-image: 
      radial-gradient(ellipse at 20% 20%, #2a1040 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, #1a0a30 0%, transparent 50%),
      radial-gradient(ellipse at 50% 50%, #150a25 0%, transparent 70%);
  }

  .container {
    width: 100%;
    max-width: 640px;
  }

  .screen {
    display: none;
    animation: fadeIn 0.4s ease;
  }
  .screen.active {
    display: block;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .start-card {
    background: var(--card);
    border-radius: 24px;
    padding: 48px 32px;
    text-align: center;
    border: 1px solid var(--border);
    box-shadow: 0 20px 60px rgba(255, 77, 141, 0.15);
  }

  .badge {
    display: inline-block;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: white;
    font-size: 13px;
    font-weight: 700;
    padding: 6px 16px;
    border-radius: 50px;
    margin-bottom: 20px;
    letter-spacing: 1px;
  }

  h1 {
    font-size: 28px;
    font-weight: 900;
    line-height: 1.3;
    margin-bottom: 12px;
    background: linear-gradient(135deg, #ff6b9d, #c44dff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .subtitle {
    color: var(--muted);
    font-size: 15px;
    line-height: 1.7;
    margin-bottom: 32px;
  }

  .topics {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-bottom: 36px;
  }

  .topic-tag {
    background: var(--option);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 12px;
    padding: 5px 12px;
    border-radius: 20px;
  }

  .btn {
    display: inline-block;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: white;
    border: none;
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    padding: 16px 48px;
    border-radius: 50px;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 8px 24px rgba(255, 77, 141, 0.35);
  }
  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(255, 77, 141, 0.5);
  }
  .btn:active {
    transform: translateY(0);
  }

  .btn-secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    box-shadow: none;
    margin-top: 12px;
  }
  .btn-secondary:hover {
    border-color: var(--accent);
    color: var(--text);
    box-shadow: none;
  }

  .progress-wrap {
    margin-bottom: 24px;
  }
  .progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .progress-bar {
    height: 6px;
    background: var(--option);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 3px;
    transition: width 0.35s ease;
  }

  .question-card {
    background: var(--card);
    border-radius: 20px;
    padding: 32px 28px;
    border: 1px solid var(--border);
  }

  .q-num {
    font-size: 13px;
    color: var(--accent);
    font-weight: 700;
    margin-bottom: 12px;
    letter-spacing: 1px;
  }

  .q-text {
    font-size: 18px;
    font-weight: 700;
    line-height: 1.5;
    margin-bottom: 28px;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .option {
    background: var(--option);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    text-align: left;
  }
  .option:hover {
    background: var(--option-hover);
    border-color: #5a3d7a;
  }
  .option.selected {
    background: var(--option-selected);
    border-color: var(--accent);
  }

  .opt-letter {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    border-radius: 8px;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
  }
  .option.selected .opt-letter {
    background: var(--accent);
    color: white;
  }

  .opt-text {
    font-size: 14px;
    line-height: 1.5;
    color: var(--text);
    padding-top: 3px;
  }

  .nav-btns {
    display: flex;
    gap: 12px;
    margin-top: 28px;
  }
  .nav-btns .btn {
    flex: 1;
    padding: 14px;
    font-size: 15px;
  }

  .result-card {
    background: var(--card);
    border-radius: 24px;
    padding: 40px 28px;
    text-align: center;
    border: 1px solid var(--border);
    box-shadow: 0 20px 60px rgba(255, 77, 141, 0.12);
  }

  .result-level {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--accent);
    margin-bottom: 8px;
  }

  .result-title {
    font-size: 26px;
    font-weight: 900;
    margin-bottom: 8px;
    line-height: 1.3;
  }

  .result-score {
    font-size: 15px;
    color: var(--muted);
    margin-bottom: 24px;
  }

  .result-emoji {
    font-size: 56px;
    margin-bottom: 20px;
  }

  .result-desc {
    font-size: 15px;
    line-height: 1.8;
    color: var(--muted);
    text-align: left;
    background: var(--option);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 28px;
  }

  .result-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-bottom: 32px;
  }

  .result-tag {
    background: linear-gradient(135deg, #ff4d8d22, #c44dff22);
    border: 1px solid #ff4d8d44;
    color: #ff8fb8;
    font-size: 12px;
    padding: 5px 14px;
    border-radius: 20px;
  }

  .share-tip {
    font-size: 12px;
    color: var(--muted);
    margin-top: 20px;
    opacity: 0.7;
  }

  @media (max-width: 480px) {
    h1 { font-size: 24px; }
    .q-text { font-size: 16px; }
    .start-card, .question-card, .result-card { padding: 28px 20px; }
  }
</style>
</head>
<body>
<div class="container">

  <!-- 開始畫面 -->
  <div class="screen active" id="startScreen">
    <div class="start-card">
      <div class="badge">追星心理測驗</div>
      <h1>追星族矛盾大對決</h1>
      <p class="subtitle">
        十條問題測試你的追星矛盾指數<br>
        雙標？情緒勒索？假想敵？團體內鬥？<br>
        請誠實選擇最符合你情況的描述。
      </p>
      <div class="topics">

        <span class="topic-tag">情緒勒索</span>
        <span class="topic-tag">喜歡比較</span>
        <span class="topic-tag">團體內鬥</span>
        <span class="topic-tag">假想敵</span>
      </div>
      <button class="btn" onclick="startQuiz()">開始測驗</button>
    </div>
  </div>

  <!-- 問題畫面 -->
  <div class="screen" id="quizScreen">
    <div class="progress-wrap">
      <div class="progress-info">
        <span id="qCounter">第 1 / 10 題</span>
        <span id="qPercent">10%</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="width: 10%"></div>
      </div>
    </div>
    <div class="question-card">
      <div class="q-num" id="qNum">QUESTION 01</div>
      <div class="q-text" id="qText"></div>
      <div class="options" id="options"></div>
      <div class="nav-btns">
        <button class="btn btn-secondary" id="prevBtn" onclick="prevQ()" style="display:none">上一題</button>
        <button class="btn" id="nextBtn" onclick="nextQ()" disabled>下一題</button>
      </div>
    </div>
  </div>

  <!-- 結果畫面 -->
  <div class="screen" id="resultScreen">
    <div class="result-card">
      <div class="result-level" id="resLevel"></div>
      <div class="result-emoji" id="resEmoji"></div>
      <div class="result-title" id="resTitle"></div>
      <div class="result-score" id="resScore"></div>
      <div class="result-desc" id="resDesc"></div>
      <div class="result-tags" id="resTags"></div>
      <button class="btn" onclick="restart()">再測一次</button>
      <p class="share-tip">截圖分享給同好或對家，看看邊個比較矛盾 👀</p>
    </div>
  </div>

</div>

<script>

  {
    q: "你心中是否存在「假想敵」（某個特定偶像或粉絲群體）？",
    options: [
      { t: "完全沒有，大家都是追星，和平共處", s: 1 },
      { t: "偶爾會對某家有偏見，但不會主動針對", s: 2 },
      { t: "有特定幾家令我看不順眼，會默默避開", s: 3 },
      { t: "有明確的對家，見到就想反駁或嘲笑", s: 4 },
      { t: "每天都在關注對家動態，準備隨時開戰", s: 5 }

  {
    q: "最後一題：你覺得自己追星時，最常出現的矛盾是？",

      { t: "有時會比較，但能自我調整", s: 2 },
      { t: "常常在「理性」和「情緒」之間拉扯", s: 3 },
      { t: "明明知道不應該雙標，但還是忍不住", s: 4 },

const results = [
  {
    min: 10, max: 15,
    level: "LEVEL 1",
    emoji: "🌸",
    title: "純真追星小白兔",

    tags: ["理性追星", "高情商", "和平主義者", "佛系粉絲"]
  },
  {
    min: 16, max: 22,
    level: "LEVEL 2",
    emoji: "🌿",
    title: "溫和觀察者",
    desc: "你偶爾會因為偶像被批評而心疼，也會在心裡偷偷比較，但大多數時候你選擇沉默或自我消化。你有點敏感，卻不輕易發動攻擊。屬於「看戲但不下場」的類型。建議繼續保持界線感，不要被極端粉絲帶節奏就好。",
    tags: ["偶爾心動", "默默觀察", "自我消化型", "溫柔粉絲"]
  },
  {
    min: 23, max: 30,
    level: "LEVEL 3",
    emoji: "⚡",
    title: "矛盾開始萌芽",
    desc: "你已經開始出現明顯的追星矛盾。會替偶像找理由、會在心裡貶低其他家、也會因為數據或互動而吃醋。目前仍在可控範圍，但已經能感受到情緒被牽動。提醒自己：偶像是人，不是完美神像；其他粉絲也是人，不是假想敵。",

  {

let current = 0;
let answers = new Array(10).fill(null);
let scores = new Array(10).fill(0);

function startQuiz() {
  document.getElementById('startScreen').classList.remove('active');
  document.getElementById('quizScreen').classList.add('active');
  current = 0;
  answers.fill(null);
  scores.fill(0);
  renderQ();
}

function renderQ() {
  const q = questions[current];
  document.getElementById('qNum').textContent = `QUESTION ${String(current + 1).padStart(2, '0')}`;
  document.getElementById('qText').textContent = q.q;
  document.getElementById('qCounter').textContent = `第 ${current + 1} / 10 題`;
  document.getElementById('qPercent').textContent = `${(current + 1) * 10}%`;
  document.getElementById('progressFill').style.width = `${(current + 1) * 10}%`;

  const opts = document.getElementById('options');
  opts.innerHTML = '';
  const letters = ['A', 'B', 'C', 'D', 'E'];
  q.options.forEach((opt, i) => {
    const div = document.createElement('div');
    div.className = 'option' + (answers[current] === i ? ' selected' : '');
    div.innerHTML = `<div class="opt-letter">${letters[i]}</div><div class="opt-text">${opt.t}</div>`;
    div.onclick = () => selectOpt(i);
    opts.appendChild(div);
  });

  document.getElementById('prevBtn').style.display = current > 0 ? 'block' : 'none';
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.disabled = answers[current] === null;
  nextBtn.textContent = current === 9 ? '查看結果' : '下一題';
}

function selectOpt(i) {
  answers[current] = i;
  scores[current] = questions[current].options[i].s;
  renderQ();
}

function nextQ() {
  if (answers[current] === null) return;
  if (current < 9) {
    current++;
    renderQ();
  } else {
    showResult();
  }
}

function prevQ() {
  if (current > 0) {
    current--;
    renderQ();
  }
}

function showResult() {
  const total = scores.reduce((a, b) => a + b, 0);
  const res = results.find(r => total >= r.min && total <= r.max);

  document.getElementById('quizScreen').classList.remove('active');
  document.getElementById('resultScreen').classList.add('active');

  document.getElementById('resLevel').textContent = res.level;
  document.getElementById('resEmoji').textContent = res.emoji;
  document.getElementById('resTitle').textContent = res.title;
  document.getElementById('resScore').textContent = `矛盾指數：${total} / 50`;
  document.getElementById('resDesc').textContent = res.desc;

  const tags = document.getElementById('resTags');
  tags.innerHTML = '';
  res.tags.forEach(t => {
    const span = document.createElement('span');
    span.className = 'result-tag';
    span.textContent = t;
    tags.appendChild(span);
  });
}

function restart() {
  document.getElementById('resultScreen').classList.remove('active');
  document.getElementById('startScreen').classList.add('active');
}
</script>
</body>
</html>
