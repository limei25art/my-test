  ctx.textAlign = 'center';
  ctx.fillText('元氣', eTagX + eTagW / 2, eTagY + eTagH / 2 + 1);

  // 量表軌道
  const barX = eTagX + eTagW + 10;
  const barY = energyBoxY + 9;
  const barH = 16;
  const barW = energyBoxW - (barX - energyBoxX) - 48;
  drawRoundedRectPath(barX, barY, barW, barH, 8);
  ctx.fillStyle = '#d5deef';
  ctx.fill();
  // 內凹陰影
  ctx.save();
  drawRoundedRectPath(barX, barY, barW, barH, 8);
  ctx.clip();
  ctx.fillStyle = 'rgba(80, 110, 170, 0.12)';
  ctx.fillRect(barX, barY, barW, 4);

  // 進度（糖果漸層；元氣將盡時轉紅並脈衝）
  let percent = Math.max(0, Math.min(1, displayTimeLeft / GAME_TIME));
  let fillW = Math.max(0, barW * percent);
  const energyCritical = percent <= 0.2;
  const energyWarn = percent <= 0.35;
  if (fillW > 0) {
    drawRoundedRectPath(barX, barY, fillW, barH, 8);
    const fillGrad = ctx.createLinearGradient(barX, barY, barX + barW, barY);
    if (energyCritical) {
      // 危急：紅→深珊瑚，並用時間做明暗脈衝
      const pulse = 0.55 + 0.45 * (0.5 + 0.5 * Math.sin(performance.now() * 0.012));
      fillGrad.addColorStop(0, 'rgba(255,120,130,' + (0.75 + pulse * 0.25) + ')');
      fillGrad.addColorStop(0.5, 'rgba(255,70,90,' + (0.85 + pulse * 0.15) + ')');
      fillGrad.addColorStop(1, 'rgba(220,40,70,1)');
    } else if (energyWarn) {
      fillGrad.addColorStop(0, '#ffc14d');
      fillGrad.addColorStop(0.55, '#ff8f6b');
      fillGrad.addColorStop(1, '#ff7b8a');
    } else {
      fillGrad.addColorStop(0, '#5ee0a8');
      fillGrad.addColorStop(0.35, '#6ba3f0');
      fillGrad.addColorStop(0.7, '#ffc14d');
      fillGrad.addColorStop(1, '#ff7b8a');
    }
    ctx.fillStyle = fillGrad;
    ctx.fill();
    // 頂部高光
    ctx.fillStyle = energyCritical ? 'rgba(255,200,200,0.35)' : 'rgba(255,255,255,0.45)';
    ctx.fillRect(barX + 2, barY + 2, Math.max(0, fillW - 4), 4);
    // 危急外發光（在 clip 內畫一層半透明閃爍）
    if (energyCritical) {
      const glow = 0.15 + 0.2 * (0.5 + 0.5 * Math.sin(performance.now() * 0.014));
      ctx.fillStyle = 'rgba(255, 60, 80,' + glow + ')';
      ctx.fillRect(barX, barY, fillW, barH);
    }
  }
  ctx.restore();

  // 數值（危急時變紅並微微放大感）
  ctx.textAlign = 'right';
  ctx.font = 'bold ' + (energyCritical ? '15' : '14') + 'px "Noto Sans TC", "Segoe UI", system-ui, sans-serif';
  if (energyCritical) {
    const blink = 0.65 + 0.35 * (0.5 + 0.5 * Math.sin(performance.now() * 0.014));
    ctx.fillStyle = 'rgba(220, 40, 70,' + blink + ')';
  } else if (energyWarn) {
    ctx.fillStyle = '#d35400';
  } else {
    ctx.fillStyle = '#354560';
  }
  const energyText = String(Math.ceil(timeLeft));
  ctx.fillText(energyText, energyBoxX + energyBoxW - 12, energyBoxY + energyBoxH / 2 + 1);

  // 危急時整條元氣膠囊外框微紅閃
  if (energyCritical) {
    const edge = 0.25 + 0.35 * (0.5 + 0.5 * Math.sin(performance.now() * 0.012));
    ctx.strokeStyle = 'rgba(255, 80, 100,' + edge + ')';
    ctx.lineWidth = 2.5;
    drawRoundedRectPath(energyBoxX, energyBoxY, energyBoxW, energyBoxH, 17);
    ctx.stroke();
  }

  ctx.restore();

  // 元氣量表下方：左＝日夜提示，右＝特別魚出現提示
  drawTimeOfDayHud();
  drawSpecialAlert();
}

// 元氣快完：全畫面紅邊 vignette
function drawEnergyCriticalOverlay() {
  const percent = Math.max(0, Math.min(1, displayTimeLeft / GAME_TIME));
  if (percent > 0.2) return;
  // 危急音效（約每 1.8 秒一次）
  sfx('energy_low', { throttleMs: 1800 });
  const urgency = 1 - percent / 0.2; // 0~1，越低越強
  const pulse = 0.55 + 0.45 * (0.5 + 0.5 * Math.sin(performance.now() * 0.011));
  const alpha = (0.12 + urgency * 0.28) * pulse;
  const w = canvas.width;
  const h = canvas.height;
  ctx.save();
  // 四邊漸層暗紅
  const edge = Math.max(40, Math.min(w, h) * (0.18 + urgency * 0.12));
  // 上
  let g = ctx.createLinearGradient(0, 0, 0, edge);
  g.addColorStop(0, 'rgba(180, 20, 40,' + alpha + ')');
  g.addColorStop(1, 'rgba(180, 20, 40, 0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, edge);
  // 下
  g = ctx.createLinearGradient(0, h, 0, h - edge);
  g.addColorStop(0, 'rgba(180, 20, 40,' + alpha + ')');
  g.addColorStop(1, 'rgba(180, 20, 40, 0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, h - edge, w, edge);
  // 左
  g = ctx.createLinearGradient(0, 0, edge, 0);
  g.addColorStop(0, 'rgba(180, 20, 40,' + (alpha * 0.9) + ')');
  g.addColorStop(1, 'rgba(180, 20, 40, 0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, edge, h);
  // 右
  g = ctx.createLinearGradient(w, 0, w - edge, 0);
  g.addColorStop(0, 'rgba(180, 20, 40,' + (alpha * 0.9) + ')');
  g.addColorStop(1, 'rgba(180, 20, 40, 0)');
  ctx.fillStyle = g;
  ctx.fillRect(w - edge, 0, edge, h);
  // 極低時中心微紅閃
  if (percent <= 0.1) {
    ctx.globalAlpha = 0.04 + 0.06 * pulse * urgency;
    ctx.fillStyle = '#c0392b';
    ctx.fillRect(0, 0, w, h);
  }
  ctx.restore();
}

// 遊戲主迴圈
function gameLoop(currentTime) {
  try {
    // 時間控制：確保遊戲速度一致
    if (!lastTime) lastTime = currentTime;
    deltaTime = currentTime - lastTime;
    
    // 如果幀率太快，跳過這一幀
    if (deltaTime < frameTime) {
      frameNext();
      return;
    }
    
    // 計算時間縮放因子；遊戲結束後凍結世界（YouTube 仍在 HTML 層播放）
    let timeScale = deltaTime / frameTime;
    if (gameOver) timeScale = 0;
    lastTime = currentTime;
    
    // 防呆：確保 fishes、trashes 一定是陣列
    if (!Array.isArray(fishes)) fishes = [];
    if (!Array.isArray(trashes)) trashes = [];
    
    if (gameStarted && !gameOver && !bowlSinking && !paramPanelOpen) {
      elapsedGameTime += deltaTime / 1000; // 累計這一局已經進行的時間
      const passiveDrain = Math.min(
        PASSIVE_DRAIN_MAX,
        PASSIVE_DRAIN_BASE + elapsedGameTime * PASSIVE_DRAIN_ACCEL_PER_SEC
      );
      timeLeft = Math.max(0, timeLeft - passiveDrain * (deltaTime / 1000));
    }

    // 注意：這裡不再呼叫 updateLinePhysics()。
    // 之前這裡跟 drawRod() 內部各呼叫一次，等於同一幀內用「移動前」跟「移動後」的
    // 座標各跑一次物理鬆弛，鉤子/釣線的擺動會被拉直、看不出明顯晃動效果。
    // 現在改成只在 drawRod()（所有位置都更新完之後）呼叫一次，讓晃動效果能確實呈現。
    wavePhase += 0.035 * timeScale; // 波浪推進（根據時間縮放）
    // --- 主角移動速度影響波浪 ---
    let prevX = waveDisturb.x;
    waveDisturb.x = bowlX + pot.w/2;
    waveDisturb.v = (waveDisturb.x - prevX);
    // 可加一點阻尼讓波動慢慢消失
    waveDisturb.v *= 0.92;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 圖層：背景圖 → YouTube（HTML）→ canvas 魚／UI
    // YT 播放中：只畫海面以上的天空；海面以下保持透明讓影片透出
    const seaYtOn = !!(typeof seaYtStarted !== 'undefined' && seaYtStarted &&
      document.getElementById('seaYtWrap') &&
      document.getElementById('seaYtWrap').classList.contains('is-playing'));
    const seaY = LINE_PARAMS.seaSurfaceY;
    if (bgImg.complete && bgImg.naturalWidth > 0) {
      if (seaYtOn) {
        // 只畫天空（裁切到海平面）
        ctx.save();
        ctx.beginPath();
        ctx.rect(0, 0, canvas.width, seaY + 2);
        ctx.clip();
        ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
        ctx.restore();
        // 極淡水色（YT 已 50% 透明，勿再蓋太厚）
        ctx.fillStyle = 'rgba(20, 60, 100, 0.06)';
        ctx.fillRect(0, seaY, canvas.width, canvas.height - seaY);
      } else {
        ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
      }
    } else {
      let skyGradient = ctx.createLinearGradient(0, 0, 0, seaY);
      skyGradient.addColorStop(0, '#b3e0ff');
      skyGradient.addColorStop(0.3, '#e6f6ff');
      skyGradient.addColorStop(0.7, '#a4c8e1');
      skyGradient.addColorStop(1, '#7bbbe6');
      ctx.fillStyle = skyGradient;
      ctx.fillRect(0, 0, canvas.width, seaY);
      let seaGradient = ctx.createLinearGradient(0, seaY, 0, canvas.height);
      if (seaYtOn) {
        seaGradient.addColorStop(0, 'rgba(123,187,230,0.28)');
        seaGradient.addColorStop(0.25, 'rgba(58,140,193,0.22)');
        seaGradient.addColorStop(0.55, 'rgba(32,96,144,0.28)');
        seaGradient.addColorStop(1, 'rgba(10,26,47,0.38)');
      } else {
        seaGradient.addColorStop(0, '#7bbbe6');
        seaGradient.addColorStop(0.15, '#3a8cc1');
        seaGradient.addColorStop(0.4, '#206090');
        seaGradient.addColorStop(0.7, '#133a5c');
        seaGradient.addColorStop(1, '#0a1a2f');
      }
      ctx.fillStyle = seaGradient;
      ctx.fillRect(0, seaY, canvas.width, canvas.height - seaY);
    }
    if (typeof updateSeaYtLayout === 'function') updateSeaYtLayout();

    // --- 日／夜氛圍（天空遮罩 + 簡易月亮／太陽）---
    {
      const night = dayNightBlend();
      if (night > 0.02) {
        ctx.save();
        const seaY = LINE_PARAMS.seaSurfaceY;
        // 夜空遮罩
        const g = ctx.createLinearGradient(0, 0, 0, canvas.height);
        g.addColorStop(0, 'rgba(8, 16, 48,' + (0.55 * night) + ')');
        g.addColorStop(0.35, 'rgba(12, 28, 64,' + (0.42 * night) + ')');
        g.addColorStop(0.55, 'rgba(10, 40, 70,' + (0.28 * night) + ')');
        g.addColorStop(1, 'rgba(5, 20, 40,' + (0.18 * night) + ')');
        ctx.fillStyle = g;
        // YT 播放時：夜幕主要蓋天空，海洋少蓋一點以免影片過暗
        if (typeof seaYtOn !== 'undefined' && seaYtOn) {
          ctx.fillRect(0, 0, canvas.width, seaY + 4);
          ctx.globalAlpha = 0.35 * night;
          ctx.fillRect(0, seaY, canvas.width, canvas.height - seaY);
          ctx.globalAlpha = 1;
        } else {
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        // 星星（固定種子感：用固定座標）
        if (night > 0.35) {
          ctx.globalAlpha = Math.min(1, (night - 0.35) / 0.4) * 0.9;
          ctx.fillStyle = '#fff';
          const stars = [[40,50],[90,30],[140,70],[200,40],[260,25],[320,60],[380,35],[60,90],[180,55],[300,80],[350,45],[120,20]];
          for (let si = 0; si < stars.length; si++) {
            const sx = stars[si][0] % canvas.width;
            const sy = stars[si][1];
            if (sy < seaY - 10) {
              ctx.beginPath();
              ctx.arc(sx, sy, (si % 3 === 0) ? 1.6 : 1.1, 0, Math.PI * 2);
              ctx.fill();
            }
          }
          ctx.globalAlpha = 1;
        }
        // 月亮
        if (night > 0.25) {
          ctx.globalAlpha = Math.min(1, (night - 0.2) / 0.5);
          const mx = canvas.width * 0.78, my = Math.min(seaY * 0.35, 90);
          ctx.fillStyle = '#f5f0d8';
          ctx.beginPath();
          ctx.arc(mx, my, 18, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = 'rgba(8,16,48,' + (0.55 * night) + ')';
          ctx.beginPath();
          ctx.arc(mx + 7, my - 4, 15, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;
        }
        ctx.restore();
      } else {
        // 白天太陽
        ctx.save();
        const seaY = LINE_PARAMS.seaSurfaceY;
        const mx = canvas.width * 0.82, my = Math.min(seaY * 0.32, 80);
        ctx.globalAlpha = 0.85;
        ctx.fillStyle = '#ffe08a';
        ctx.beginPath();
        ctx.arc(mx, my, 16, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 0.25;
        ctx.beginPath();
        ctx.arc(mx, my, 26, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.restore();
      }
    }

    // --- 畫波浪海平面 ---
    ctx.save();
    ctx.beginPath();
    for (let x = 0; x <= canvas.width; x += 4) {
      let y = getWaveY(x, wavePhase);
      if (x === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.lineTo(canvas.width, 0);
    ctx.lineTo(0, 0);
    ctx.closePath();
    ctx.fillStyle = (dayNightBlend() > 0.5) ? '#1a3050' : '#b3e0ff';
    ctx.globalAlpha = 0.18;
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.restore();
    // --- 畫波浪線 ---
    ctx.save();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let x = 0; x <= canvas.width; x += 2) {
      let y = getWaveY(x, wavePhase);
      if (x === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.restore();

    // 控制主角與大魚左右移動（開始畫面關閉後才可操作；結束後凍結）
    if (gameStarted && !gameOver) {
    if (keyState.left) {
      bigFish.x -= 6 * timeScale;
      playerDir = -1;
    }
    if (keyState.right) {
      bigFish.x += 6 * timeScale;
      playerDir = 1;
    }
    }
    if (bigFish.x < bigFish.w/2) bigFish.x = bigFish.w/2;
    if (bigFish.x > canvas.width - bigFish.w/2) bigFish.x = canvas.width - bigFish.w/2;
    // 精靈移動動畫：左右鍵（或搖桿）持續按著移動時才會一直換圖，放開/停下來就凍結在目前影格
    const catIsMoving = keyState.left || keyState.right;
    if (catIsMoving) {
      if (!catWasMoving) {
        // 剛開始移動的第一幀就立刻換下一張圖，不用等滿一個間隔才反應，這樣輕點一下也看得出換圖
        catAnimFrame = (catAnimFrame + 1) % catMoveImgs.length;
        catAnimTimer = 0;
      } else {
        catAnimTimer += deltaTime;
        if (catAnimTimer >= CAT_ANIM_FRAME_MS) {
          catAnimTimer -= CAT_ANIM_FRAME_MS;
          catAnimFrame = (catAnimFrame + 1) % catMoveImgs.length;
        }
      }
    } else {
      catAnimTimer = 0; // 停下來時重置計時，下次移動時動畫節奏能重新從整數間隔算起
    }
    catWasMoving = catIsMoving;
    // 精靈（角色）的高度跟著海平面高度參數走，海平面調高/調低時，角色也會跟著往下/往上移動
    bigFish.y = LINE_PARAMS.seaSurfaceY + 20;
    // 釣魚線起點、鉤子都跟著 bigFish.x

    // 控制魚鉤上下移動（慣性/拉力；結束後凍結）
    if (gameStarted && !gameOver && !fishing && !hookThrowing) {
      const HOOK_ACCEL = LINE_PARAMS.hookAccel; // 按下上下鍵時的加速度
      const HOOK_MAX_VEL = LINE_PARAMS.hookMaxVel; // 速度上限，避免無限加速造成飄浮感

      // 玩家一按上／下鍵操作鉤子，就取消「碰水後自動下沉」，改成完全由玩家控制
      if (keyState.up || keyState.down) {
        hookAutoSinking = false;
      }

      if (hookAutoSinking) {
        // 拉竿結束、鉤子碰到水面後，如果玩家還沒有操作，鉤子要靠慣性繼續往下沉，
        // 一路沉到海底（hookMaxY）才會解除這個狀態，之後才會自動慢慢浮回待機高度。
        hookVelY += LINE_PARAMS.hookAutoSinkGravity * timeScale;
        if (hookVelY > LINE_PARAMS.hookAutoSinkMaxVelY) hookVelY = LINE_PARAMS.hookAutoSinkMaxVelY;
        hookVelX *= Math.pow(LINE_PARAMS.hookAutoSinkVelXDamp, timeScale); // 只加強阻尼模擬水阻力，水平位移仍交給下方彈簧物理區塊統一處理，避免重複位移
        hookY += hookVelY * timeScale;
        if (hookY >= LINE_PARAMS.hookMaxY) {
          hookY = LINE_PARAMS.hookMaxY;
          hookVelY = 0;
          hookAutoSinking = false; // 碰底了，解除自動下沉，接下來恢復一般行為（會自動慢慢浮回 hookRestY）
        }
      } else if (keyState.up) {
        hookVelY -= HOOK_ACCEL * timeScale; // 向上拉
      } else if (keyState.down) {
        hookVelY += HOOK_ACCEL * timeScale; // 向下拉
      } else {
        // 沒有按上下時，回到中間的速度也拉快一些，減少「鬆手後還在飄」的感覺
        let diff = LINE_PARAMS.hookRestY - hookY;
        if (diff > 0) {
          hookVelY += diff * LINE_PARAMS.hookReturnUpRate * timeScale; // 上浮速度
        } else {
          hookVelY += diff * LINE_PARAMS.hookReturnDownRate * timeScale; // 下沉稍慢，但比原本更緊繃
        }
      }

      if (!hookAutoSinking) {
        // 阻尼：放手瞬間更快煞停，操作起來更「跟手」
        hookVelY *= Math.pow(LINE_PARAMS.hookVelDamp, timeScale);
        hookVelY = Math.max(-HOOK_MAX_VEL, Math.min(HOOK_MAX_VEL, hookVelY));
        hookY += hookVelY * timeScale;
      }
      if (hookY < LINE_PARAMS.hookMinY) {
        hookY = LINE_PARAMS.hookMinY;
        hookVelY = 0;
      }
      if (hookY > LINE_PARAMS.hookMaxY) {
        hookY = LINE_PARAMS.hookMaxY;
        hookVelY = 0;
      }
    }
    // --- 鉤子拉竿動畫：真正的物理（初始衝力 + 重力），取代原本固定速度的動畫內插 ---
    // 分成兩個階段：
    //   'loop'：拉竿當下給鉤子一股迴圈衝力，讓它沿著迴圈路徑往前往上衝；
    //           這股衝力會隨時間自然衰減（模擬重力/甩竿阻力），所以衝到接近頂端時會明顯變慢，
    //           呈現「衝到頂端再後甩」的手感，而不是等速播放的動畫。
    //   'fall'：迴圈甩完之後，不再是內插動畫，而是真正用重力加速度讓鉤子自由落下，
    //           一直到鉤子確實碰到水面（或沒入水面以下）才會結束這次拉竿；
    //           在這整個過程中 fishing / hookThrowing 都維持 true，
    //           所以無論是迴圈上衝階段還是掉落階段，重複按空白鍵都完全無效，
    //           一定要等鉤子真的碰到水面才能按空白鍵拉第二次竿。
    if (hookThrowing) {
      if (hookThrowPhase === 'loop') {
        // 修正：落點 X 不再只在甩竿開始那一刻凍結一次，而是每一幀都重新讀取角色目前的 x，
        // 這樣鉤子迴圈甩出去、準備落下的目標位置，會即時跟著角色的左右移動而改變，
        // 不會出現「角色明明移動了，鉤子卻還是往舊位置甩」的錯位感。
        // （hookThrowPlayerDir 仍維持凍結，只用來決定偏移量的方向，避免迴圈甩到一半突然變向）
        hookThrowEndX = bigFish.x - LINE_PARAMS.hookLandingBehindOffset * hookThrowPlayerDir;
        // 迴圈中心點：落在起點與終點連線的中點，並往上偏移 hookLoopHeight，
        // 讓整個迴圈鼓起在連線上方（對應參考圖：鉤子往上繞一圈再落到角色身邊）。
        // 迴圈本身的幾何形狀維持原本設計，改變的只有「沿著迴圈前進的速度」。
        const loopCenterX = (hookThrowStartX + hookThrowEndX) / 2;
        const loopCenterY = (hookThrowStartY + hookThrowEndY) / 2 - LINE_PARAMS.hookLoopHeight;

        // 整個橢圓迴圈要跟著「拉竿當下，精靈與魚鉤之間的傾斜角度」一起歪——這個角度已經在
        // startHookCast() 裡凍結成 hookThrowTiltAngle，衝破水面那一瞬間就是沿著這個方向衝出去，
        // 不是每一幀重新用「起點到終點」（終點是很遠的天空高度 hookThrowSkyY）算一次角度。
        // 如果重新用起點到終點算，垂直距離會遠大於水平落差，算出來的角度會被稀釋到接近 0，
        // 導致不管拉竿前魚鉤偏得多斜，整個迴圈看起來還是幾乎垂直。hookLoopTiltFactor 用來加強/減弱
        // 這個效果（1＝傾斜角度完全比照精靈與魚鉤的角度，>1＝更誇張，0＝關閉、迴圈永遠正對垂直方向）。
        const loopTiltAngle = hookThrowTiltAngle * LINE_PARAMS.hookLoopTiltFactor;
        const cosTilt = Math.cos(loopTiltAngle), sinTilt = Math.sin(loopTiltAngle);
        // 世界座標 -> 迴圈本地座標：把整個世界「轉回」讓迴圈主軸朝正上方的角度，
        // 這樣底下橢圓壓縮的算法完全不用變，繼續假設自己是「正對垂直方向」在算。
        function toLoopLocal(px, py) {
          const dx = px - loopCenterX, dy = py - loopCenterY;
          return { x: dx * cosTilt + dy * sinTilt, y: -dx * sinTilt + dy * cosTilt };
        }
        // 迴圈本地座標 -> 世界座標：算完路徑後，再把結果「轉回」疊上魚線的傾斜角度。
        // 因為起點/終點都是先轉進再轉出（互為反向旋轉），所以起點/終點在世界座標系的位置
        // 完全不受影響，只有中間鼓起繞圈的部分會跟著整體歪斜。
        function toLoopWorld(lx, ly) {
          return { x: loopCenterX + lx * cosTilt - ly * sinTilt, y: loopCenterY + lx * sinTilt + ly * cosTilt };
        }

        // 讓迴圈變橢圓的技巧：先把水平座標「壓縮」進一個圓形空間裡算角度／半徑（跟原本算法一樣是圓），
        // 最後畫出來的瞬間再把 X 座標「放大」回真實空間，整條路徑就會變成水平方向被壓扁的橢圓；
        // 因為起點/終點在壓縮再放大之後會精確還原成原始座標，所以起點和終點的位置完全不受影響，
        // 只有中間鼓起繞圈的部分會變窄。hookLoopXScale 越小，迴圈越扁越像橢圓；1 則維持原本正圓。
        const xScale = Math.max(0.05, LINE_PARAMS.hookLoopXScale);
        const startLocal = toLoopLocal(hookThrowStartX, hookThrowStartY);
        const endLocal = toLoopLocal(hookThrowEndX, hookThrowEndY);
        const startDX = startLocal.x / xScale, startDY = startLocal.y;
        const endDX = endLocal.x / xScale, endDY = endLocal.y;
        const startAngle = Math.atan2(startDY, startDX);
        const endAngle = Math.atan2(endDY, endDX);
        const startRadius = Math.hypot(startDX, startDY);
        const endRadius = Math.hypot(endDX, endDY);

        // hookLoopDirection：基準繞圈方向（1＝順時針、-1＝逆時針），再乘上拉竿當下凍結的角色面向
        // （hookThrowPlayerDir，而不是即時 playerDir），讓迴圈朝角色「甩竿那一刻」面向的那一側繞，
        // 之後就算角色在半空中甩竿時又按了左右鍵轉向，也不會讓迴圈中途變向、動力學被打亂。
        const dir = (LINE_PARAMS.hookLoopDirection >= 0 ? 1 : -1) * (hookThrowPlayerDir >= 0 ? 1 : -1);
        let angleDiff = endAngle - startAngle;
        while (dir > 0 && angleDiff < 0) angleDiff += Math.PI * 2;
        while (dir < 0 && angleDiff > 0) angleDiff -= Math.PI * 2;
        const totalAngle = angleDiff + dir * LINE_PARAMS.hookLoopTurns * Math.PI * 2;

        // 拉竿給的初始衝力（hookThrowAngVel）會隨時間自然衰減，模擬重力/甩竿阻力
        // 把力氣慢慢吃掉；但保留一個下限（hookCastMinAngVel），避免衰減到趨近 0
        // 導致迴圈卡在半路甩不完，這個下限剛好用來銜接「後甩」收尾的等速甩出動作。
        hookThrowAngVel *= Math.pow(LINE_PARAMS.hookCastAngDamp, timeScale);
        if (hookThrowAngVel < LINE_PARAMS.hookCastMinAngVel) hookThrowAngVel = LINE_PARAMS.hookCastMinAngVel;

        hookThrowT += hookThrowAngVel * timeScale;

        // --- 強制完成保險機制 ---
        // 用「真實經過的毫秒數」（deltaTime，不受 timeScale/幀率影響）累計這次迴圈甩竿已經跑了多久；
        // 不管角色跑到畫面的哪個位置、不管上面的物理參數怎麼調（甚至面板貼上奇怪的 JSON），
        // 只要超過 hookLoopForceCompleteMs 這個時間上限，就直接強制把 t 設成 1，
        // 保證每一次拉竿最終都會確實把整個迴圈甩完，絕不會卡在半路、力量不夠就直接掉下去。
        hookThrowLoopElapsedMs += deltaTime;
        if (hookThrowLoopElapsedMs >= LINE_PARAMS.hookLoopForceCompleteMs) {
          hookThrowT = 1;
        }

        if (hookThrowT > 1) hookThrowT = 1;
        const t = hookThrowT;

        const angle = startAngle + totalAngle * t;
        const radius = startRadius + (endRadius - startRadius) * t;

        // 先在「迴圈本地座標」（永遠正對垂直方向）算出橢圓上的點，最後才轉回世界座標、
        // 疊上魚線甩出的傾斜角度，讓整個迴圈跟著歪斜。
        const loopLocalX = Math.cos(angle) * radius * xScale;
        const loopLocalY = Math.sin(angle) * radius;
        const loopWorldPt = toLoopWorld(loopLocalX, loopLocalY);
        hookDrawX = loopWorldPt.x;
        hookY     = loopWorldPt.y;

        if (hookThrowT >= 1) {
          // 迴圈甩完，交給真正的重力自由落下階段——此時鉤子通常還在半空中（角色背後上方），
          // 還沒有碰到水面，所以維持 fishing/hookThrowing = true，空白鍵繼續無效。
          hookThrowPhase = 'fall';
          // 用迴圈甩到最後瞬間的速度（角速度 × 半徑變化）換算出真實的切線速度，
          // 讓自由落下的初始動量延續甩竿最後的力道，銜接得自然，不會憑空歸零卡一下。
          // 水平分量一樣要乘上 xScale 放大回真實空間，跟畫面座標算法保持一致；
          // 這股速度是「本地座標」算出來的方向量，最後也要用同一個傾斜角度轉回世界座標
          // （方向量只需要旋轉，不需要再加上 loopCenter 的位移）。
          const angVelNow = totalAngle * hookThrowAngVel;
          const radVelNow = (endRadius - startRadius) * hookThrowAngVel;
          const localVelX = (-Math.sin(angle) * angVelNow * radius + Math.cos(angle) * radVelNow) * xScale;
          const localVelY =  Math.cos(angle) * angVelNow * radius + Math.sin(angle) * radVelNow;
          hookFallVelX = localVelX * cosTilt - localVelY * sinTilt;
          hookFallVelY = localVelX * sinTilt + localVelY * cosTilt;
        }
      } else if (hookThrowPhase === 'fall') {
        // 'fall' 階段：鉤子還在空中，真正的重力物理，不再是內插動畫。
        hookFallVelY += LINE_PARAMS.hookFallGravity * timeScale;
        if (hookFallVelY > LINE_PARAMS.hookFallMaxVelY) hookFallVelY = LINE_PARAMS.hookFallMaxVelY;
        hookFallVelX *= Math.pow(LINE_PARAMS.hookFallVelXDamp, timeScale);
        // 修正：自由落下時也持續往「角色目前位置對應的落點」方向做一點點牽引，
        // 讓玩家在鉤子還沒落水前繼續左右移動時，最終落水點依然會跟著微調，
        // 而不是完全交給甩竿那一瞬間就已經固定死的動量決定。
        const fallTargetX = bigFish.x - LINE_PARAMS.hookLandingBehindOffset * hookThrowPlayerDir;
        hookFallVelX += (fallTargetX - hookDrawX) * LINE_PARAMS.hookXSpring * timeScale;
        hookDrawX += hookFallVelX * timeScale;
        hookY += hookFallVelY * timeScale;

        // 鉤子碰到水面，這次拉竿就算結束，玩家可以馬上再按一次空白鍵甩下一竿；
        // 但如果玩家沒有馬上再拉竿、也沒按上下鍵，鉤子要繼續靠慣性自動下沉到海底，
        // 碰底之後才會自動浮回待機高度（見下方 hookAutoSinking 的處理）。
        const waterYHere = getWaveY(hookDrawX, wavePhase);
        if (hookY >= waterYHere) {
          hookY = waterYHere;
          hookThrowing = false;
          fishing = false;
          hookThrowPhase = 'loop'; // 重置，準備下一次甩竿
          hookVelY = hookFallVelY; // 保留碰水當下的下沉動量，讓鉤子自然接著往下沉，而不是瞬間停住
          hookVelX = hookFallVelX * 0.3;
          hookAutoSinking = true; // 進入「自動下沉到海底」狀態，直到碰底或玩家操作為止
          fxHookSplash(hookDrawX, waterYHere); // 入水濺花
          sfx('splash', { throttleMs: 200 });
        }
      }
    } else {
      // 未在甩竿時，鉤子水平位置改用「彈簧＋慣性（質量）」的物理模擬：
      // 左右鍵只控制角色移動，鉤子本身不會直接被設定到角色下方，
      // 而是像被釣線拖著走的重物一樣，靠釣線的拉力（彈簧力）慢慢把它拖過去。
      // 因為鉤子有慣性，角色快速左右晃動時，方向不斷切換的拉力會互相抵銷，
      // 鉤子幾乎不太會晃動；只有角色朝同一個方向持續移動，鉤子才會被慢慢拖著走。
      const anchor = getLineStartPoint();
      const dx = anchor.x - hookDrawX;
      const springAccel = dx * LINE_PARAMS.hookXSpring; // 釣線拉力（位移越大，拉力越大）
      hookVelX += springAccel * timeScale;
      hookVelX *= Math.pow(LINE_PARAMS.hookXDamp, timeScale); // 阻尼，避免無止盡晃動
      hookDrawX += hookVelX * timeScale;
    }

    // --- 鍋子隨波浪浮動 ---
    // 鍋蓋正在蓋下來，或已經開始下沉時，鍋子都要停止移動
    if (!bowlSinking && !lidDropping) {
      let bowlTargetY = getWaveY(bowlX + pot.w/2, wavePhase) - pot.h/2 + LINE_PARAMS.bowlWaterOffsetY;
      let spring = 0.18, damp = 0.72;
      if (typeof bowlY !== 'number') bowlY = pot.y;
      // 新增：碗下沉彈跳
      bowlY_vel += (bowlTargetY - bowlY) * spring;
      bowlY_vel += bowlImpulseY;
      bowlImpulseY *= 0.85; // 衰減
      bowlY_vel *= damp;
      bowlY += bowlY_vel;
      // --- 新增：碗慢慢向右移動，到最右邊後再慢慢向左移動，來回反覆 ---
      if (typeof bowlX !== 'number') bowlX = pot.x;
      bowlX += bowlXDir * bowlXSpeed * timeScale;
      if (bowlX > bowlXMax) {
        bowlX = bowlXMax;
        bowlXDir = -1;
      } else if (bowlX < bowlXMin) {
        bowlX = bowlXMin;
        bowlXDir = 1;
      }
    }

    // --- 新增：鍋蓋往下蓋的動畫，蓋緊後才開始鍋子下沉 ---
    if (lidDropping) {
      lidDropOffset += LID_DROP_SPEED * timeScale;
      if (lidDropOffset >= 0) {
        lidDropOffset = 0;
        lidDropping = false;
        // 鍋蓋蓋緊了，換成鍋子整個往下沉的動畫（從目前所在高度開始沉，而不是跳回原位）
        bowlSinking = true;
        bowlSinkTargetY = null;
        if (typeof bowlY !== 'number') bowlY = pot.y;
        sfx('bowlSink');
      }
    }

    // 畫主角和釣竿
    drawPlayer();
    drawRod();

    // 畫魚
    for (let fish of fishes) {
      if (!fish.caught) {
        // 魚群：水平略加正弦蛇行，路徑更有群游感（一般魚維持直線）
        if (fish.fishTier === 'school' && !fish.lifting && !fish.falling) {
          fish.bobTime = (fish.bobTime || 0) + deltaTime / 1000;
          const wobble = Math.sin(fish.bobTime * 1.3 + (fish.schoolWobblePhase || 0)) * (fish.schoolWobbleAmp || 0);
          fish.x += (fish.speed * fish.dir + wobble * 0.04 * fish.dir) * timeScale;
          fish.y = fish.baseY + Math.sin(fish.bobTime * fish.bobSpeed + fish.bobPhase) * fish.bobAmplitude;
        } else {
          fish.x += fish.speed * fish.dir * timeScale;
          if (!fish.lifting && !fish.falling) {
            fish.bobTime = (fish.bobTime || 0) + deltaTime / 1000;
            fish.y = fish.baseY + Math.sin(fish.bobTime * fish.bobSpeed + fish.bobPhase) * fish.bobAmplitude;
          }
        }
        // 游出畫面：一般魚重生；魚群成員直接移除；遊戲結束後不再生成
        if ((fish.dir === 1 && fish.x > canvas.width + SPAWN_MARGIN) || (fish.dir === -1 && fish.x < -SPAWN_MARGIN)) {
          if (fish.fishTier === 'school' || gameOver) {
            fish.removeMe = true;
            continue;
          }
          Object.assign(fish, createFish());
        }
      } else if (fish.fadeOut) {
        fish.x = bowlX + (fish.caughtOffsetX || 0);
        fish.y = bowlY + (fish.caughtOffsetY || 0);
      }
      // 畫面外不畫（仍更新位置），減輕魚群高峰時的繪製量
      if (fish.x < -SPAWN_MARGIN - 20 || fish.x > canvas.width + SPAWN_MARGIN + 20) continue;
      drawFish(fish);
    }
    // 把游出畫面的小黃魚群成員從陣列中移除，避免牠們一直留在 fishes 裡佔用數量
    if (fishes.some(f => f.removeMe)) {
      fishes = fishes.filter(f => !f.removeMe);
    }

    // 畫垃圾
    for (let trash of trashes) {
      if (!trash.lifting && !trash.hit) {
        trash.x += trash.speed * trash.dir * timeScale;
        // 新增：讓垃圾一邊漂一邊隨機上下浮動（正在被釣起或掉回海裡的垃圾不套用，
        // 避免蓋掉「跟著釣線／鉤子移動」或「掉回海裡」動畫用的座標）
        if (!trash.falling) {
          trash.bobTime = (trash.bobTime || 0) + deltaTime / 1000;
          trash.y = trash.baseY + Math.sin(trash.bobTime * trash.bobSpeed + trash.bobPhase) * trash.bobAmplitude;
        }
        if ((trash.dir === 1 && trash.x > canvas.width + SPAWN_MARGIN) || (trash.dir === -1 && trash.x < -SPAWN_MARGIN)) {
          // 重新生成
          Object.assign(trash, createTrash());
        }
      } else if (trash.hit && trash.fadeOut) {
        // 已經釣中、正在淡出：跟著碗一起移動，不要卡死在畫面固定座標上
        trash.x = bowlX + (trash.caughtOffsetX || 0);
        trash.y = bowlY + (trash.caughtOffsetY || 0);
      }
      drawTrash(trash);
      // 淡出動畫播完才真正重置產生新的垃圾，讓玩家先看清楚淡出過程
      if (trash.hit && trash.fadeOut && trash.alpha <= 0) {
        Object.assign(trash, createTrash());
      }
    }

    // 垃圾被釣起來動畫：全程緊貼釣線／鉤子，沒有自己獨立的物理運動
    for (let trash of trashes) {
      if (trash.lifting && !trash.hit) {
        let isHookCatch = (typeof trash.hookLineIndex !== 'number') || trash.hookLineIndex >= LINE_POINTS - 1;
        // 每一幀都直接把垃圾的位置設成鉤子或釣線上那一點的當下位置
        if (isHookCatch) {
          trash.x = hookDrawX;
          trash.y = hookY;
        } else {
          let idx = trash.hookLineIndex;
          let tt = typeof trash.hookLineT === 'number' ? trash.hookLineT : 0;
          let p1 = linePoints[idx];
          let p2 = linePoints[idx + 1] || p1;
          trash.x = p1.x + (p2.x - p1.x) * tt;
          trash.y = p1.y + (p2.y - p1.y) * tt;
        }

        let waterY = getWaveY(trash.x, wavePhase);
        let aboveWater = trash.y <= waterY;
        // 記錄前一幀的 Y 座標，用來判斷這一幀是「往下」還是「往上」經過碗
        let prevLiftY = (typeof trash.prevLiftY === 'number') ? trash.prevLiftY : trash.y;
        // 只有從碗的上方往下經過才算數；從下面往上經過碗不算
        let movingDownIntoPot = trash.y > prevLiftY + 0.01;

        if (aboveWater) {
          trash.everAboveWater = true;
          let inPot = isEnteringPotFromAbove(trash.x, trash.y, prevLiftY, bowlX, bowlY, pot.w, pot.h);
          if (inPot) {
            // 只有真的掉進碗裡才會扣元氣
            trash.hit = true;
            trashCaughtCount++;
            // 新增：進入漸層消失動畫（不要立刻消失，讓玩家先看清楚真的釣到了）
            trash.fadeOut = true;
            trash.alpha = 1;
            trash.fadeElapsed = 0;
            // 新增：記錄相對於碗的偏移量，讓垃圾在淡出期間跟著碗一起移動
            trash.caughtOffsetX = trash.x - bowlX;
            trash.caughtOffsetY = trash.y - bowlY;
            // 新增：垃圾進入碗 fadeOut 時播放扣元氣音效（延遲 1 秒）
            penaltySound.currentTime = 0;
            setTimeout(() => penaltySound.play(), 1000); // 延遲1秒播放
            if (timeLeft > 0 && !gameOver) {
              timeLeft = Math.max(0, timeLeft - TRASH_PENALTY);
              fxEnergyPenalty(trash.x, trash.y, TRASH_PENALTY);
            }
            fxPotCatch(trash.x, trash.y, false);
            trash.lifting = false;
            trash.everAboveWater = false;
          }
          // 還沒對到碗：繼續黏著鉤子/線等待玩家移動貓咪對準
        } else {
          if (trash.everAboveWater) {
            // 曾經被拉出水面過，但沒對準碗、鉤子又沉回海裡：脫鉤沉回海底，之後繼續正常漂浮
            trash.falling = true;
            trash.fallT = 0;
            trash.fallStartY = trash.y;
            trash.fallEndY = 530 + Math.random() * 40;
            trash.lifting = false;
            trash.everAboveWater = false;
          } else if (!fishing && !hookThrowing) {
            // 修正：把 baseY 同步成目前實際位置，避免下一幀用舊的 baseY 計算位置，
            // 造成垃圾瞬間「消失、瞬移回海裡」的跳動感
            trash.baseY = trash.y;
            trash.lifting = false;
            trash.hookLineIndex = null;
            trash.hookLineT = 0;
          }
        }
        // 記錄這一幀的 Y 座標，供下一幀判斷方向使用
        trash.prevLiftY = trash.y;
      }
      // 沒接住的垃圾：沉回海底後繼續往前漂（下沉速度跟漂動速度差不多）
      if (trash.falling) {
        let fallSpeed = trash.speed * 0.8;
        if (trash.y < trash.fallEndY) {
          trash.y += fallSpeed * timeScale;
          if (trash.y > trash.fallEndY) trash.y = trash.fallEndY;
        } else {
          trash.y -= fallSpeed * timeScale;
          if (trash.y < trash.fallEndY) trash.y = trash.fallEndY;
        }
        if (Math.abs(trash.y - trash.fallEndY) < 1) {
          trash.y = trash.fallEndY;
          // 修正：下沉動畫結束時同步 baseY，避免恢復自由漂動那一幀又跳回舊的 baseY
          trash.baseY = trash.y;
          trash.falling = false;
        }
      }
    }

    // 特別魚：移動／上鉤／進鍋（支援最多 2 隻）
    for (let si = specialSeaCreatures.length - 1; si >= 0; si--) {
      const sc = specialSeaCreatures[si];
      if (!sc) { specialSeaCreatures.splice(si, 1); continue; }

      if (sc.reactCooldown > 0) {
        sc.reactCooldown -= deltaTime / 1000;
        if (sc.reactCooldown < 0) sc.reactCooldown = 0;
      }

      if (!sc.caught && !sc.lifting && !sc.falling) {
        updateSpecialFleeFromHook(sc, deltaTime / 1000);
        updateSpecialSwim(sc, deltaTime / 1000, timeScale);
        // 碰到左右邊界：若還有徘徊次數 → 掉頭再游；否則離場
        const offRight = sc.dir === 1 && sc.x > canvas.width + SPAWN_MARGIN;
        const offLeft = sc.dir === -1 && sc.x < -SPAWN_MARGIN;
        if (offRight || offLeft) {
          if ((sc.passesLeft || 0) > 0) {
            sc.passesLeft -= 1;
            sc.dir *= -1;
            // 夾回邊界內，避免同一幀連續觸發
            if (offRight) sc.x = canvas.width + SPAWN_MARGIN - 2;
            else sc.x = -SPAWN_MARGIN + 2;
            // 換深度，路線不那麼呆板
            const top = getFishTopY() + 20;
            const bot = getFishBottomY() - 20;
            sc.baseY = top + Math.random() * Math.max(10, bot - top);
            sc.burstBoost = Math.max(sc.burstBoost || 0, 0.25);
          } else {
            specialSeaCreatures.splice(si, 1);
            continue;
          }
        }
      } else if (sc.caught && sc.fadeOut) {
        sc.x = bowlX + (sc.caughtOffsetX || 0);
        sc.y = bowlY + (sc.caughtOffsetY || 0);
      }

      // 上鉤跟隨
      if (sc.lifting && !sc.caught) {
        // struggle 抖動（無拉桿小遊戲）
        if (sc.struggleMs > 0) {
          sc.struggleElapsed = (sc.struggleElapsed || 0) + deltaTime;
          sc.drawTilt = Math.sin(sc.struggleElapsed * 0.04) * 0.35;
          if (sc.struggleElapsed >= sc.struggleMs) {
            // 掙扎超時脫鉤 → 完整落地動作
            beginSpecialFall(sc, {
              reason: 'struggle_timeout',
              vx: (Math.random() - 0.5) * 3.0,
              vy: 0.6 + Math.random() * 1.4
            });
            sc.burstBoost = 1.3;
            if (Math.random() < 0.5) sc.dir *= -1;
            continue;
          }
        }

        let isHookCatch = (typeof sc.hookLineIndex !== 'number') || sc.hookLineIndex >= LINE_POINTS - 1;
        if (isHookCatch) {
          sc.x = hookDrawX;
          // heavy：鉤住時略往下墜；拉桿中再略沉
          const sink = (sc.heavySink ? sc.heavySink * 28 : 0);
          sc.y = hookY + sink;
        } else {
          let idx = sc.hookLineIndex;
          let tt = typeof sc.hookLineT === 'number' ? sc.hookLineT : 0;
          let p1 = linePoints[idx];
          let p2 = linePoints[idx + 1] || p1;
          sc.x = p1.x + (p2.x - p1.x) * tt;
          sc.y = p1.y + (p2.y - p1.y) * tt + (sc.heavySink ? sc.heavySink * 18 : 0);
        }
        let waterY = getWaveY(sc.x, wavePhase);
        let aboveWater = sc.y <= waterY;
        let prevLiftY = (typeof sc.prevLiftY === 'number') ? sc.prevLiftY : sc.y;
        if (aboveWater) {
          sc.everAboveWater = true;

          // 拉出水面後取消 struggle 計時
          if (sc.struggleMs > 0) sc.struggleMs = 0;

          // slip：出水後、進鍋前有機率掙脫（每幀低機率，heavy／resist 較高）
          if (!sc.caught && sc.slipChance > 0 && Math.random() < sc.slipChance * 0.012 * timeScale) {
            beginSpecialFall(sc, {
              reason: 'slip',
              vx: (Math.random() - 0.5) * 2.2 + (typeof hookVelX === 'number' ? hookVelX * 0.15 : 0),
              vy: 1.2 + Math.random() * 1.5
            });
            sc.prevLiftY = sc.y;
            continue;
          }

          let inPot = isEnteringPotFromAbove(sc.x, sc.y, prevLiftY, bowlX, bowlY, pot.w, pot.h);
          if (inPot && timeLeft > 0 && !gameOver) {
            sc.caught = true;
            sc.caughtOffsetX = sc.x - bowlX;
            sc.caughtOffsetY = sc.y - bowlY;
            const addScore = (typeof sc.rewardScore === 'number') ? sc.rewardScore : 0;
            const addEnergy = (typeof sc.rewardEnergy === 'number') ? sc.rewardEnergy : 0;
            recordCatch(sc.type, addScore);
            if (addScore !== 0) {
              score = Math.max(0, score + addScore);
              if (addScore > 0) registerScoreGain(addScore);
              pushScorePopup(addScore, sc.x, sc.y - 30);
            }
            if (addEnergy > 0) timeLeft = Math.min(GAME_TIME, timeLeft + addEnergy);
            else if (addEnergy < 0) timeLeft = Math.max(0, timeLeft + addEnergy);
            if (addScore > 0 || addEnergy > 0) {
              playRandomFoodSound();
              fxPotCatch(sc.x, sc.y, true);
            } else {
              fxPotCatch(sc.x, sc.y, false);
            }
            sc.fadeOut = true;
            sc.alpha = 1;
            sc.fadeElapsed = 0;
            sc.lifting = false;
            sc.everAboveWater = false;
            flushSpecialPending(); // 進鍋後立刻消化 pending
          }
        } else {
          if (sc.everAboveWater) {
            // 曾出水但鉤沉回海：脫鉤落地
            beginSpecialFall(sc, {
              reason: 'miss_pot',
              vx: (Math.random() - 0.5) * 1.6,
              vy: 0.8 + Math.random() * 1.2
            });
          } else if (!fishing && !hookThrowing) {
            sc.lifting = false;
            sc.hookLineIndex = null;
            sc.hookLineT = 0;
            sc.hookHits = 0;
          }
        }
        sc.prevLiftY = sc.y;
      }

      // 脫鉤落地（拋物線 + 旋轉 + 入水水花）
      if (sc.falling) {
        updateSpecialFall(sc, deltaTime / 1000, timeScale);
      }

      drawSpecialSeaCreature(sc);
    }
    syncSpecialAlias();

    // 特別魚統一排程（pending / 主題 / 低元氣）
    updateSpecialSpawns(deltaTime / 1000);
    updateTrashSpawn();

    // 拉桿小遊戲
    updateReelMinigame(deltaTime / 1000);
    drawReelMinigame();

    // 粒子：更新 + 繪製（結束後凍結，仍繪製；YouTube 在 HTML 層繼續播）
    updateParticles(gameOver ? 0 : deltaTime / 1000);
    drawParticles();

    // 分數與元氣 HUD（樣式參考原版：分數在上、元氣量表在下）
    // 補間動畫：讓 displayTimeLeft 慢慢趨近 timeLeft
    const lerpSpeed = 0.18; // 越大越快
    displayTimeLeft += (timeLeft - displayTimeLeft) * lerpSpeed;
    if (Math.abs(displayTimeLeft - timeLeft) < 0.1) displayTimeLeft = timeLeft;
    // 元氣危急全畫面（在 HUD 之下、遊戲場景之上）
    drawEnergyCriticalOverlay();
    drawScoreAndEnergyHUD();
    updateSpecialAlert(deltaTime / 1000);
    updateScorePopups(deltaTime / 1000);
    drawScorePopups();

    // 魚被釣上來動畫：全程緊貼釣線／鉤子，沒有自己獨立的物理運動
    for (let fish of fishes) {
      if (fish.lifting && !fish.caught) {
        // 記錄前一幀的 Y 座標，用來判斷魚這一幀是「往下」還是「往上」經過碗
        let prevLiftY = (typeof fish.prevLiftY === 'number') ? fish.prevLiftY : fish.y;
        let isHookCatch = (typeof fish.hookLineIndex !== 'number') || fish.hookLineIndex >= LINE_POINTS - 1;
        // 每一幀都直接把魚的位置設成鉤子或釣線上那一點的當下位置，
        // 魚完全黏著線／鉤子移動，不會有自己另外的運動軌跡
        if (isHookCatch) {
          fish.x = hookDrawX;
          fish.y = hookY;
        } else {
          let idx = fish.hookLineIndex;
          let tt = typeof fish.hookLineT === 'number' ? fish.hookLineT : 0;
          let p1 = linePoints[idx];
          let p2 = linePoints[idx + 1] || p1;
          fish.x = p1.x + (p2.x - p1.x) * tt;
          fish.y = p1.y + (p2.y - p1.y) * tt;
        }

        let waterY = getWaveY(fish.x, wavePhase);
        let aboveWater = fish.y <= waterY;
        // 只有從碗的上方往下經過才算數；從下面往上經過碗不算
        let movingDownIntoPot = fish.y > prevLiftY + 0.01;

        if (aboveWater) {
          fish.everAboveWater = true;
          // 已經被拉出水面：貓咪左右移動時，魚會跟著鉤子/線一起移動，
          // 只要目前位置剛好對到碗、且是從上往下經過，就算釣到
          let inPot = isEnteringPotFromAbove(fish.x, fish.y, prevLiftY, bowlX, bowlY, pot.w, pot.h);
          if (inPot && timeLeft > 0 && !gameOver) {
            fish.caught = true;
            // 新增：記錄相對於碗的偏移量，讓魚在淡出期間跟著碗一起移動，
            // 不然碗會左右漂移、上下彈跳，魚卻卡在原地不動，看起來就像從碗裡跑出去
            fish.caughtOffsetX = fish.x - bowlX;
            fish.caughtOffsetY = fish.y - bowlY;
            // 新增：碗下沉衝擊
            bowlImpulseY = 8; // 下沉
            // 參考原版：魚類是小幅度累積分數，壞魚只會消耗元氣
            // 依 rewardScore / rewardEnergy（魚 A/B/C、海膽、西瓜魚、小魚群）
            {
              const rs = (typeof fish.rewardScore === 'number') ? fish.rewardScore : 0;
              const re = (typeof fish.rewardEnergy === 'number') ? fish.rewardEnergy : 0;
              // 記錄種類數量與分數
              let catchKey = 'mid_0';
              if (fish.fishTier === 'school' || fish.fishTier === 'small') {
                catchKey = 'small_' + (typeof fish.fishVariant === 'number' ? fish.fishVariant : 0);
              } else if (fish.fishTier === 'mid') {
                catchKey = 'mid_' + (typeof fish.fishVariant === 'number' ? fish.fishVariant : 0);
              } else if (fish.fishTier === 'theme_mid') {
                catchKey = fish.fishKind || 'fish_shi';
              } else if (fish.fishTier === 'urchin') {
                catchKey = 'urchin';
              } else if (fish.fishTier === 'watermelon') {
                catchKey = 'watermelon';
              }
              recordCatch(catchKey, rs);
              if (rs !== 0) {
                score = Math.max(0, score + rs);
                if (rs > 0) registerScoreGain(rs);
                pushScorePopup(rs, fish.x, fish.y - 28);
              }
              if (re > 0) timeLeft = Math.min(GAME_TIME, timeLeft + re);
              else if (re < 0) {
                timeLeft = Math.max(0, timeLeft + re);
                fxEnergyPenalty(fish.x, fish.y, -re);
              }
              const good = rs > 0 || re > 0;
              fxPotCatch(fish.x, fish.y, good);
            }
            // 立刻生成新魚（魚群不補；遊戲結束後不再生成）
            if (fish.fishTier !== 'school' && !gameOver && timeLeft > 0) {
              fishes.push(createFish());
            }
            // 新增：進入漸層消失動畫
            fish.fadeOut = true;
            fish.alpha = 1;
            fish.fadeElapsed = 0;
            // 扣元氣：海膽／西瓜魚；補元氣：好魚播食物音
            if ((typeof fish.rewardEnergy === 'number') && fish.rewardEnergy < 0) {
              penaltySound.currentTime = 0;
              setTimeout(() => penaltySound.play(), 1000);
            } else if ((typeof fish.rewardScore === 'number') && fish.rewardScore > 0) {
              playRandomFoodSound();
            }
            fish.lifting = false;
            fish.everAboveWater = false;
          } else if (inPot) {
            // 對到碗了，但當下時間已到／遊戲已結束：視為沒接住，沉回海裡
            fish.falling = true;
            fish.fallT = 0;
            fish.fallStartY = fish.y;
            fish.fallEndY = 530 + Math.random() * 40;
            fish.lifting = false;
            fish.everAboveWater = false;
          }
          // 還沒對到碗：繼續黏著鉤子/線等待玩家移動貓咪對準
        } else {
          // 目前沒有露出水面
          if (fish.everAboveWater) {
            // 曾經被拉出水面過，但沒對準碗、鉤子又沉回海裡：脫鉤沉回海底，之後繼續正常游動
            fish.falling = true;
            fish.fallT = 0;
            fish.fallStartY = fish.y;
            fish.fallEndY = 530 + Math.random() * 40;
            fish.lifting = false;
            fish.everAboveWater = false;
          } else if (!fishing && !hookThrowing) {
            // 從沒被拉出水面過，玩家已經放開釣竿：脫離釣線，恢復自由游動
            // 修正：把 baseY 同步成目前實際位置，避免下一幀用舊的 baseY 計算位置，
            // 造成魚瞬間「消失、瞬移回海裡」的跳動感
            fish.baseY = fish.y;
            fish.lifting = false;
            fish.hookLineIndex = null;
            fish.hookLineT = 0;
          }
        }
        // 記錄這一幀的 Y 座標，供下一幀判斷方向使用
        fish.prevLiftY = fish.y;
      }
      // 沒接住的魚：沉回海底後繼續往前游（下沉速度跟游動速度差不多）
      if (fish.falling) {
        let fallSpeed = fish.speed * 0.8; // 跟游動速度相近，不要太快
        if (fish.y < fish.fallEndY) {
          fish.y += fallSpeed * timeScale;
          if (fish.y > fish.fallEndY) fish.y = fish.fallEndY;
        } else {
          fish.y -= fallSpeed * timeScale;
          if (fish.y < fish.fallEndY) fish.y = fish.fallEndY;
        }
        if (Math.abs(fish.y - fish.fallEndY) < 1) {
          fish.y = fish.fallEndY;
          // 修正：下沉動畫結束時同步 baseY，避免恢復自由游動那一幀又跳回舊的 baseY
          fish.baseY = fish.y;
          fish.falling = false;
        }
      }
    }

    // 鉤子動畫：拋竿動畫結束後，若還沒沉回目標高度，慢慢回到目前的目標高度
    // （拉竿甩竿過程中的速度改由 hookCastImpulse / hookCastAngDamp / hookFallGravity 等物理參數控制，詳見上方 hookThrowing 區塊）
    if (hookY < hookTargetY && !hookThrowing) {
      hookY += LINE_PARAMS.hookSettleDownSpeed * timeScale;
      if (hookY > hookTargetY) hookY = hookTargetY;
    }

    // 除錯用：調參面板開啟時，把各物件目前的碰撞判定框畫成虛線
    drawDebugHitboxes();

    // --- 新增：碗沉到底動畫 ---
    if (bowlSinking) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      // 畫背景圖（天空+海洋）
      if (bgImg.complete && bgImg.naturalWidth > 0) {
        ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
      } else {
        let seaY = LINE_PARAMS.seaSurfaceY;
        let skyGradient = ctx.createLinearGradient(0, 0, 0, seaY);
        skyGradient.addColorStop(0, '#b3e0ff');
        skyGradient.addColorStop(0.3, '#e6f6ff');
        skyGradient.addColorStop(0.7, '#a4c8e1');
        skyGradient.addColorStop(1, '#7bbbe6');
        ctx.fillStyle = skyGradient;
        ctx.fillRect(0, 0, canvas.width, seaY);
        let seaGradient = ctx.createLinearGradient(0, seaY, 0, canvas.height);
        seaGradient.addColorStop(0, '#7bbbe6');
        seaGradient.addColorStop(0.15, '#3a8cc1');
        seaGradient.addColorStop(0.4, '#206090');
        seaGradient.addColorStop(0.7, '#133a5c');
        seaGradient.addColorStop(1, '#0a1a2f');
        ctx.fillStyle = seaGradient;
        ctx.fillRect(0, seaY, canvas.width, canvas.height - seaY);
      }
      // 畫海平面線
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, LINE_PARAMS.seaSurfaceY);
      ctx.lineTo(canvas.width, LINE_PARAMS.seaSurfaceY);
      ctx.stroke();
      // --- 鍋子下沉動畫 ---
      if (bowlSinkTargetY === null) {
        bowlSinkTargetY = canvas.height - pot.h - 20;
      }
      if (bowlY < bowlSinkTargetY) {
        bowlY += bowlSinkSpeed * timeScale;
        if (bowlY > bowlSinkTargetY) bowlY = bowlSinkTargetY;
      }
      drawPlayer();
      // 分數／元氣 HUD 與結束字樣（不再疊加黑色半透明遮罩，畫面維持乾淨）
      drawScoreAndEnergyHUD();
      ctx.fillStyle = "#fff";
      ctx.font = "bold 48px Arial";
      ctx.lineWidth = 6;
      ctx.strokeStyle = "rgba(0,0,0,0.55)";
      ctx.strokeText("遊戲結束", 300, 300);
      ctx.fillText("遊戲結束", 300, 300);
      ctx.font = "36px Arial";
      ctx.fillStyle = "#0c0";
      ctx.fillText("分數: " + score, 320, 360);
      // 碗下沉動畫已停用（改為遊戲結束 POPUP），此區塊僅保留相容，不再顯示排行榜
      if (bowlY >= bowlSinkTargetY) {
        bowlY = bowlSinkTargetY;
        presentGameFrame();
        return;
      }
      frameNext();
      return;
    }
    // 遊戲結束：不再播放鍋蓋／碗下沉動畫、不顯示排行榜，改為直接跳出結束 POPUP
    let trashAnimating = trashes.some(trash => trash.lifting);
    if (gameStarted && timeLeft <= 0 && !gameOver && !trashAnimating && !pendingGameOver) {
      gameOver = true;
      displayTimeLeft = 0;
      lidDropping = false;
      bowlSinking = false;
      // 結束後暫停魚類生成，先播 GameOver 動畫再開 popup
      if (typeof stopFishSpawnsOnGameOver === 'function') stopFishSpawnsOnGameOver();
      if (typeof playGameOverSequence === 'function') playGameOverSequence();
      else showGameOverModal();
      frameNext();
      return;
    }
    frameNext();

    // === 緊張背景音效 ===
    if (!gameOver && timeLeft > 0) {
      let minInterval = 80; // 幾乎連續
      let maxInterval = 2000; // 最慢2秒
      let t = Math.max(0, Math.min(1, timeLeft / GAME_TIME));
      tensionSoundInterval = minInterval + (maxInterval - minInterval) * t;
      if (!lastTensionSoundTime) lastTensionSoundTime = currentTime;
      // 只有當音效沒在播放時才播放下一次
      if ((currentTime - lastTensionSoundTime >= tensionSoundInterval) && tensionSound.paused) {
        tensionSound.currentTime = 0;
        tensionSound.play();
        lastTensionSoundTime = currentTime;
      }
    } else {
      tensionSound.pause();
      tensionSound.currentTime = 0;
      lastTensionSoundTime = 0;
    }
  } catch (e) {
    // 若有錯誤，顯示在 console，並嘗試繼續下一幀
    console.error('gameLoop error:', e);
    frameNext();
  }
}

const joystick = document.getElementById('joystick');
const knob = document.getElementById('joystick-knob');
let joystickActive = false;
let joystickCenter = { x: 0, y: 0 };

joystick.addEventListener('pointerdown', (e) => {
  joystickActive = true;
  const rect = joystick.getBoundingClientRect();
  joystickCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
  updateJoystick(e);
});

window.addEventListener('pointermove', (e) => {
  if (joystickActive) updateJoystick(e);
});

function getJoystickMetrics() {
  const base = joystick.getBoundingClientRect();
  const ks = knob.getBoundingClientRect();
  const baseSize = base.width || 100;
  const knobSize = ks.width || baseSize * 0.46;
  const centerOff = (baseSize - knobSize) / 2;
  const maxDist = Math.max(16, baseSize / 2 - knobSize / 4);
  const dead = Math.max(8, baseSize * 0.1);
  return { centerOff, maxDist, dead };
}

window.addEventListener('pointerup', () => {
  if (joystickActive) {
    joystickActive = false;
    const m = getJoystickMetrics();
    knob.style.left = m.centerOff + 'px';
    knob.style.top = m.centerOff + 'px';
    keyState.left = false;
    keyState.right = false;
    keyState.up = false;
    keyState.down = false;
  }
});

function updateJoystick(e) {
  const dx = e.clientX - joystickCenter.x;
  const dy = e.clientY - joystickCenter.y;
  const dist = Math.hypot(dx, dy);
  const m = getJoystickMetrics();
  const angle = Math.atan2(dy, dx);
  const moveDist = Math.min(dist, m.maxDist);
  const knobX = m.centerOff + Math.cos(angle) * moveDist;
  const knobY = m.centerOff + Math.sin(angle) * moveDist;
  knob.style.left = knobX + 'px';
  knob.style.top = knobY + 'px';

  keyState.left = dx < -m.dead;
  keyState.right = dx > m.dead;
  keyState.up = dy < -m.dead;
  keyState.down = dy > m.dead;
}
// 響應式：只調「顯示 canvas」像素；邏輯 buffer 永遠 540×960
function resizeGameCanvas() {
  // 邏輯尺寸鎖死，避免 Mobile／桌面世界座標漂移
  if (canvas.width !== GAME_W) canvas.width = GAME_W;
  if (canvas.height !== GAME_H) canvas.height = GAME_H;

  const bg = document.getElementById('gameBg');
  const rect = bg ? bg.getBoundingClientRect() : null;
  let cssW = rect && rect.width > 0 ? rect.width : Math.min(window.innerWidth, window.innerHeight * 9 / 16);
  let cssH = rect && rect.height > 0 ? rect.height : Math.min(window.innerHeight, window.innerWidth * 16 / 9);
  // 保 9:16
  if (cssW / cssH > 9 / 16) cssW = cssH * 9 / 16;
  else cssH = cssW * 16 / 9;

  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  displayCanvas.style.width = '100%';
  displayCanvas.style.height = '100%';
  displayCanvas.style.position = 'absolute';
  displayCanvas.style.left = '0';
  displayCanvas.style.top = '0';
  const bw = Math.max(1, Math.round(cssW * dpr));
  const bh = Math.max(1, Math.round(cssH * dpr));
  if (displayCanvas.width !== bw) displayCanvas.width = bw;
  if (displayCanvas.height !== bh) displayCanvas.height = bh;

  if (typeof updateSeaYtLayout === 'function') updateSeaYtLayout();

// ============================================================
const SEA_YT_PLAYLIST_ID = 'PLLqWPOe5P7pY';
let seaYtStarted = false;
let seaYtMuted = true; // 預設靜音，符合行動自動播放政策

function postSeaYtCommand(func, args) {
  const iframe = document.getElementById('seaYtFrame');
  if (!iframe || !iframe.contentWindow) return;
  const payload = JSON.stringify({
    event: 'command',
    func: func,
    args: args || []
  });
  try {
    iframe.contentWindow.postMessage(payload, '*');
  } catch (e) { /* ignore */ }
}

function updateSeaYtLayout() {
  const seaY = (typeof LINE_PARAMS !== 'undefined' && LINE_PARAMS.seaSurfaceY) ? LINE_PARAMS.seaSurfaceY : 270;
  const ratio = Math.max(0.12, Math.min(0.6, seaY / (canvas.height || 960)));
  const top = (ratio * 100) + '%';
  const wrap = document.getElementById('seaYtWrap');
  const overlay = document.getElementById('seaBgOverlay');
  [wrap, overlay].forEach(function(el) {
    if (!el) return;
    el.style.top = top;
    el.style.bottom = '0';
    el.style.left = '0';
    el.style.right = '0';
  });
}

function setSeaMediaPlaying(on) {
  const wrap = document.getElementById('seaYtWrap');
  const overlay = document.getElementById('seaBgOverlay');
  if (wrap) wrap.classList.toggle('is-playing', !!on);
  if (overlay) overlay.classList.toggle('is-playing', !!on);
}

function updateYtUnmuteBtn() {
  const btn = document.getElementById('ytUnmuteBtn');
  if (!btn) return;
  let icon = btn.querySelector('img');
  if (!icon) {
    icon = document.createElement('img');
    icon.width = 22;
    icon.height = 22;
    icon.alt = '海影聲音';
    btn.textContent = '';
    btn.appendChild(icon);
  }
  if (!seaYtStarted) {
    btn.classList.remove('is-visible', 'is-on', 'is-need-sound');
    btn.setAttribute('aria-pressed', 'false');
    icon.src = 'img/icon_speaker_OFF.png';
    return;
  }
  btn.classList.add('is-visible');
  if (seaYtMuted) {
    // 靜音／關聲：OFF 圖 + 脈衝提示可開聲
    btn.classList.remove('is-on');
    btn.classList.add('is-need-sound');
    icon.src = 'img/icon_speaker_OFF.png';
    btn.setAttribute('aria-pressed', 'false');
    btn.title = '開啟海影聲音';
  } else {
    // 已開聲：ON 圖，停止動作
    btn.classList.add('is-on');
    btn.classList.remove('is-need-sound');
    icon.src = 'img/icon_speaker_ON.png';
    btn.setAttribute('aria-pressed', 'true');
    btn.title = '關閉海影聲音';
  }
}

/**
 * 開始／恢復海影：在「開始遊戲」手勢當下啟動
 * 預設有聲（mute=0）；若行動瀏覽器擋有聲，可再點 🔊
 * 必須同步呼叫，勿 setTimeout 延後
 */
function startSeaYoutube() {
  const wrap = document.getElementById('seaYtWrap');
  if (!wrap) return;
  updateSeaYtLayout();

  if (seaYtStarted) {
    setSeaMediaPlaying(true);
    postSeaYtCommand('playVideo');
    postSeaYtCommand('mute');
    seaYtMuted = true;
    updateYtUnmuteBtn();
    return;
  }

  seaYtStarted = true;
  seaYtMuted = true; // 預設靜音：Mobile 自動播最穩
  const listId = SEA_YT_PLAYLIST_ID;
  // videoseries + list= 播放整份 playlist；loop=1 清單播完再從頭
  const params = [
    'listType=playlist',
    'list=' + encodeURIComponent(listId),
    'autoplay=1',
    'mute=1',
    'loop=1',
    'controls=0',
    'modestbranding=1',
    'rel=0',
    'playsinline=1',
    'iv_load_policy=3',
    'fs=0',
    'disablekb=1',
    'enablejsapi=1',
    // 建議 360p：vq=medium（顯示尺寸仍 CSS 1120×630，解碼解析度盡量低）
    'vq=medium',
    'origin=' + encodeURIComponent(location.origin || '')
  ].join('&');

  const iframe = document.createElement('iframe');
  iframe.id = 'seaYtFrame';
  iframe.title = '海中背景 playlist';
  iframe.allow = 'autoplay; encrypted-media; picture-in-picture';
  iframe.setAttribute('allowfullscreen', '0');
  iframe.setAttribute('playsinline', '1');
  iframe.referrerPolicy = 'strict-origin-when-cross-origin';
  // 官方 playlist embed：/embed/videoseries?list=PLAYLIST_ID
  iframe.src = 'https://www.youtube.com/embed/videoseries?' + params;
  wrap.innerHTML = '';
  wrap.appendChild(iframe);
  setSeaMediaPlaying(true);
  updateYtUnmuteBtn();

  function forceYt360p() {
    // medium ≈ 360p；新版 YT 可能忽略，無副作用
    postSeaYtCommand('setPlaybackQuality', ['medium']);
    postSeaYtCommand('setPlaybackQualityRange', ['medium', 'medium']);
  }

  iframe.addEventListener('load', function() {
    postSeaYtCommand('playVideo');
    postSeaYtCommand('mute');
    forceYt360p();
    postSeaYtCommand('setPlaybackRate', [1]);
    // 延遲再請求兩次（播放器就緒後較容易生效）
    setTimeout(forceYt360p, 800);
    setTimeout(forceYt360p, 2500);
  });
}

function toggleSeaYtSound() {
  if (!seaYtStarted) return;

// === 虛擬搖桿與螢幕按鈕 ===
(function() {
  function updateControlsVisibility() {
    const isLandscape = window.innerWidth > window.innerHeight;
    const isPortrait = window.innerWidth <= window.innerHeight;
    const isMobile = window.innerWidth <= 768;
    const joystick = document.getElementById('joystick');
    const screenButtons = document.getElementById('screenButtons');
    if (joystick && screenButtons) {
      if (isLandscape && window.innerWidth <= 900) {
        joystick.style.display = 'block';
        screenButtons.style.display = 'block';
      } else if (isPortrait && isMobile) {
        joystick.style.display = 'block';
        screenButtons.style.display = 'block';
      } else {
        joystick.style.display = 'none';
        screenButtons.style.display = 'none';
      }
      screenButtons.style.zIndex = 2000;
    }
  }
  window.addEventListener('resize', updateControlsVisibility);
  window.addEventListener('orientationchange', updateControlsVisibility);
  updateControlsVisibility();
  window.addEventListener('resize', () => setTimeout(updateKnobGeometry, 50));
  window.addEventListener('orientationchange', () => setTimeout(updateKnobGeometry, 50));
  setTimeout(updateKnobGeometry, 50);

  // 虛擬搖桿控制
  const joystick = document.getElementById('joystick');
  const knob = document.getElementById('joystick-knob');
  const directionIndicators = document.querySelectorAll('.direction-indicator');
  let dragging = false, startX = 0, startY = 0, baseRect = null;
  let joyDX = 0, joyDY = 0;
  let activeTouchId = null;
  let knobCenterOffset = 35; // 動態計算：底座與旋鈕置中所需的位移量
  let knobMaxDist = 45; // 動態計算：旋鈕可拖曳的最大距離

  function updateKnobGeometry() {
    if (!joystick || !knob) return;
    const baseSize = joystick.offsetWidth;
    const knobSize = knob.offsetWidth;
    knobCenterOffset = (baseSize - knobSize) / 2;
    // 讓旋鈕邊緣最遠可以貼到底座邊緣，並保留一點緩衝
    knobMaxDist = Math.max(20, baseSize / 2 - knobSize / 4);
  }

  function updateDirectionIndicators() {
    directionIndicators.forEach(indicator => {
      indicator.classList.remove('active');
    });
    if (Math.abs(joyDX) > 0.1 || Math.abs(joyDY) > 0.1) {
      let direction = '';
      if (joyDY < -0.3) direction += 'up';
      else if (joyDY > 0.3) direction += 'down';
      if (joyDX < -0.3) direction += '-left';
      else if (joyDX > 0.3) direction += '-right';
      if (direction.includes('-')) {
        const indicator = document.querySelector(`.direction-indicator.${direction}`);
        if (indicator) indicator.classList.add('active');
      } else if (direction) {
        const indicator = document.querySelector(`.direction-indicator.${direction}`);
        if (indicator) indicator.classList.add('active');
      }
    }
  }

  function resetJoystick() {
    dragging = false;
    activeTouchId = null;
    knob.style.left = knobCenterOffset + 'px';
    knob.style.top = knobCenterOffset + 'px';
    joyDX = 0; joyDY = 0;
    keyState.left = keyState.right = keyState.up = keyState.down = false;
    directionIndicators.forEach(indicator => {
      indicator.classList.remove('active');
    });
  }

  function moveKnobTo(clientX, clientY) {
    let dx = clientX - startX;
    let dy = clientY - startY;
    const maxDist = knobMaxDist;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist > maxDist) {
      dx = dx * maxDist / dist;
      dy = dy * maxDist / dist;
    }
    knob.style.left = (knobCenterOffset + dx) + 'px';
    knob.style.top = (knobCenterOffset + dy) + 'px';
    joyDX = dx / maxDist;
    joyDY = dy / maxDist;
    keyState.left = joyDX < -0.2;
    keyState.right = joyDX > 0.2;
    keyState.up = joyDY < -0.2;
    keyState.down = joyDY > 0.2;
    updateDirectionIndicators();
  }

  if (joystick && knob) {
    // 綁在整個底座（外圈）上，而不是只綁在中間的小旋鈕上，
    // 這樣玩家點在搖桿範圍內任何地方都能立刻開始拖曳，大幅提升靈敏度
    joystick.addEventListener('touchstart', function(e) {
      if (dragging) return;
      dragging = true;
      updateKnobGeometry();
      const touch = e.changedTouches[0];
      activeTouchId = touch.identifier;
      baseRect = joystick.getBoundingClientRect();
      startX = baseRect.left + baseRect.width / 2;
      startY = baseRect.top + baseRect.height / 2;
      // 立刻把旋鈕移動到手指按下的位置，減少「按了沒反應」的感覺
      moveKnobTo(touch.clientX, touch.clientY);
      e.preventDefault();
      e.stopPropagation();
    }, { passive: false });

    document.addEventListener('touchmove', function(e) {
      if (!dragging) return;
      let touch = null;
      for (let t of e.touches) {
        if (t.identifier === activeTouchId) {
          touch = t;
          break;
        }
      }
      if (!touch) return;
      moveKnobTo(touch.clientX, touch.clientY);
      e.preventDefault();
    }, {passive: false});

    document.addEventListener('touchend', function(e) {
      if (!dragging) return;
      let stillTouching = false;
      for (let t of e.touches) {
        if (t.identifier === activeTouchId) {
          stillTouching = true;
          break;
        }
      }
      if (stillTouching) return;
      resetJoystick();
    }, {passive: false});

    // 補上 touchcancel：觸控常會被系統手勢、多指觸控等中斷而不會觸發 touchend，
    // 若沒處理這個事件，dragging 會卡在 true，導致搖桿之後完全沒反應
    document.addEventListener('touchcancel', function(e) {
      if (!dragging) return;
      let stillTouching = false;
      for (let t of e.touches) {
        if (t.identifier === activeTouchId) {
          stillTouching = true;
          break;
        }
      }
      if (stillTouching) return;
      resetJoystick();
    }, {passive: false});
  }

  // 虛擬按鈕控制
  const actionBtn = document.getElementById('actionBtn');
  if (actionBtn) {
    function triggerFishingAction(e) {
      // 拉桿小遊戲優先：連點加進度
      if (reelGame.active) {
        reelTap();
        if (e) { e.preventDefault(); e.stopPropagation(); }
        return;
      }
      if (!fishing && !hookThrowing && !gameOver) {
        startHookCast();
      }
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }
    }
    actionBtn.addEventListener('touchstart', function(e) {
      if (reelGame.active) setReelHolding(true);
      triggerFishingAction(e);
    }, { passive: false });
    actionBtn.addEventListener('touchend', function() { setReelHolding(false); });
    actionBtn.addEventListener('touchcancel', function() { setReelHolding(false); });
    actionBtn.addEventListener('mousedown', function() {
      if (reelGame.active) setReelHolding(true);
    });
    actionBtn.addEventListener('mouseup', function() { setReelHolding(false); });
    actionBtn.addEventListener('mouseleave', function() { setReelHolding(false); });
    actionBtn.addEventListener('click', triggerFishingAction);
  }

  function triggerFishingFromCanvas(e) {
    if (reelGame.active) {
      reelTap();
      if (e) e.preventDefault();
      return;
    }
    if (!fishing && !hookThrowing && !gameOver) {
      startHookCast();
    }
    if (e) e.preventDefault();
  }
  displayCanvas.addEventListener('click', triggerFishingFromCanvas);
  displayCanvas.addEventListener('touchstart', triggerFishingFromCanvas);
})();

// ============================================================
// 【調參面板】把 LINE_PARAMS_META 動態轉成可拖拉的滑桿 + 數字輸入框，
// 並提供「複製目前參數」「套用貼上的參數」「還原預設值」三個功能，
// 讓玩家可以把調好的參數複製起來，重開網頁後貼回去就能快速套用。
// ============================================================
(function() {
  function buildParamPanel() {
    const container = document.getElementById('paramSliders');
    if (!container) return;
    container.innerHTML = '';

    // 先把 meta 依 key 建立索引，方便依分類查找
    const metaByKey = {};
    LINE_PARAMS_META.forEach(function(meta) {
      metaByKey[meta[1]] = meta;
    });

    function buildRow(meta) {
      const label = meta[0], key = meta[1], min = meta[2], max = meta[3], step = meta[4];

      const row = document.createElement('div');
      row.className = 'param-row';

      const top = document.createElement('div');
      top.className = 'param-row-top';

      const labelEl = document.createElement('label');
      // 只顯示分類前綴之後的說明文字（避免每一列都重複「線-」「鉤-」字樣）
      const shortLabel = label.replace(/^(線|鉤)-/, '');
      labelEl.textContent = shortLabel;
      labelEl.title = label;
      labelEl.htmlFor = 'param-range-' + key;

      const num = document.createElement('input');
      num.type = 'number';
      num.id = 'param-num-' + key;
      num.min = min;
      num.max = max;
      num.step = step;
      num.value = LINE_PARAMS[key];
      num.className = 'param-num';

      top.appendChild(labelEl);
      top.appendChild(num);

      const range = document.createElement('input');
      range.type = 'range';
      range.id = 'param-range-' + key;
      range.min = min;
      range.max = max;
      range.step = step;
      range.value = LINE_PARAMS[key];

      function updateValue(v) {
        let val = parseFloat(v);
        if (isNaN(val)) return;
        val = Math.max(min, Math.min(max, val));
        LINE_PARAMS[key] = val;
        range.value = val;
        num.value = val;
      }

      range.addEventListener('input', function() { updateValue(range.value); });
      // 拖曳中維持焦點（不影響拖動手感），但一放開就立刻失焦，
      // 讓鍵盤事件（方向鍵、空白鍵等）可以馬上回到遊戲操作，不會被滑桿吃掉
      range.addEventListener('change', function() { range.blur(); });
      range.addEventListener('mouseup', function() { range.blur(); });
      range.addEventListener('touchend', function() { range.blur(); });
      num.addEventListener('change', function() { updateValue(num.value); num.blur(); });

      row.appendChild(top);
      row.appendChild(range);
      return row;
    }

    // 依分類產生可折疊區塊；每個分類都是一個 <details>，標題點一下可展開/收合
    PARAM_CATEGORIES.forEach(function(cat) {
      const details = document.createElement('details');
      details.className = 'param-group';
      details.dataset.kind = cat.kind;
      details.open = true;

      const summary = document.createElement('summary');
      const titleSpan = document.createElement('span');
      titleSpan.textContent = cat.title;
      const countSpan = document.createElement('span');
      countSpan.className = 'param-group-count';
      countSpan.textContent = cat.keys.length + ' 項';
      summary.appendChild(titleSpan);
      summary.appendChild(countSpan);

      const body = document.createElement('div');
      body.className = 'param-group-body';

      cat.keys.forEach(function(key) {
        const meta = metaByKey[key];
        if (!meta) return; // 保護：分類設定裡若打錯 key 就跳過，不讓面板整個壞掉
        body.appendChild(buildRow(meta));
      });

      details.appendChild(summary);
      details.appendChild(body);
      container.appendChild(details);
    });

    // 保護：如果有參數忘了放進 PARAM_CATEGORIES，仍會列在最後的「其他」分類，避免遺漏
    const categorizedKeys = new Set(PARAM_CATEGORIES.reduce(function(acc, c) { return acc.concat(c.keys); }, []));
    const leftover = LINE_PARAMS_META.filter(function(meta) { return !categorizedKeys.has(meta[1]); });
    if (leftover.length) {
      const details = document.createElement('details');
      details.className = 'param-group';
      details.dataset.kind = 'other';
      details.open = true;
      const summary = document.createElement('summary');
      const titleSpan = document.createElement('span');
      titleSpan.textContent = '⚙️ 其他';
      const countSpan = document.createElement('span');
      countSpan.className = 'param-group-count';
      countSpan.textContent = leftover.length + ' 項';
      summary.appendChild(titleSpan);
      summary.appendChild(countSpan);
      const body = document.createElement('div');
      body.className = 'param-group-body';
      leftover.forEach(function(meta) { body.appendChild(buildRow(meta)); });
      details.appendChild(summary);
      details.appendChild(body);
      container.appendChild(details);
    }
  }

  function refreshParamPanelValues() {
    LINE_PARAMS_META.forEach(function(meta) {
      const key = meta[1];
      const range = document.getElementById('param-range-' + key);
      const num = document.getElementById('param-num-' + key);
      if (range) range.value = LINE_PARAMS[key];
      if (num) num.value = LINE_PARAMS[key];
    });
  }

  function showStatus(msg, ms) {
    const statusEl = document.getElementById('paramCopyStatus');
    if (!statusEl) return;
    statusEl.textContent = msg;
    setTimeout(function() { statusEl.textContent = ''; }, ms || 2500);
  }

  const paramPanelBtn = document.getElementById('paramPanelBtn');
  const paramPanel = document.getElementById('paramPanel');
  const closeParamPanel = document.getElementById('closeParamPanel');
  const paramTextArea = document.getElementById('paramTextArea');
  const copyParamsBtn = document.getElementById('copyParamsBtn');
  const applyParamsBtn = document.getElementById('applyParamsBtn');
  const resetParamsBtn = document.getElementById('resetParamsBtn');

  if (paramPanelBtn && paramPanel) {
    paramPanelBtn.addEventListener('click', function() {
      const willShow = paramPanel.style.display === 'none';
      paramPanel.style.display = willShow ? 'flex' : 'none';
      paramPanelOpen = willShow;
      if (willShow) refreshParamPanelValues();
      paramPanelBtn.blur();
    });
  }
  if (closeParamPanel && paramPanel) {
    closeParamPanel.addEventListener('click', function() {
      paramPanel.style.display = 'none';
      paramPanelOpen = false;
      closeParamPanel.blur();
    });
  }
  if (copyParamsBtn && paramTextArea) {
    copyParamsBtn.addEventListener('click', function() {
      const json = JSON.stringify(LINE_PARAMS, null, 2);
      paramTextArea.value = json;
      let copied = false;
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(json);
          copied = true;
        }
      } catch (e) { /* 忽略，走下方 fallback */ }
      if (!copied) {
        try {
          paramTextArea.select();
          document.execCommand('copy');
          copied = true;
        } catch (e) { /* 忽略 */ }
      }
      showStatus(copied ? '已複製到剪貼簿！可以貼到別的地方保存。' : '已顯示在下方文字框，請手動全選複製。');
      copyParamsBtn.blur();
      paramTextArea.blur();
    });
  }
  if (applyParamsBtn && paramTextArea) {
    applyParamsBtn.addEventListener('click', function() {
      try {
        const parsed = JSON.parse(paramTextArea.value);
        Object.keys(parsed).forEach(function(key) {
          if (Object.prototype.hasOwnProperty.call(LINE_PARAMS, key) && typeof parsed[key] === 'number') {
            LINE_PARAMS[key] = parsed[key];
          }
        });
        refreshParamPanelValues();
        showStatus('參數已套用！');
      } catch (e) {
        showStatus('格式錯誤，請確認貼上的是完整的參數 JSON。', 3000);
      }
      applyParamsBtn.blur();
      paramTextArea.blur();
    });
  }
  if (resetParamsBtn) {
    resetParamsBtn.addEventListener('click', function() {
      Object.assign(LINE_PARAMS, JSON.parse(JSON.stringify(LINE_PARAMS_DEFAULTS)));
      refreshParamPanelValues();
      showStatus('已還原成預設值。');
      resetParamsBtn.blur();
    });
  }

  buildParamPanel();
})();

function setAllAudioMuted(muted) {
  isMuted = !!muted;
  const list = [tensionSound, rodPullSound, catchSound, catchSound2, penaltySound, bowlSinkSound];
  for (let i = 0; i < list.length; i++) {
    if (list[i]) list[i].muted = isMuted;
  }
  if (Array.isArray(foodSounds)) {
    foodSounds.forEach(function(s) { if (s) s.muted = isMuted; });
  }
}

window.toggleMute = function() {
  setAllAudioMuted(!isMuted);
  sfx('ui_click');
  // 若剛解除靜音，ui_click 會因 isMuted 翻轉後才播；再補一次狀態
  if (!isMuted) resumeAudioCtx();
  const btn = document.getElementById('muteBtn');
  const emojiOn = document.getElementById('muteEmojiOn');
  const emojiOff = document.getElementById('muteEmojiOff');
  if (btn) btn.setAttribute('aria-pressed', isMuted ? 'true' : 'false');
  if (emojiOn) emojiOn.style.display = isMuted ? 'none' : 'inline';
  if (emojiOff) emojiOff.style.display = isMuted ? 'inline' : 'none';
};

document.addEventListener('DOMContentLoaded', function() {
  const btn = document.getElementById('muteBtn');
  if (btn) btn.addEventListener('click', window.toggleMute);
  setAllAudioMuted(isMuted);
  const emojiOn = document.getElementById('muteEmojiOn');
  const emojiOff = document.getElementById('muteEmojiOff');
  if (btn) btn.setAttribute('aria-pressed', isMuted ? 'true' : 'false');
  if (emojiOn) emojiOn.style.display = isMuted ? 'none' : 'inline';
  if (emojiOff) emojiOff.style.display = isMuted ? 'inline' : 'none';
});

  if (restartBtn) restartBtn.addEventListener('click', function() { sfx('ui_click'); });
})();
