// 檢查魚線碰撞的函數
function checkLineCollision() {
  // 每次檢查前先重設碰撞標記
  lineCollisions = Array(LINE_POINTS - 1).fill(false);
  // 檢查魚碰撞
  for (let fish of fishes) {
    if (fish.lifting || fish.caught) continue;
    // 先判斷鉤子直接碰到（距離放寬）
    const catchKind = (fish.fishTier === 'urchin') ? 'seaurchin'
      : (fish.fishTier === 'watermelon') ? 'watermelon'
      : (fish.fishTier === 'theme_mid' && fish.fishKind) ? fish.fishKind
      : 'yellowFish';
    const fishHalf = getCatchHalfSize(catchKind, LINE_PARAMS.hookCatchPadScaleX, LINE_PARAMS.hookCatchPadScaleY);
    const fishSizeScale = (typeof fish.sizeScale === 'number') ? fish.sizeScale : 1;
    const fishCatchHW = fishHalf.hw * fishSizeScale;
    const fishCatchHH = fishHalf.hh * fishSizeScale;
    if (Math.abs(fish.x - bigFish.x) < fishCatchHW && Math.abs(fish.y - hookY) < fishCatchHH) {
      fish.lifting = true;
      fish.flying = false;
      fish.flyT = 0;
      fish.liftAnimTime = 0; // 新增：重置吊起動畫時間
      fish.flyOffsetX = (Math.random() - 0.5) * 30; // 新增：甩竿落點與貓咪位置的隨機偏移
      // 新增：記錄是被魚鉤本身勾到的（線的最末端），甩竿時才會跟著鉤子超出畫面
      fish.hookLineIndex = LINE_POINTS - 1;
      fish.hookLineT = 0;
      fish.prevLiftY = fish.y; // 重置方向判斷用的前一幀 Y 座標
      // 播放釣到東西音效（隨機）
      playRandomCatchSound();
      continue;
    }
    // 再判斷是否在線上（距離放寬）
    for (let i = 0; i < linePoints.length - 1; i++) {
      let x1 = linePoints[i].x, y1 = linePoints[i].y;
      let x2 = linePoints[i+1].x, y2 = linePoints[i+1].y;
      let dx = x2 - x1, dy = y2 - y1;
      let len2 = dx*dx + dy*dy;
      let t = ((fish.x - x1) * dx + (fish.y - y1) * dy) / len2;
      t = Math.max(0, Math.min(1, t));
      let px = x1 + t * dx, py = y1 + t * dy;
      let dist = Math.hypot(fish.x - px, fish.y - py);
      if (dist < LINE_PARAMS.lineCollisionDist) { // 統一判斷距離
        fish.lifting = true;
        fish.flying = false;
        fish.flyT = 0;
        fish.liftAnimTime = 0; // 新增：重置吊起動畫時間
        fish.flyOffsetX = (Math.random() - 0.5) * 30; // 新增：甩竿落點與貓咪位置的隨機偏移
        // 新增：記錄是被釣線的哪一段勾到，甩竿時跟著該段釣線移動，不會超出畫面
        fish.hookLineIndex = i;
        fish.hookLineT = t;
        fish.prevLiftY = fish.y; // 重置方向判斷用的前一幀 Y 座標
        lineCollisions[i] = true;
        // 播放釣到東西音效（隨機）
        playRandomCatchSound();
        break;
      }
    }
  }
  
  // 檢查垃圾碰撞
  for (let trash of trashes) {
    if (trash.lifting || trash.hit) continue;
    const trashHalf = getCatchHalfSize(trash.type, LINE_PARAMS.hookCatchPadScaleX, LINE_PARAMS.hookCatchPadScaleY);
    if (Math.abs(trash.x - bigFish.x) < trashHalf.hw && Math.abs(trash.y - hookY) < trashHalf.hh) {
      trash.lifting = true;
      trash.flying = false;
      trash.flyT = 0;
      trash.flyOffsetX = (Math.random() - 0.5) * 30; // 新增：甩竿落點與貓咪位置的隨機偏移
      // 新增：記錄是被魚鉤本身勾到的（線的最末端），甩竿時才會跟著鉤子超出畫面
      trash.hookLineIndex = LINE_POINTS - 1;
      trash.hookLineT = 0;
      trash.prevLiftY = trash.y; // 新增：重置方向判斷用的前一幀 Y 座標
      // 播放釣到東西音效（隨機）
      playRandomCatchSound();
      continue;
    }
    // 線段碰撞（距離放寬）
    for (let i = 0; i < linePoints.length - 1; i++) {
      let x1 = linePoints[i].x, y1 = linePoints[i].y;
      let x2 = linePoints[i+1].x, y2 = linePoints[i+1].y;
      let dx = x2 - x1, dy = y2 - y1;
      let len2 = dx*dx + dy*dy;
      let t = ((trash.x - x1) * dx + (trash.y - y1) * dy) / len2;
      t = Math.max(0, Math.min(1, t));
      let px = x1 + t * dx, py = y1 + t * dy;
      let dist = Math.hypot(trash.x - px, trash.y - py);
      if (dist < LINE_PARAMS.lineCollisionDist) { // 統一判斷距離
        trash.lifting = true;
        trash.flying = false;
        trash.flyT = 0;
        trash.flyOffsetX = (Math.random() - 0.5) * 30; // 新增：甩竿落點與貓咪位置的隨機偏移
        // 新增：記錄是被釣線的哪一段勾到，甩竿時跟著該段釣線移動，不會超出畫面
        trash.hookLineIndex = i;
        trash.hookLineT = t;
        trash.prevLiftY = trash.y; // 新增：重置方向判斷用的前一幀 Y 座標
        // 播放釣到東西音效（隨機）
        playRandomCatchSound();
        lineCollisions[i] = true;
        break;
      }
    }
  }
  // 檢查特別魚碰撞（最多 2 隻）— 依種類反應不同
  for (let si = 0; si < specialSeaCreatures.length; si++) {
    const sc = specialSeaCreatures[si];
    if (!sc || sc.lifting || sc.caught || sc.falling) continue;
    if (sc.reactCooldown > 0) continue;
    const rx = getSpecialHookReaction(sc.type);
    const scale = rx.catchScale || 1;
    const specialHalf = getCatchHalfSize(sc.type, LINE_PARAMS.hookCatchPadScaleXSpecial, LINE_PARAMS.hookCatchPadScaleYSpecial);
    const hw = specialHalf.hw * scale;
    const hh = specialHalf.hh * scale;
    if (Math.abs(sc.x - bigFish.x) < hw && Math.abs(sc.y - hookY) < hh) {
      tryHookSpecial(sc, LINE_POINTS - 1, 0);
      continue;
    }
    for (let i = 0; i < linePoints.length - 1; i++) {
      let x1 = linePoints[i].x, y1 = linePoints[i].y;
      let x2 = linePoints[i+1].x, y2 = linePoints[i+1].y;
      let dx = x2 - x1, dy = y2 - y1;
      let len2 = dx*dx + dy*dy;
      if (len2 < 0.0001) continue;
      let t = ((sc.x - x1) * dx + (sc.y - y1) * dy) / len2;
      t = Math.max(0, Math.min(1, t));
      let px = x1 + t * dx, py = y1 + t * dy;
      let dist = Math.hypot(sc.x - px, sc.y - py);
      // resist／dodge：線碰撞也略收緊
      const lineDist = LINE_PARAMS.lineCollisionDist * (scale < 1 ? scale : 1);
      if (dist < lineDist) {
        if (tryHookSpecial(sc, i, t)) lineCollisions[i] = true;
        break;
      }
    }
  }
}

// 新增：統一的「拉竿甩竿」觸發函數，滑鼠、空白鍵、上下鍵、觸控按鈕都呼叫這一個函數，
// 避免同一段邏輯散落在好幾個地方、之後修改時漏改。
// 呼叫的前提（!fishing && !hookThrowing）交給呼叫端各自的事件判斷式檢查，
// 這裡只負責「真的要甩竿了」之後，設定好初始物理狀態。
function startHookCast() {
  if (!gameStarted || gameOver) return;
  checkLineCollision(); // 檢查碰撞
  fishing = true;
  hookThrowing = true;
  hookAutoSinking = false; // 玩家又拉竿了，取消上一輪的自動下沉狀態
  hookThrowPhase = 'loop'; // 先進入「迴圈甩竿」階段，之後甩完會自動切到 'fall' 自由落下階段
  hookThrowT = 0;
  hookThrowStartY = hookY;
  hookThrowEndY = LINE_PARAMS.hookThrowSkyY; // 天空高度
  // 起始 X 座標要用鉤子「目前實際的繪製位置」hookDrawX，而不是角色的 bigFish.x。
  // 因為未拉竿時鉤子是靠彈簧物理跟著釣線被拖著走的（見下方 else 分支），
  // hookDrawX 很可能跟角色位置有一段水平落差，這段落差就是「精靈與魚鉤之間目前的傾斜角度」。
  // 如果這裡誤用 bigFish.x（等同於直接假設鉤子永遠在角色正下方），
  // 甩竿時算出來的 throwTiltAngle 就會被歸零、只剩下面 hookLandingBehindOffset 那一點點固定偏移，
  // 導致不管拉竿前鉤子偏得多斜，甩出去永遠都幾乎是垂直向上。
  hookThrowStartX = hookDrawX;
  hookThrowPlayerDir = playerDir; // 凍結拉竿當下的角色面向，之後整個迴圈甩竿過程都用這個值，不再讀取即時 playerDir
  hookThrowEndX = bigFish.x - LINE_PARAMS.hookLandingBehindOffset * hookThrowPlayerDir; // 甩竿當下先算一次初始落點；之後在 loop / fall 階段每一幀都會依照角色目前位置重新計算（見 gameLoop）

  // 凍結「精靈（釣線起點）與魚鉤目前實際位置」之間的傾斜角度，整個迴圈橢圓（含衝破水面那一瞬間）
  // 都要直接沿用這個角度，而不是用起點到終點（終點是天空高度 hookThrowSkyY，垂直距離非常大）
  // 重新算一次角度——那樣算出來的角度會被巨大的垂直距離稀釋成幾乎是 0，導致迴圈看起來還是快垂直。
  // 算法：取「魚鉤 -> 釣線起點」這條向量（也就是魚鉤往上衝向角色嘴巴的方向），
  // 用跟原本 throwTiltAngle 一樣的 atan2(dx, -dy) 慣例換算成「離正上方多少角度」。
  const preCastAnchor = getLineStartPoint();
  const preCastDX = preCastAnchor.x - hookThrowStartX;
  const preCastDY = preCastAnchor.y - hookThrowStartY; // 錨點在魚鉤上方，這裡通常是負值
  hookThrowTiltAngle = Math.atan2(preCastDX, -preCastDY);
  // 拉竿的初始動力：給鉤子一股迴圈角速度衝力，讓它「往前往上衝」，
  // 之後這股衝力會在 gameLoop 裡隨時間自然衰減（模擬重力/甩竿阻力），
  // 使鉤子衝到接近頂端時明顯變慢，呈現「衝到頂端再後甩」的物理手感。
  hookThrowAngVel = LINE_PARAMS.hookCastImpulse;
  hookThrowLoopElapsedMs = 0; // 重置強制完成保險機制的計時
  hookFallVelX = 0;
  hookFallVelY = 0;
  // 播放拉竿音效
  sfx('cast');
}

// 抽出單一魚生成函數
// 統一的「畫面外生成／消失」緩衝距離：
// 目前最寬的圖片是魷魚（132px，半寬 66px），這裡抓一個足夠大的邊界，
// 確保任何魚、垃圾、特殊海洋生物都是「整隻完全在畫面外」才會被生成或判定消失，
// 這樣視覺上就一定是「從左邊或右邊游進來 / 游出去」，不會有一出生就已經半個身體在畫面內的「憑空出現」感。
const SPAWN_MARGIN = 90;
function createFish() {
  // 普通魚群機率（再依日／夜過濾）
  // 海膽 5%（晚）／西瓜 10%／屎屎 5%（晚）／鳥仔 5%（日）／其餘魚 A/B/C
  const pool = [];
  function addOpt(kind, w, apply) {
    if (!canAppearNow(kind)) return;
    pool.push({ w: w, apply: apply });
  }
  addOpt('urchin', 5, function() {
    return { color: 'urchin', rewardScore: URCHIN_SCORE, rewardEnergy: URCHIN_ENERGY, fishTier: 'urchin', fishKind: 'urchin' };
  });
  addOpt('watermelon', 10, function() {
    return { color: 'watermelon', rewardScore: WATERMELON_FISH_SCORE, rewardEnergy: WATERMELON_FISH_ENERGY, fishTier: 'watermelon', fishKind: 'watermelon' };
  });
  addOpt('fish_shi', 5, function() {
    return { color: 'theme', rewardScore: SHI_FISH_SCORE, rewardEnergy: SHI_FISH_ENERGY, fishTier: 'theme_mid', fishKind: 'fish_shi' };
  });
  addOpt('fish_bird', 5, function() {
    return { color: 'theme', rewardScore: BIRD_FISH_SCORE, rewardEnergy: BIRD_FISH_ENERGY, fishTier: 'theme_mid', fishKind: 'fish_bird' };
  });
  // 剩餘權重給普通魚 A/B/C
  let used = 0;
  for (let i = 0; i < pool.length; i++) used += pool[i].w;
  const midW = Math.max(1, 100 - used);
  pool.push({
    w: midW,
    apply: function() {
      return { color: 'gold', rewardScore: MID_FISH_SCORE, rewardEnergy: MID_FISH_ENERGY, fishTier: 'mid', fishKind: 'mid' };
    }
  });
  let total = 0;
  for (let i = 0; i < pool.length; i++) total += pool[i].w;
  let roll = Math.random() * total;
  let picked = pool[pool.length - 1].apply();
  for (let i = 0; i < pool.length; i++) {
    roll -= pool[i].w;
    if (roll <= 0) { picked = pool[i].apply(); break; }
  }
  let color = picked.color;
  let rewardScore = picked.rewardScore;
  let rewardEnergy = picked.rewardEnergy;
  let fishTier = picked.fishTier;
  let fishKind = picked.fishKind;
  const fishVariant = (fishTier === 'mid') ? Math.floor(Math.random() * 3) : 0;
  let sizeScale = 1;
  let animSpeed = 4;
  if (fishTier === 'mid') {
    animSpeed = 3.8 + fishVariant * 0.3;
  } else if (fishTier === 'theme_mid') {
    animSpeed = 3.2;
  } else {
    animSpeed = 2.5;
  }
  const face = Math.random() < 0.5 ? 'smile' : 'dot';
  const fromLeft = Math.random() < 0.5;
  const x = fromLeft ? -SPAWN_MARGIN : canvas.width + SPAWN_MARGIN;
  const dir = fromLeft ? 1 : -1;
  let speed = 1.4 + Math.random() * 0.91;
  if (fishTier === 'urchin') speed = 0.9 + Math.random() * 0.6;
  if (fishTier === 'watermelon') speed = 1.0 + Math.random() * 0.7;
  if (fishTier === 'theme_mid') speed = 1.2 + Math.random() * 0.7;
  if (fishTier === 'mid') speed *= (0.92 + fishVariant * 0.06);
  const baseY = Math.random() * Math.max(0, getFishBottomY() - getFishTopY()) + getFishTopY();
  return {
    x,
    y: baseY,
    baseY,
    bobPhase: Math.random() * Math.PI * 2,
    bobSpeed: 0.5 + Math.random() * 0.9,
    bobAmplitude: 12 + Math.random() * 20,
    bobTime: 0,
    speed,
    dir,
    caught: false,
    lifting: false,
    flying: false,
    color,
    fishTier,
    fishKind,
    fishVariant,
    rewardScore,
    rewardEnergy,
    face,
    fadeOut: false,
    alpha: 1,
    fadeElapsed: 0,
    animTime: 0,
    animSpeed,
    liftAnimTime: 0,
    sizeScale
  };
}
// 修改 spawnFish 使用 createFish
function spawnFish() {
  fishes = [];
  for (let i = 0; i < FISH_COUNT; i++) {
    fishes.push(createFish());
  }
}

// --- 小黃魚群（週期性大量小魚）---
// 優化重點：同批共享游向／速度帶／波段，進場錯開 X，Y 集中在窄帶，看起來像「成群游過」而不是各自亂竄
const FISH_SCHOOL_INTERVAL = 35000;       // 每隔幾毫秒觸發一次小黃魚群（35 秒）
const FISH_SCHOOL_BATCH_SIZE = 24;        // 每一批隻數（略降以減輕繪製壓力）
const FISH_SCHOOL_BATCH_INTERVAL = 550;   // 每批間隔
const FISH_SCHOOL_BATCH_COUNT = 8;        // 一輪批次數（約 192 隻／輪，比原本 300 更穩）
const FISH_SCHOOL_SIZE_SCALE = 0.5;       // 體型＝正常魚約一半
const FISH_SCHOOL_BAND_H = 110;           // 同一批魚的垂直活動帶高度（越小越緊密）
const FISH_SCHOOL_X_SPREAD = 140;         // 同批進場時沿游向錯開的最大距離
const FISH_SCHOOL_MAX_ALIVE = 160;        // 畫面中魚群成員上限，避免堆積過卡
let fishSchoolTimer = null;
let fishSchoolBatchTimer = null;
// 每一批共用的「群組參數」，讓同批看起來像同一群
let schoolBatchId = 0;

function createSchoolFish(fromLeft, batchMeta, indexInBatch, batchSize) {
  const dir = fromLeft ? 1 : -1;
  // 沿游向錯開：不要同一幀疊成一堵牆，而是斜向魚流
  const laneT = batchSize > 1 ? (indexInBatch / (batchSize - 1)) : 0.5;
  const xOffset = laneT * FISH_SCHOOL_X_SPREAD;
  const x = fromLeft
    ? (-SPAWN_MARGIN - xOffset)
    : (canvas.width + SPAWN_MARGIN + xOffset);

  // 速度：以批次基準速為中心，只做很小抖動 → 前後不會散開太快
  const speedJitter = 0.92 + Math.random() * 0.16;
  const speed = batchMeta.baseSpeed * speedJitter;

  // Y：集中在本批「魚群帶」內，再微幅分層（上中下三層），形成立體魚流
  const layer = indexInBatch % 3; // 0/1/2
  const layerOffset = (layer - 1) * (FISH_SCHOOL_BAND_H * 0.28);
  const baseY = batchMeta.bandCenterY + layerOffset
    + (Math.random() - 0.5) * (FISH_SCHOOL_BAND_H * 0.35);

  const fishVariant = Math.floor(Math.random() * 3);
  const sizeScale = FISH_SCHOOL_SIZE_SCALE * (0.9 + fishVariant * 0.05);

  // 波段：共享主相位 + 極小個體差，上下浮動幾乎同步（成群感）
  const bobPhase = batchMeta.bobPhase + (Math.random() - 0.5) * 0.35 + layer * 0.2;
  const bobSpeed = batchMeta.bobSpeed * (0.95 + Math.random() * 0.1);
  const bobAmplitude = batchMeta.bobAmplitude * (0.85 + Math.random() * 0.3);

  // 游動幀：同批共享 animTime 基準，再錯開一點，避免齊刷刷換幀
  const animTime = batchMeta.animSeed + laneT * 0.4 + Math.random() * 0.15;

  return {
    x,
    y: baseY,
    baseY,
    bobPhase,
    bobSpeed,
    bobAmplitude,
    bobTime: 0,
    speed,
    dir,
    caught: false,
    lifting: false,
    flying: false,
    color: "gold",
    fishTier: "school",
    fishVariant,
    rewardScore: SMALL_FISH_SCORE,
    rewardEnergy: SMALL_FISH_ENERGY,
    face: Math.random() < 0.5 ? 'smile' : 'dot',
    fadeOut: false,
    alpha: 1,
    fadeElapsed: 0,
    animTime,
    // 魚群用較慢換幀，減少「每隻各自狂閃」的雜訊感，也略省繪圖負擔
    animSpeed: 2.4 + fishVariant * 0.25,
    liftAnimTime: 0,
    sizeScale,
    schoolBatchId: batchMeta.id,
    // 魚群專用：水平微幅正弦（與 bob 不同相位），讓路徑有輕微蛇行
    schoolWobblePhase: batchMeta.bobPhase + Math.PI * 0.5 + laneT,
    schoolWobbleAmp: 6 + Math.random() * 8
  };
}

// 產生一批：整批同一方向，形成一道魚流（不是左右對衝）
function spawnFishSchoolBatch() {
  if (gameOver) return;
  // 超過上限時先清掉已游出／最舊的魚群成員，避免陣列無限膨脹
  let schoolCount = 0;
  for (let i = 0; i < fishes.length; i++) {
    if (fishes[i].fishTier === 'school' && !fishes[i].lifting && !fishes[i].caught) schoolCount++;
  }
  if (schoolCount >= FISH_SCHOOL_MAX_ALIVE) {
    // 丟掉最前面若干隻未在吊起中的 school 魚
    let needDrop = schoolCount - FISH_SCHOOL_MAX_ALIVE + FISH_SCHOOL_BATCH_SIZE;
    for (let i = 0; i < fishes.length && needDrop > 0; i++) {
      const f = fishes[i];
      if (f.fishTier === 'school' && !f.lifting && !f.caught && !f.fadeOut) {
        f.removeMe = true;
        needDrop--;
      }
    }
    fishes = fishes.filter(f => !f.removeMe);
  }

  schoolBatchId++;
  const fromLeft = Math.random() < 0.5;
  const top = getFishTopY();
  const bottom = getFishBottomY();
  const usable = Math.max(40, bottom - top - FISH_SCHOOL_BAND_H);
  const bandCenterY = top + FISH_SCHOOL_BAND_H * 0.5 + Math.random() * usable;

  const batchMeta = {
    id: schoolBatchId,
    baseSpeed: (1.4 + Math.random() * 0.7) * 2.1, // 略快於一般魚，整批一致
    bandCenterY,
    bobPhase: Math.random() * Math.PI * 2,
    bobSpeed: 1.1 + Math.random() * 0.5,
    bobAmplitude: 10 + Math.random() * 8,
    animSeed: Math.random() * 3
  };

  for (let i = 0; i < FISH_SCHOOL_BATCH_SIZE; i++) {
    fishes.push(createSchoolFish(fromLeft, batchMeta, i, FISH_SCHOOL_BATCH_SIZE));
  }
}

// 連續生成 FISH_SCHOOL_BATCH_COUNT 批小黃魚，每批間隔 FISH_SCHOOL_BATCH_INTERVAL 毫秒
// （每 0.5 秒生成 30 隻，共生成 10 次、總共 300 隻），
// 全部批次生成完之後，才重新開始下一輪 35 秒倒數（scheduleFishSchool）。
function runFishSchoolBatches() {
  let batchesSpawned = 0;
  if (fishSchoolBatchTimer) clearInterval(fishSchoolBatchTimer);
  fishSchoolBatchTimer = setInterval(() => {
    if (!gameOver && !bowlSinking && !paramPanelOpen) {
      spawnFishSchoolBatch();
    }
    batchesSpawned++;
    if (batchesSpawned >= FISH_SCHOOL_BATCH_COUNT) {
      clearInterval(fishSchoolBatchTimer);
      fishSchoolBatchTimer = null;
      scheduleFishSchool(); // 這一輪批次全部跑完，重新開始下一次 35 秒倒數
    }
  }, FISH_SCHOOL_BATCH_INTERVAL);
}

// 排程：每隔 FISH_SCHOOL_INTERVAL（35 秒）觸發一次小黃魚群事件；
// 觸發後不是一次生成完，而是交給 runFishSchoolBatches 每 0.5 秒生成一批（共 10 批），
// 全部批次跑完後才會再重新呼叫這個函式、重新開始下一次 35 秒倒數。
// （遊戲結束/碗下沉/面板開啟時暫停生成，但排程本身照常繼續倒數）
function scheduleFishSchool() {
  if (fishSchoolTimer) clearTimeout(fishSchoolTimer);
  // 遊戲結束後停止魚群排程
  if (gameOver) return;
  fishSchoolTimer = setTimeout(() => {
    if (gameOver) return;
    runFishSchoolBatches();
  }, FISH_SCHOOL_INTERVAL);
}
function stopFishSpawnsOnGameOver() {
  if (fishSchoolTimer) { clearTimeout(fishSchoolTimer); fishSchoolTimer = null; }
  if (fishSchoolBatchTimer) { clearInterval(fishSchoolBatchTimer); fishSchoolBatchTimer = null; }
  // 特別魚／垃圾排程：靠 gameOver 旗標在 update 內停止；這裡清 pending
  if (typeof specialPendingQueue !== 'undefined' && Array.isArray(specialPendingQueue)) {
    specialPendingQueue.length = 0;
  }
}

let gameOverAnimTimer = null;
/** 先播 Game Over 過場，再出結束 popup（不改 popup 佈局） */
function playGameOverSequence() {
  const anim = document.getElementById('gameOverAnim');
  if (gameOverAnimTimer) {
    clearTimeout(gameOverAnimTimer);
    gameOverAnimTimer = null;
  }
  if (anim) {
    anim.classList.remove('is-out');
    anim.classList.add('is-show');
    anim.setAttribute('aria-hidden', 'false');
    // 重播文字動畫
    const txt = anim.querySelector('.go-text');
    const ring = anim.querySelector('.go-ring');
    if (txt) { txt.style.animation = 'none'; void txt.offsetWidth; txt.style.animation = ''; }
    if (ring) { ring.style.animation = 'none'; void ring.offsetWidth; ring.style.animation = ''; }
  }
  if (typeof sfx === 'function') sfx('game_over');
  if (anim) anim.dataset.sfxDone = '1';
  // 停留後淡出，再出 popup
  gameOverAnimTimer = setTimeout(function() {
    if (anim) {
      anim.classList.add('is-out');
    }
    gameOverAnimTimer = setTimeout(function() {
      gameOverAnimTimer = null;
      if (anim) {
        anim.classList.remove('is-show', 'is-out');
        anim.setAttribute('aria-hidden', 'true');
      }
      showGameOverModal();
    }, 380);
  }, 1500);
}

// 從一組動畫裡挑出「已成功載入」的圖；缺幀時往回退到同組可用幀或通用黃魚
function pickAnimFrame(set, frameIndex, fallbackSet) {
  const tryList = [];
  if (set && set[frameIndex]) tryList.push(set[frameIndex]);
  if (set) {
    for (let i = 0; i < set.length; i++) tryList.push(set[i]);
  }
  if (fallbackSet) {
    if (fallbackSet[frameIndex]) tryList.push(fallbackSet[frameIndex]);
    for (let i = 0; i < fallbackSet.length; i++) tryList.push(fallbackSet[i]);
  }
  for (let i = 0; i < tryList.length; i++) {
    const img = tryList[i];
    if (img && img.complete && img.naturalWidth > 0) return img;
  }
  return null;
}

// 依「圖片是否已經成功載入」取得目前應該使用的寬高：
// 圖片載入成功 -> 用圖片本身的 naturalWidth/naturalHeight（最準確）
// 圖片還沒載好或載入失敗 -> 用上面 REAL_IMG_SIZE 記錄的實際圖片尺寸當備援，
// 這樣即使圖片一時沒顯示出來，判定範圍跟佔位圖形也不會跟正式圖片對不上。
function getImgDrawSize(img, fallbackKey) {
  if (img && img.complete && img.naturalWidth > 0) {
    return { w: img.naturalWidth, h: img.naturalHeight };
  }
  const fb = REAL_IMG_SIZE[fallbackKey];
  return fb ? { w: fb.w, h: fb.h } : { w: 32, h: 32 };
}

// 取得某個垃圾／特殊海洋生物／魚「被鉤子直接勾到」判定範圍的半寬、半高，
// 基準為該類型實際圖片的大小，再乘上寬鬆倍率（padScaleX/padScaleY，來自 LINE_PARAMS，可在調參面板調整）
function getCatchHalfSize(kind, padScaleX, padScaleY) {
  padScaleX = (typeof padScaleX === 'number') ? padScaleX : 1.1;
  padScaleY = (typeof padScaleY === 'number') ? padScaleY : 1.1;
  let size;
  switch (kind) {
    case 'can': size = getImgDrawSize(canImg, 'can'); break;
    case 'bottle': size = getImgDrawSize(bootImg, 'boot'); break;
    case 'seaurchin': size = getImgDrawSize(seaUrchinImg, 'seaurchin'); break;
    case 'watermelon': size = getImgDrawSize(watermelonImg, 'watermelon'); break;
    case 'squid': size = getImgDrawSize(squidImg, 'squid'); break;
    case 'octopus': size = getImgDrawSize(octopusImg, 'octopus'); break;
    case 'turtle': size = getImgDrawSize(turtleImg, 'turtle'); break;
    case 'jellyfish': size = getImgDrawSize(jellyfishImg, 'jellyfish'); break;
    case 'star': size = getImgDrawSize(starImg, 'star'); break;
    case 'seacucumber': size = getImgDrawSize(seaCucumberImg, 'seacucumber'); break;
    case 'yellowFish': size = getImgDrawSize(yellowFishImg, 'yellowFish'); break;
    case 'purpleFish': size = getImgDrawSize(purpleFishImg, 'purpleFish'); break;
    case 'watermelon': size = getImgDrawSize(fishWatermelonImg.complete && fishWatermelonImg.naturalWidth ? fishWatermelonImg : watermelonImg, 'watermelon'); break;
    case 'molamola': size = getImgDrawSize(molamolaImg, 'molamola'); break;
    case 'fish_durian': size = getImgDrawSize(fishDurianImg, 'fish_durian'); break;
    case 'fish_monster': size = getImgDrawSize(fishMonsterImg, 'fish_monster'); break;
    case 'fish_shi':
    case 'fish_bird':
    case 'fish_dumpling':
    case 'fish_cloud':
    case 'fish_heart':
    case 'fish_dog':
    case 'fish_bear':
      size = getImgDrawSize(specialImgMap[kind], kind);
      break;
    default: size = { w: 44, h: 32 };
  }
  return { hw: (size.w / 2) * padScaleX, hh: (size.h / 2) * padScaleY };
}

// 除錯用：把各個物件目前的「碰撞判定框」畫成虛線框，方便對照調參面板裡的數值來調整。
// 只有在調參面板開啟時才會顯示，平常玩遊戲不會看到這些框，不影響正常畫面。
function drawDebugHitboxes() {
  if (!paramPanelOpen) return;
  ctx.save();
  ctx.setLineDash([6, 4]);
  ctx.lineWidth = 2;
  ctx.font = '11px Arial';
  ctx.textBaseline = 'bottom';

  function strokeBox(cx, cy, hw, hh, color, label) {
    ctx.strokeStyle = color;
    ctx.strokeRect(cx - hw, cy - hh, hw * 2, hh * 2);
    if (label) {
      ctx.fillStyle = color;
      ctx.fillText(label, cx - hw, cy - hh - 2);
    }
  }

  // 碗：實際判定「東西掉進碗裡」用的矩形範圍
  strokeBox(bowlX + pot.w / 2, bowlY + pot.h / 2, pot.w / 2, pot.h / 2, 'rgba(255,40,40,0.9)', '碗');

  // 魚：被鉤子直接勾到的判定範圍（框跟著魚移動，鉤子進到框裡就算勾到）
  for (let fish of fishes) {
    if (fish.caught || fish.lifting) continue;
    const catchKind = (fish.fishTier === 'urchin') ? 'seaurchin'
      : (fish.fishTier === 'watermelon') ? 'watermelon'
      : (fish.fishTier === 'theme_mid' && fish.fishKind) ? fish.fishKind
      : 'yellowFish';
    const half = getCatchHalfSize(catchKind, LINE_PARAMS.hookCatchPadScaleX, LINE_PARAMS.hookCatchPadScaleY);
    const scale = (typeof fish.sizeScale === 'number') ? fish.sizeScale : 1;
    strokeBox(fish.x, fish.y, half.hw * scale, half.hh * scale, 'rgba(0,200,255,0.9)', '魚');
  }

  // 垃圾：被鉤子直接勾到的判定範圍
  for (let trash of trashes) {
    if (trash.hit || trash.lifting) continue;
    const half = getCatchHalfSize(trash.type, LINE_PARAMS.hookCatchPadScaleX, LINE_PARAMS.hookCatchPadScaleY);
    strokeBox(trash.x, trash.y, half.hw, half.hh, 'rgba(255,170,0,0.9)', '垃圾');
  }

  // 特別魚：被鉤子直接勾到的判定範圍
  for (let si = 0; si < specialSeaCreatures.length; si++) {
    const sc = specialSeaCreatures[si];
    if (!sc || sc.caught || sc.lifting) continue;
    const half = getCatchHalfSize(sc.type, LINE_PARAMS.hookCatchPadScaleXSpecial, LINE_PARAMS.hookCatchPadScaleYSpecial);
    strokeBox(sc.x, sc.y, half.hw, half.hh, 'rgba(200,60,220,0.9)', '生物');
  }

  ctx.restore();
}

// 修正「一次釣很多條魚時，明明對到碗裡卻從碗下方掉出去」的問題：
// 當同時有大量魚／物件在被拉起（例如魚群批次一次出現很多條魚），
// 畫面每一幀要處理的東西變多，單幀花費的時間變長、幀與幀之間的時間差
// （deltaTime）容易變大，使得魚在「這一幀」和「下一幀」之間，
// 一口氣從碗的上方跳到碗的下方，中間完全沒有任何一幀的座標真正落在
// 碗的高度範圍內（也就是「穿透」/tunneling）。
// 原本的判斷只檢查「這一幀當下的座標」是否落在碗裡，
// 所以碰到這種情況就會判定成沒接住、魚從碗底掉出去。
// 這裡改成檢查「上一幀到這一幀之間，魚實際掃過的整段路徑」
// 有沒有經過碗的高度範圍，只要有掃到就算數，避免因為單幀跳太快而漏接。
function isEnteringPotFromAbove(x, y, prevY, boxX, boxY, boxW, boxH) {
  // 水平方向：用目前位置是否落在碗的寬度範圍內即可（碗左右移動速度較慢）
  if (x <= boxX || x >= boxX + boxW) return false;
  // 必須是往下移動，避免從碗下方往上經過也被誤判成釣到
  if (!(y > prevY + 0.01)) return false;
  const potTop = boxY;
  const potBottom = boxY + boxH;
  // 掃描上一幀到這一幀之間的整段垂直路徑，只要跟碗的高度範圍有重疊就算「有經過碗裡」
  const segTop = Math.min(prevY, y);
  const segBottom = Math.max(prevY, y);
  return segTop < potBottom && segBottom > potTop;
}

function getSpecialHookReaction(type) {
  return SPECIAL_HOOK_REACTIONS[type] || SPECIAL_HOOK_DEFAULT;
}

/** 嘗試鉤住特別魚：依反應模式可能閃避／累積命中／直接上鉤 */
function tryHookSpecial(sc, hookLineIndex, hookLineT) {
  if (!sc || sc.lifting || sc.caught || sc.falling || sc.reactCooldown > 0) return false;
  const rx = getSpecialHookReaction(sc.type);

  // resist：需累積 hitsNeeded 次有效碰撞
  sc.hookHits = (sc.hookHits || 0) + 1;
  if (sc.hookHits < (rx.hitsNeeded || 1)) {
    // 受驚加速／微閃
    sc.burstBoost = Math.max(sc.burstBoost || 0, 0.7);
    sc.reactCooldown = 0.35;
    sc.drawTilt = (Math.random() - 0.5) * 0.4;
    if (typeof sfx === 'function') sfx('score_small', { throttleMs: 120 });
    return false;
  }

  // dodge／一般：有機率閃避
  if (Math.random() < (rx.dodgeChance || 0)) {
    triggerSpecialDodge(sc);
    return false;
  }

  // 成功上鉤（不使用拉桿小遊戲，直接可拉進鍋）
  sc.lifting = true;
  sc.flying = false;
  sc.flyT = 0;
  sc.flyOffsetX = (Math.random() - 0.5) * 30;
  sc.hookLineIndex = (typeof hookLineIndex === 'number') ? hookLineIndex : (LINE_POINTS - 1);
  sc.hookLineT = (typeof hookLineT === 'number') ? hookLineT : 0;
  sc.prevLiftY = sc.y;
  sc.hookHits = 0;
  sc.struggleMs = rx.struggleMs || 0;
  sc.struggleElapsed = 0;
  sc.slipChance = rx.slipChance || 0;
  sc.reactMode = rx.mode;
  sc.reelDone = true; // 相容舊旗標：視為已可進鍋
  // heavy：略往下沉一點，增加拉竿難度感
  if (rx.mode === 'heavy') {
    sc.heavySink = 0.35 + Math.random() * 0.25;
  } else {
    sc.heavySink = 0;
  }
  playRandomCatchSound();
  return true;
}

function triggerSpecialDodge(sc) {
  if (!sc) return;
  sc.reactCooldown = 0.55 + Math.random() * 0.25;
  sc.hookHits = 0;
  // 掉頭或加速逃離
  if (Math.random() < 0.55) sc.dir *= -1;
  sc.burstBoost = Math.max(sc.burstBoost || 0, 1.2);
  sc.baseY = Math.max(getFishTopY() + 20, Math.min(getFishBottomY() - 20, sc.baseY + (Math.random() - 0.5) * 50));
  sc.drawTilt = sc.dir * 0.35;
  if (typeof sfx === 'function') sfx('splash', { throttleMs: 150 });
}

/** 靠近鉤子時的主動逃跑（flee / 部分種類） */
function updateSpecialFleeFromHook(sc, dtSec) {
  if (!sc || sc.lifting || sc.caught || sc.falling) return;
  const rx = getSpecialHookReaction(sc.type);
  if (!rx.fleeRadius || rx.fleeRadius <= 0) return;
  if (typeof hookDrawX !== 'number' || typeof hookY !== 'number') return;
  const dx = sc.x - hookDrawX;
  const dy = sc.y - hookY;
  const dist = Math.hypot(dx, dy);
  if (dist > rx.fleeRadius || dist < 1) return;
  // 越近越急
  const urgency = 1 - dist / rx.fleeRadius;
  if (rx.mode === 'flee' || rx.mode === 'dodge' || rx.mode === 'resist') {
    // 遠離鉤子的水平方向
    const away = dx === 0 ? (sc.dir) : Math.sign(dx);
    if (away !== 0 && Math.sign(sc.dir) !== away && urgency > 0.35) {
      sc.dir = away;
    }
    sc.burstBoost = Math.max(sc.burstBoost || 0, urgency * 1.1);
    sc.baseY += Math.sign(dy || 1) * urgency * 18 * dtSec;
    sc.baseY = Math.max(getFishTopY() + 10, Math.min(getFishBottomY() - 10, sc.baseY));
  }
}

/**
 * 特別魚脫鉤落地：初始化拋物線／旋轉狀態
 * @param {object} sc
 * @param {{reason?:string, vx?:number, vy?:number}} opts
 */
function beginSpecialFall(sc, opts) {
  if (!sc || sc.falling) return;
  opts = opts || {};
  sc.falling = true;
  sc.lifting = false;
  sc.everAboveWater = false;
  sc.hookLineIndex = null;
  sc.hookLineT = 0;
  sc.hookHits = 0;
  sc.struggleMs = 0;
  sc.struggleElapsed = 0;
  sc.reactCooldown = 0.75 + Math.random() * 0.35;
  sc.burstBoost = Math.max(sc.burstBoost || 0, 0.85);
  sc.fallT = 0;
  sc.fallStartY = sc.y;
  const top = getFishTopY() + 24;
  const bot = getFishBottomY() - 24;
  sc.fallEndY = top + Math.random() * Math.max(20, bot - top);
  // 水平：隨機 + 可帶鉤速殘餘
  sc.fallVx = (typeof opts.vx === 'number') ? opts.vx : (Math.random() - 0.5) * 2.4;
  // 初始下墜速度（空中）
  sc.fallVy = (typeof opts.vy === 'number') ? opts.vy : (1.0 + Math.random() * 1.8);
  // 旋轉：脫鉤方向感
  sc.fallSpin = (0.06 + Math.random() * 0.1) * (sc.fallVx >= 0 ? 1 : -1);
  sc.fallRot = (sc.drawTilt || 0) * (sc.dir || 1);
  sc.fallPhase = 'air';
  sc.fallSplashDone = false;
  if (typeof sfx === 'function') sfx('splash', { throttleMs: 100 });
}

/**
 * 每幀更新脫鉤落地：空中拋物 → 入水水花 → 水中阻尼下沉 → 回游
 */
function updateSpecialFall(sc, dtSec, timeScale) {
  if (!sc || !sc.falling) return;
  const ts = (typeof timeScale === 'number' && timeScale > 0) ? timeScale : 1;
  const dt = Math.max(0.001, dtSec || 0.016) * ts;
  sc.fallT = (sc.fallT || 0) + dt;

  const waterY = (typeof getWaveY === 'function')
    ? getWaveY(sc.x, typeof wavePhase !== 'undefined' ? wavePhase : 0)
    : (LINE_PARAMS.seaSurfaceY || 270);

  // 重力／浮力依相位
  let gravity = 420;   // px/s² 空中
  let dragX = 0.15;
  let dragY = 0.08;
  if (sc.fallPhase === 'sink' || sc.fallPhase === 'settle') {
    gravity = 90;      // 水中下沉慢
    dragX = 1.8;
    dragY = 1.2;
  } else if (sc.y > waterY - 6 && sc.fallPhase === 'air') {
    // 剛穿水面
    sc.fallPhase = 'splash';
  }

  // 積分速度
  sc.fallVy += gravity * dt * 0.016; // 用接近幀比例的縮放，手感偏「遊戲感」
  sc.fallVx *= Math.exp(-dragX * dt);
  sc.fallVy *= Math.exp(-dragY * dt);

  sc.x += sc.fallVx * 60 * dt;
  sc.y += sc.fallVy * 60 * dt;

  // 旋轉：空中快、入水後逐漸停
  const spinFade = (sc.fallPhase === 'air') ? 1 : 0.35;
  sc.fallSpin *= Math.exp(-1.2 * dt);
  sc.fallRot = (sc.fallRot || 0) + sc.fallSpin * 60 * dt * spinFade;
  // 限制翻轉幅度，避免轉太多看不清
  if (sc.fallRot > Math.PI * 0.85) sc.fallRot = Math.PI * 0.85;
  if (sc.fallRot < -Math.PI * 0.85) sc.fallRot = -Math.PI * 0.85;
  sc.drawTilt = sc.fallRot;

  // 入水瞬間：水花 + 減速
  if (sc.fallPhase === 'splash' || (sc.fallPhase === 'air' && sc.y >= waterY)) {
    if (!sc.fallSplashDone) {
      sc.fallSplashDone = true;
      sc.fallPhase = 'sink';
      sc.fallVy *= 0.35;
      sc.fallVx *= 0.55;
      sc.fallSpin *= 0.4;
      if (typeof fxHookSplash === 'function') fxHookSplash(sc.x, waterY);
      if (typeof sfx === 'function') sfx('splash', { throttleMs: 120 });
    } else {
      sc.fallPhase = 'sink';
    }
  }

  // 接近目標深度：軟著陸
  const endY = sc.fallEndY;
  if (sc.y >= endY - 4) {
    sc.fallPhase = 'settle';
    sc.y += (endY - sc.y) * Math.min(1, 8 * dt);
    sc.fallVy *= 0.7;
    sc.fallVx *= 0.75;
    sc.fallRot *= 0.85;
    if (Math.abs(sc.y - endY) < 2.5 && Math.abs(sc.fallVy) < 0.15 && Math.abs(sc.fallVx) < 0.2) {
      sc.y = endY;
      sc.baseY = endY;
      sc.falling = false;
      sc.fallPhase = 'air';
      sc.fallVx = 0;
      sc.fallVy = 0;
      sc.fallRot = 0;
      sc.drawTilt = 0;
      // 落地後短暫加速游走
      sc.burstBoost = Math.max(sc.burstBoost || 0, 0.7);
      if (Math.random() < 0.4) sc.dir *= -1;
    }
  }

  // 邊界夾住
  if (sc.x < -SPAWN_MARGIN) sc.x = -SPAWN_MARGIN;
  if (sc.x > canvas.width + SPAWN_MARGIN) sc.x = canvas.width + SPAWN_MARGIN;
}

function makeSpecialCreature(def) {
  const fromLeft = Math.random() < 0.5;
  const x = fromLeft ? -SPAWN_MARGIN : canvas.width + SPAWN_MARGIN;
  const dir = fromLeft ? 1 : -1;
  const style = SPECIAL_SWIM_STYLES[def.type] || SPECIAL_SWIM_DEFAULT;
  const speed = style.speedMin + Math.random() * (style.speedMax - style.speedMin);
  const baseY = Math.random() * Math.max(0, getFishBottomY() - getFishTopY()) + getFishTopY();
  return {
    type: def.type,
    name: def.name || def.type,
    rewardScore: def.score,
    rewardEnergy: def.energy,
    x,
    y: baseY,
    baseY: baseY,
    speed: speed,
    baseSpeed: speed,
    dir: dir,
    caught: false, lifting: false, flying: false, flyT: 0,
    fadeOut: false, alpha: 1, fadeElapsed: 0,
    animTime: Math.random() * 10,
    animSpeed: style.animSpeed,
    // 游泳參數
    swimPattern: style.pattern,
    bobAmp: style.bobAmp * (0.85 + Math.random() * 0.3),
    bobSpeed: style.bobSpeed * (0.9 + Math.random() * 0.2),
    bobPhase: Math.random() * Math.PI * 2,
    wobbleAmp: style.wobbleAmp,
    wobbleFreq: style.wobbleFreq * (0.9 + Math.random() * 0.2),
    wobblePhase: Math.random() * Math.PI * 2,
    tiltAmp: style.tiltAmp,
    scalePulse: style.scalePulse,
    // burst / dart 用
    burstT: Math.random() * 3,
    burstBoost: 0,
    // 繪製用（每幀更新）
    drawTilt: 0,
    drawScale: 1,
    // 脫鉤落地
    falling: false,
    fallVx: 0,
    fallVy: 0,
    fallRot: 0,
    fallSpin: 0,
    fallEndY: 0,
    fallPhase: 'air', // air | splash | sink | settle
    fallSplashDone: false,
    // 遇鉤反應狀態
    hookHits: 0,
    reactCooldown: 0,
    struggleMs: 0,
    struggleElapsed: 0,
    slipChance: 0,
    reactMode: (SPECIAL_HOOK_REACTIONS[def.type] || SPECIAL_HOOK_DEFAULT).mode,
    heavySink: 0,
    // 徘徊次數：到達邊緣時若還有剩餘則掉頭再游，給玩家多 2～3 次機會
    // 0 = 游出即消失（一般特別魚）；2～3 = 可來回多趟
    passesLeft: (function() {
      if (def.type === 'molamola') return 2 + Math.floor(Math.random() * 2);      // 2～3
      if (def.type === 'fish_monster') return 2 + Math.floor(Math.random() * 2);  // 2～3
      if (def.type === 'fish_durian') return 2 + Math.floor(Math.random() * 2);   // 2～3
      return 0;
    })()
  };
}

/** 特別魚自由游泳：依 pattern 更新位置與繪製姿態 */
function updateSpecialSwim(sc, dtSec, timeScale) {
  if (!sc || sc.caught || sc.lifting || sc.falling) return;
  sc.animTime = (sc.animTime || 0) + dtSec * (sc.animSpeed || 2);

  const t = sc.animTime;
  const phase = sc.bobPhase || 0;
  const wPhase = sc.wobblePhase || 0;
  let vx = sc.baseSpeed != null ? sc.baseSpeed : sc.speed;
  let bobY = 0;
  let wobbleX = 0;
  let tilt = 0;
  let scale = 1;

  // 間歇加速（durian / dart）
  if (sc.swimPattern === 'burst' || sc.swimPattern === 'dart') {
    sc.burstT = (sc.burstT || 0) - dtSec;
    if (sc.burstT <= 0) {
      sc.burstBoost = (sc.swimPattern === 'dart') ? 0.9 : 0.65;
      sc.burstT = 1.2 + Math.random() * (sc.swimPattern === 'dart' ? 1.2 : 2.2);
    }
    if (sc.burstBoost > 0) {
      sc.burstBoost = Math.max(0, sc.burstBoost - dtSec * 1.4);
    }
    vx *= (1 + sc.burstBoost);
  }

  switch (sc.swimPattern) {
    case 'drift':
      // 緩慢漂浮：大弧上下 + 微左右
      bobY = Math.sin(t * sc.bobSpeed + phase) * sc.bobAmp
           + Math.sin(t * sc.bobSpeed * 0.37 + phase * 1.7) * sc.bobAmp * 0.25;
      wobbleX = Math.sin(t * sc.wobbleFreq + wPhase) * sc.wobbleAmp * 0.35;
      tilt = Math.sin(t * sc.bobSpeed * 0.8 + phase) * sc.tiltAmp;
      scale = 1 + Math.sin(t * 1.1 + phase) * sc.scalePulse;
      vx *= 0.92 + 0.08 * Math.sin(t * 0.5 + phase);
      break;
    case 'bob':
      // 彈跳感上下
      bobY = Math.sin(t * sc.bobSpeed + phase) * sc.bobAmp;
      // 接近谷底時略快
      if (Math.cos(t * sc.bobSpeed + phase) > 0) vx *= 1.08;
      wobbleX = Math.sin(t * sc.wobbleFreq + wPhase) * sc.wobbleAmp * 0.4;
      tilt = Math.cos(t * sc.bobSpeed + phase) * sc.tiltAmp;
      scale = 1 + Math.abs(Math.sin(t * sc.bobSpeed + phase)) * sc.scalePulse;
      break;
    case 'pulse':
      // 心跳式縮放為主
      bobY = Math.sin(t * sc.bobSpeed + phase) * sc.bobAmp * 0.7;
      wobbleX = Math.sin(t * sc.wobbleFreq + wPhase) * sc.wobbleAmp * 0.5;
      tilt = Math.sin(t * sc.wobbleFreq * 0.7 + wPhase) * sc.tiltAmp;
      // 雙峰心跳
      {
        const beat = t * 2.8 + phase;
        const p = Math.pow(Math.max(0, Math.sin(beat)), 8) + 0.45 * Math.pow(Math.max(0, Math.sin(beat + 0.35)), 8);
        scale = 1 + p * sc.scalePulse * 2.2;
      }
      break;
    case 'dart':
      // 快速蛇行
      bobY = Math.sin(t * sc.bobSpeed + phase) * sc.bobAmp;
      wobbleX = Math.sin(t * sc.wobbleFreq + wPhase) * sc.wobbleAmp;
      tilt = Math.cos(t * sc.wobbleFreq + wPhase) * sc.tiltAmp;
      scale = 1 + (sc.burstBoost || 0) * 0.06;
      break;
    case 'serpentine':
      // 章魚式大扭動
      bobY = Math.sin(t * sc.bobSpeed + phase) * sc.bobAmp
           + Math.sin(t * sc.bobSpeed * 2.1 + phase) * sc.bobAmp * 0.2;
      wobbleX = Math.sin(t * sc.wobbleFreq + wPhase) * sc.wobbleAmp;
      tilt = Math.sin(t * sc.wobbleFreq + wPhase) * sc.tiltAmp
           + Math.sin(t * sc.wobbleFreq * 2 + wPhase) * sc.tiltAmp * 0.3;
      scale = 1 + Math.sin(t * 2.2 + phase) * sc.scalePulse;
      break;
    case 'burst':
      bobY = Math.sin(t * sc.bobSpeed + phase) * sc.bobAmp;
      wobbleX = Math.sin(t * sc.wobbleFreq + wPhase) * sc.wobbleAmp * 0.6;
      tilt = Math.sin(t * sc.bobSpeed + phase) * sc.tiltAmp;
      scale = 1 + (sc.burstBoost || 0) * 0.08 + Math.sin(t * 2 + phase) * sc.scalePulse;
      break;
    case 'glide':
    default:
      bobY = Math.sin(t * sc.bobSpeed + phase) * sc.bobAmp;
      wobbleX = Math.sin(t * sc.wobbleFreq + wPhase) * sc.wobbleAmp * 0.45;
      tilt = Math.sin(t * sc.bobSpeed * 0.9 + phase) * sc.tiltAmp;
      scale = 1 + Math.sin(t * 1.2 + phase) * sc.scalePulse;
      break;
  }

  sc.speed = vx;
  sc.x += (vx * sc.dir + wobbleX * 0.08 * sc.dir) * timeScale;
  if (typeof sc.baseY !== 'number') sc.baseY = sc.y;
  sc.y = sc.baseY + bobY;
  sc.drawTilt = tilt;
  sc.drawScale = scale;
}

function specialOccupiesSlot(c) {
  // 已進鍋淡出不佔生成槽；游走／上鉤仍佔
  return !!(c && !c.caught);
}

function countSpecialSlots() {
  let n = 0;
  for (let i = 0; i < specialSeaCreatures.length; i++) {
    if (specialOccupiesSlot(specialSeaCreatures[i])) n++;
  }
  return n;
}

function canSpawnSpecialSlot() {
  return countSpecialSlots() < SPECIAL_MAX_ON_SCREEN;
}

function syncSpecialAlias() {
  specialSeaCreature = null;
  for (let i = 0; i < specialSeaCreatures.length; i++) {
    const c = specialSeaCreatures[i];
    if (c && !c.caught) { specialSeaCreature = c; break; }
  }
  if (!specialSeaCreature && specialSeaCreatures.length) {
    specialSeaCreature = specialSeaCreatures[0];
  }
}

function removeSpecialCreature(c) {
  const idx = specialSeaCreatures.indexOf(c);
  if (idx >= 0) specialSeaCreatures.splice(idx, 1);
  syncSpecialAlias();
}

function pickWeightedSpecial(pool) {
  if (!pool || !pool.length) return null;
  const recent = specialSpawn.recentTypes;
  let total = 0;
  const weights = new Array(pool.length);
  for (let i = 0; i < pool.length; i++) {
    const times = recent.filter(function(t) { return t === pool[i].type; }).length;
    // 近期出現過 → 降權；出現越多次權重越低
    const w = Math.max(0.15, 1 - times * 0.4);
    weights[i] = w;
    total += w;
  }
  let r = Math.random() * total;
  for (let i = 0; i < pool.length; i++) {
    r -= weights[i];
    if (r <= 0) return pool[i];
  }
  return pool[pool.length - 1];
}

function rememberSpecialType(type) {
  specialSpawn.recentTypes.push(type);
  while (specialSpawn.recentTypes.length > SPECIAL_RECENT_MEMORY) {
    specialSpawn.recentTypes.shift();
  }
}

function enqueueSpecial(priority, def, reason) {
  if (!def) return;
  // 同 reason 只保留較高優先（例如 combo1500 覆蓋 combo1000）
  for (let i = specialSpawn.pending.length - 1; i >= 0; i--) {
    const p = specialSpawn.pending[i];
    if (p.reason === reason || (reason.indexOf('combo') === 0 && p.reason.indexOf('combo') === 0)) {
      if (p.priority >= priority) return; // 已有同級或更高
      specialSpawn.pending.splice(i, 1);
    }
  }
  specialSpawn.pending.push({ priority: priority, def: def, reason: reason });
  specialSpawn.pending.sort(function(a, b) { return b.priority - a.priority; });
  if (specialSpawn.pending.length > SPECIAL_PENDING_MAX) {
    specialSpawn.pending.length = SPECIAL_PENDING_MAX;
  }
}

// 特別魚出現提示（畫在元氣量表下方）

function spawnSpecialFromDef(def) {
  if (!def || !canSpawnSpecialSlot()) return null;
  const c = makeSpecialCreature(def);
  specialSeaCreatures.push(c);
  rememberSpecialType(def.type);
  syncSpecialAlias();
  pushSpecialAlert(def);
  return c;
}

function flushSpecialPending() {
  while (specialSpawn.pending.length && canSpawnSpecialSlot()) {
    const job = specialSpawn.pending.shift();
    spawnSpecialFromDef(job.def);
  }
}

function jitterIntervalSec(baseSec, jitterRatio) {
  const j = (typeof jitterRatio === 'number') ? jitterRatio : 0.15;
  const jitter = baseSec * j * (Math.random() * 2 - 1);
  return Math.max(baseSec * 0.5, baseSec + jitter);
}

/** 排程下一次 interval 型特別魚 */
function scheduleNextInterval(def, fromTime) {
  if (!def || def.mode !== 'interval') return;
  const base = def.intervalSec || 30;
  specialSpawn.nextAt[def.type] = fromTime + jitterIntervalSec(base, def.jitter);
}

function molaChance(timeLeftVal, waitedMs) {
  if (timeLeftVal >= MOLAMOLA_ENERGY_THRESHOLD) return 0;
  const urgency = (MOLAMOLA_ENERGY_THRESHOLD - timeLeftVal) / MOLAMOLA_ENERGY_THRESHOLD;
  const patience = Math.min(1, waitedMs / 15000);
  return 0.12 + urgency * 0.5 + patience * 0.35;
}

function monsterChance(timeLeftVal, waitedMs) {
  if (timeLeftVal >= MONSTER_ENERGY_THRESHOLD) return 0;
  const urgency = (MONSTER_ENERGY_THRESHOLD - timeLeftVal) / MONSTER_ENERGY_THRESHOLD;
  const patience = Math.min(1, waitedMs / 12000);
  return 0.15 + urgency * 0.55 + patience * 0.35;
}

function energyChanceFor(def, waitedMs) {
  if (!def) return 0;
  if (def.type === 'molamola') return molaChance(timeLeft, waitedMs);
  if (def.type === 'fish_monster') return monsterChance(timeLeft, waitedMs);
  return 0;
}

/** 場上或 pending 是否已有同 type（避免重複堆） */
function specialTypeBusy(type) {
  for (let i = 0; i < specialSeaCreatures.length; i++) {
    const c = specialSeaCreatures[i];
    if (c && c.type === type && !c.caught) return true;
  }
  for (let i = 0; i < specialSpawn.pending.length; i++) {
    if (specialSpawn.pending[i].def && specialSpawn.pending[i].def.type === type) return true;
  }
  return false;
}

function trySpawnComboSpecial(tier) {
  if (!gameStarted || gameOver) return;
  const raw = (tier >= 1500) ? COMBO_SPECIAL_TYPES_1500 : COMBO_SPECIAL_TYPES_1000;
  const pool = raw.filter(function(d) { return canAppearNow(d.type); });
  if (!pool.length) return;
  const def = pickWeightedSpecial(pool) || pool[0];
  if (specialTypeBusy(def.type)) return;
  const pri = (tier >= 1500) ? SPECIAL_PRIORITY.combo1500 : SPECIAL_PRIORITY.combo1000;
  const reason = (tier >= 1500) ? 'combo1500' : 'combo1000';
  enqueueSpecial(pri, def, reason);
  flushSpecialPending();
}

function resetSpecialSpawnScheduler() {
  specialSeaCreatures = [];
  specialSeaCreature = null;
  specialSpawn.pending = [];
  specialSpawn.recentTypes = [];
  specialSpawn.waitMs = { molamola: 0, fish_monster: 0 };
  specialSpawn.nextAt = {};

  const intervalDefs = specialDefsByMode('interval');
  for (let i = 0; i < intervalDefs.length; i++) {
    const d = intervalDefs[i];
    const win = d.firstSec || [10, 20];
    specialSpawn.nextAt[d.type] = win[0] + Math.random() * (win[1] - win[0]);
  }
  const energyDefs = specialDefsByMode('energy');
  for (let i = 0; i < energyDefs.length; i++) {
    const d = energyDefs[i];
    // 首檢略錯開
    specialSpawn.nextAt[d.type] = 5 + Math.random() * 5 + i * 1.5;
  }
}

// 舊 API 相容
function scheduleSpecialSeaCreature() { /* no-op */ }
function scheduleMolamolaCheck() { /* no-op */ }
function scheduleMonsterCheck() { /* no-op */ }

/**
 * 每幀特別魚排程
 * 1) interval 種類：到點 → pending
 * 2) energy 種類：到點檢查 → 機率 pending
 * 3) combo 由分數事件另行觸發
 * 4) flush pending（受槽位／優先權限制）
 */
function updateSpecialSpawns(dtSec) {
  if (!gameStarted || gameOver || paramPanelOpen) return;
  const t = elapsedGameTime;

  // —— 1. 時間表（主題魚）——
  const intervalDefs = specialDefsByMode('interval');
  for (let i = 0; i < intervalDefs.length; i++) {
    const def = intervalDefs[i];
    let nextAt = specialSpawn.nextAt[def.type];
    if (typeof nextAt !== 'number') {
      scheduleNextInterval(def, t);
      continue;
    }
    if (t < nextAt) continue;
    // 非此時段：延後到半個日夜段後再試
    if (!canAppearNow(def.type)) {
      specialSpawn.nextAt[def.type] = t + Math.min(def.intervalSec || 20, DAY_NIGHT_HALF_SEC * 0.45);
      continue;
    }
    if (specialTypeBusy(def.type)) {
      specialSpawn.nextAt[def.type] = t + (specialSpawn.typeCooldownSec || 6);
      continue;
    }
    enqueueSpecial(def.priority || SPECIAL_PRIORITY.theme30, def, 'theme_' + def.type);
    scheduleNextInterval(def, t);
  }

  // —— 2. 低元氣救援 ——
  const energyDefs = specialDefsByMode('energy');
  for (let i = 0; i < energyDefs.length; i++) {
    const def = energyDefs[i];
    let nextAt = specialSpawn.nextAt[def.type];
    if (typeof nextAt !== 'number') {
      specialSpawn.nextAt[def.type] = t + (def.checkEverySec || 3);
      continue;
    }
    if (t < nextAt) continue;

    const every = def.checkEverySec || 3;
    specialSpawn.nextAt[def.type] = t + every;

    const threshold = def.energyBelow;
    if (!(timeLeft < threshold)) {
      specialSpawn.waitMs[def.type] = 0;
      continue;
    }
    if (specialTypeBusy(def.type)) continue;
    if (def.appear && def.appear !== 'all' && !canAppearNow(def.type)) {
      specialSpawn.waitMs[def.type] = 0;
      continue;
    }

    specialSpawn.waitMs[def.type] = (specialSpawn.waitMs[def.type] || 0) + every * 1000;
    const p = energyChanceFor(def, specialSpawn.waitMs[def.type]);
    if (Math.random() < p) {
      enqueueSpecial(def.priority || SPECIAL_PRIORITY.mola, def, 'energy_' + def.type);
      specialSpawn.waitMs[def.type] = 0;
      // 成功後多冷卻一輪，避免連發
      specialSpawn.nextAt[def.type] = t + every * 2.5;
    }
  }

  // —— 3. 消化佇列 ——
  flushSpecialPending();

  // 清掉已完全淡出的
  for (let i = specialSeaCreatures.length - 1; i >= 0; i--) {
    const c = specialSeaCreatures[i];
    if (c.fadeOut && c.fadeElapsed >= CATCH_FADE_HOLD_MS + CATCH_FADE_DURATION_MS) {
      specialSeaCreatures.splice(i, 1);
    }
  }
  syncSpecialAlias();
}

// 垃圾改為遊戲時間排程（與特別魚同一套，無 setTimeout 鏈）
let nextTrashAt = 12; // 秒
function scheduleTrashSpawn() {

  nextTrashAt = elapsedGameTime + jitterIntervalSec(TRASH_SPAWN_INTERVAL);
}
function updateTrashSpawn() {
  if (!gameStarted || gameOver || paramPanelOpen) return;
  if (elapsedGameTime < nextTrashAt) return;
  nextTrashAt = elapsedGameTime + jitterIntervalSec(TRASH_SPAWN_INTERVAL);
  const free = !trashes.some(function(t) { return t && !t.hit && !t.lifting; });
  if (free || trashes.length === 0) {
    trashes.push(createTrash());
  } else {
    for (let i = 0; i < trashes.length; i++) {
      if (!trashes[i].lifting && !trashes[i].hit) {
        Object.assign(trashes[i], createTrash());
        break;
      }
    }
  }
}
function drawSpecialSeaCreature(creature) {
  ctx.save();
  ctx.translate(creature.x, creature.y);
  // 游動／脫鉤下落可傾斜；上鉤／進鍋保持正向
  const free = !creature.lifting && !creature.caught && !creature.falling;
  let tilt = 0;
  let scl = 1;
  if (creature.falling) {
    tilt = typeof creature.fallRot === 'number' ? creature.fallRot : (creature.drawTilt || 0);
    // 下落時略微拉長感
    scl = 1 + Math.min(0.12, Math.abs(creature.fallVy || 0) * 0.008);
  } else if (free) {
    tilt = creature.drawTilt || 0;
    scl = creature.drawScale || 1;
  }
  ctx.rotate(tilt);
  ctx.scale(creature.dir * scl, scl);
  if (creature.fadeOut) {
    creature.fadeElapsed = (creature.fadeElapsed || 0) + deltaTime;
    if (creature.fadeElapsed < CATCH_FADE_HOLD_MS) {
      creature.alpha = 1;
    } else {
      const progress = (creature.fadeElapsed - CATCH_FADE_HOLD_MS) / CATCH_FADE_DURATION_MS;
      creature.alpha = Math.max(0, 1 - progress);

function createTrash() {

      ctx.beginPath();
      ctx.ellipse(0, 0, hw * 0.35, hh * 0.3, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  } else if (trash.type === 'seaurchin') {
    // 舊海膽備援
    if (seaUrchinImg.complete && seaUrchinImg.naturalWidth > 0) {
      ctx.drawImage(
        seaUrchinImg,
        -seaUrchinImg.naturalWidth / 2,
        -seaUrchinImg.naturalHeight / 2
      );
    } else {
      const hw = REAL_IMG_SIZE.seaurchin.w / 2, hh = REAL_IMG_SIZE.seaurchin.h / 2;
      const r = Math.min(hw, hh) * 0.55;
      ctx.strokeStyle = '#3a3a3a';
      ctx.lineWidth = 2;
      for (let i = 0; i < 16; i++) {
        const ang = (Math.PI * 2 / 16) * i;
        ctx.beginPath();
        ctx.moveTo(Math.cos(ang) * r * 0.6, Math.sin(ang) * r * 0.6);
        ctx.lineTo(Math.cos(ang) * Math.max(hw, hh), Math.sin(ang) * Math.max(hw, hh));
        ctx.stroke();
      }
      ctx.fillStyle = '#222';
      ctx.beginPath();
      ctx.ellipse(0, 0, r, r * 0.85, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.restore();
}
// --- 修改初始化 ---
// 在 spawnFish 之後呼叫 spawnTrash

// 新增：魚線起點在角色貼圖上的座標（以貼圖左上角為原點，未翻轉前）
// 這幾個座標已經移到 LINE_PARAMS（lineStartImgX/Y、lineStartImg2X/Y），可在調參面板即時調整

// 判斷目前是否要用「拉竿姿勢」貼圖：按下釣魚鍵、鉤子正在往上甩／已經釣到東西收線時都算
function isPullingPose() {
  return fishing || hookThrowing;
}

// 計算魚線起點的世界座標（會隨 playerDir 左右翻轉而反向）
function getLineStartPoint() {
  const pulling = isPullingPose();
  const activeImg = (pulling && catImg2.complete && catImg2.naturalWidth > 0) ? catImg2 : catImg;
  if (activeImg.complete && activeImg.naturalWidth > 0) {
    const imgX = (activeImg === catImg2) ? LINE_PARAMS.lineStartImg2X : LINE_PARAMS.lineStartImgX;
    const imgY = (activeImg === catImg2) ? LINE_PARAMS.lineStartImg2Y : LINE_PARAMS.lineStartImgY;
    const offsetX = imgX - activeImg.naturalWidth / 2;
    const offsetY = imgY - activeImg.naturalHeight / 2;
    return {
      x: bigFish.x + playerDir * offsetX,
      y: (bigFish.y - 40) + offsetY
    };
  }
  // 圖片尚未載入時的備用座標
  return { x: bigFish.x, y: bigFish.y - 10 };
}

// 初始化釣魚線點
function initLinePoints() {
  linePoints = [];
  lineVels = [];
  const start = getLineStartPoint();
  for (let i = 0; i < LINE_POINTS; i++) {
    let t = i / (LINE_POINTS - 1);
    let x = start.x;
    let y = start.y + (hookY - start.y) * t;
    linePoints.push({ x, y });
    lineVels.push({ x: 0, y: 0 });
  }
}

// 每幀更新魚線物理
function updateLinePhysics() {
  // 頂端跟隨角色嘴巴座標（會隨 playerDir 左右反向）
  const lineStart = getLineStartPoint();
  linePoints[0].x = lineStart.x;
  linePoints[0].y = lineStart.y;
  // 底端跟隨鉤子
  linePoints[LINE_POINTS - 1].x = hookDrawX;
  linePoints[LINE_POINTS - 1].y = hookY;

  // 已移除「甩竿時線保持剛性直線」的邏輯，改成無論哪個階段都用下面統一的彈簧物理，
  // 這樣線的表現在任何時候（迴圈上衝、自由落下、水下操作）都是一致的彈簧甩動效果。

  // 物理參數：整條線不再用單一彈性係數，改成由竿頭到鉤端漸變，
  // 靠近竿頭較硬（回彈快、不太晃），靠近鉤端較軟（甩動幅度大），加上重力讓線自然垂墜，
  // 整體看起來才會像有重量、有鞭梢感的線，而不是均勻軟趴趴的橡皮筋
  const damp = LINE_PARAMS.lineDamp;
  const gravity = LINE_PARAMS.lineGravity;
  for (let i = 1; i < LINE_POINTS - 1; i++) {
    let prev = linePoints[i - 1];
    let next = linePoints[i + 1];
    let self = linePoints[i];
    const segT = i / (LINE_POINTS - 1); // 0 = 竿頭端，1 = 鉤子端
    const spring = LINE_PARAMS.lineSpringBase - LINE_PARAMS.lineSpringRange * segT; // 竿頭附近較硬，鉤子附近較軟
    let vx = (prev.x + next.x) / 2 - self.x;
    let vy = (prev.y + next.y) / 2 - self.y;
    lineVels[i].x = (lineVels[i].x + vx * spring) * damp;
    lineVels[i].y = (lineVels[i].y + vy * spring + gravity * segT) * damp;
    self.x += lineVels[i].x;
    self.y += lineVels[i].y;
  }
}

// 新增：動態標記目前有碰撞的線段
function updateLineCollisions() {
  lineCollisions = Array(LINE_POINTS - 1).fill(false);
  // 檢查所有魚
  for (let fish of fishes) {
    if (fish.lifting || fish.caught) continue;
    for (let i = 0; i < linePoints.length - 1; i++) {
      let x1 = linePoints[i].x, y1 = linePoints[i].y;
      let x2 = linePoints[i+1].x, y2 = linePoints[i+1].y;
      let dx = x2 - x1, dy = y2 - y1;
      let len2 = dx*dx + dy*dy;
      let t = ((fish.x - x1) * dx + (fish.y - y1) * dy) / len2;
      t = Math.max(0, Math.min(1, t));
      let px = x1 + t * dx, py = y1 + t * dy;
      let dist = Math.hypot(fish.x - px, fish.y - py);
      if (dist < LINE_PARAMS.lineCollisionDist) {
        lineCollisions[i] = true;
      }
    }
  }
  // 檢查所有垃圾
  for (let trash of trashes) {
    if (trash.lifting || trash.hit) continue;
    for (let i = 0; i < linePoints.length - 1; i++) {
      let x1 = linePoints[i].x, y1 = linePoints[i].y;
      let x2 = linePoints[i+1].x, y2 = linePoints[i+1].y;
      let dx = x2 - x1, dy = y2 - y1;
      let len2 = dx*dx + dy*dy;
      let t = ((trash.x - x1) * dx + (trash.y - y1) * dy) / len2;
      t = Math.max(0, Math.min(1, t));
      let px = x1 + t * dx, py = y1 + t * dy;
      let dist = Math.hypot(trash.x - px, trash.y - py);
      if (dist < LINE_PARAMS.lineCollisionDist) {
        lineCollisions[i] = true;
      }
    }
  }
  // 檢查特別魚（張力顯示）
  for (let si = 0; si < specialSeaCreatures.length; si++) {
    const sc = specialSeaCreatures[si];
    if (!sc || sc.lifting || sc.caught) continue;
    for (let i = 0; i < linePoints.length - 1; i++) {
      let x1 = linePoints[i].x, y1 = linePoints[i].y;
      let x2 = linePoints[i+1].x, y2 = linePoints[i+1].y;
      let dx = x2 - x1, dy = y2 - y1;
      let len2 = dx*dx + dy*dy;
      if (len2 < 0.0001) continue;
      let t = ((sc.x - x1) * dx + (sc.y - y1) * dy) / len2;
      t = Math.max(0, Math.min(1, t));
      let px = x1 + t * dx, py = y1 + t * dy;
      let dist = Math.hypot(sc.x - px, sc.y - py);
      if (dist < LINE_PARAMS.lineCollisionDist) {
        lineCollisions[i] = true;
      }
    }
  }
}

// 畫釣竿和虛線釣魚線與小圓點鉤子
function drawRod() {
  updateLinePhysics();
  updateLineCollisions();
  // 畫每段線，根據碰撞狀態決定顏色
  for (let i = 0; i < linePoints.length - 1; i++) {
    ctx.save();
    ctx.strokeStyle = (lineCollisions[i]) ? '#f00' : '#fff';
    ctx.lineWidth = LINE_PARAMS.lineDrawWidth;
    ctx.setLineDash([LINE_PARAMS.lineDashLength, LINE_PARAMS.lineDashGap]);
    ctx.beginPath();
    ctx.moveTo(linePoints[i].x, linePoints[i].y);
    ctx.lineTo(linePoints[i+1].x, linePoints[i+1].y);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }
  // 小圓點鉤子
  ctx.fillStyle = "#fff";
  ctx.beginPath();
  ctx.arc(hookDrawX, hookY, LINE_PARAMS.hookDotRadius, 0, Math.PI * 2);
  ctx.fill();
}

// 畫魚
function drawFish(fish) {
  ctx.save();
  ctx.translate(fish.x, fish.y);
  // 體型縮放比例：一般魚沒有 sizeScale 屬性時預設為 1（不影響原本大小）
  const sizeScale = (typeof fish.sizeScale === 'number') ? fish.sizeScale : 1;
  ctx.scale(fish.dir * sizeScale, sizeScale);
  // 新增：漸層消失（先完全顯示一段時間讓玩家看清楚，再花時間慢慢淡出）
  if (fish.fadeOut) {
    fish.fadeElapsed = (fish.fadeElapsed || 0) + deltaTime;
    if (fish.fadeElapsed < CATCH_FADE_HOLD_MS) {
      fish.alpha = 1;
    } else {
      const progress = (fish.fadeElapsed - CATCH_FADE_HOLD_MS) / CATCH_FADE_DURATION_MS;
      fish.alpha = Math.max(0, 1 - progress);
    }
    ctx.globalAlpha = fish.alpha;
  }
  if (fish.color === 'gold') {
    // 小魚 A／B／C、魚 A／B／C：優先使用各種類獨立素材；缺圖時回退到通用黃魚動畫
    const variant = (typeof fish.fishVariant === 'number') ? fish.fishVariant : 0;
    const animSet = getGoldFishAnimSet(fish);
    let currentImg = null;
    if (fish.lifting || fish.caught) {
      if (typeof fish.liftAnimTime !== 'number') fish.liftAnimTime = 0;
      fish.liftAnimTime += deltaTime / 1000;
      const liftFrame = Math.floor(fish.liftAnimTime * 5) % 2;
      currentImg = pickAnimFrame(animSet, 3 + liftFrame, defaultYellowAnimSet);
    } else {
      if (!fish.caught) {
        fish.animTime += deltaTime / 1000;
      }
      // 魚群：較慢換幀 + 優先用已快取的單幀，減少每隻每幀掃描整組圖
      const animFrame = Math.floor(fish.animTime * fish.animSpeed) % 3;
      if (fish.fishTier === 'school' && fish._cachedSwimImg && fish._cachedSwimFrame === animFrame) {
        currentImg = fish._cachedSwimImg;
      } else {
        currentImg = pickAnimFrame(animSet, animFrame, defaultYellowAnimSet);
        if (fish.fishTier === 'school' && currentImg) {
          fish._cachedSwimImg = currentImg;
          fish._cachedSwimFrame = animFrame;
        }
      }
    }

    if (currentImg) {
      ctx.drawImage(
        currentImg,
        -currentImg.naturalWidth / 2,
        -currentImg.naturalHeight / 2
      );
    } else {
      const variantColors = ['gold', '#ffb347', '#ffe066'];
      const hw = REAL_IMG_SIZE.yellowFish.w / 2, hh = REAL_IMG_SIZE.yellowFish.h / 2;
      ctx.fillStyle = variantColors[variant] || 'gold';
      ctx.beginPath();
      ctx.ellipse(hw * 0.15, 0, hw * 0.75, hh, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-hw * 0.55, 0);
      ctx.lineTo(-hw, -hh * 0.6);
      ctx.lineTo(-hw, hh * 0.6);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#333';
      ctx.beginPath();
      ctx.arc(hw * 0.55, -hh * 0.2, 2, 0, Math.PI * 2);
      ctx.fill();
    }
  } else if (fish.fishTier === 'urchin' || fish.color === 'urchin') {
    const img = seaUrchinImg;
    if (img && img.complete && img.naturalWidth > 0) {
      ctx.drawImage(img, -img.naturalWidth / 2, -img.naturalHeight / 2);
    } else {
      const hw = REAL_IMG_SIZE.seaurchin.w / 2, hh = REAL_IMG_SIZE.seaurchin.h / 2;
      const r = Math.min(hw, hh) * 0.55;
      ctx.strokeStyle = '#3a3a3a';
      ctx.lineWidth = 2;
      for (let i = 0; i < 16; i++) {
        const ang = (Math.PI * 2 / 16) * i;
        ctx.beginPath();
        ctx.moveTo(Math.cos(ang) * r * 0.6, Math.sin(ang) * r * 0.6);
        ctx.lineTo(Math.cos(ang) * Math.max(hw, hh), Math.sin(ang) * Math.max(hw, hh));
        ctx.stroke();
      }
      ctx.fillStyle = '#222';
      ctx.beginPath();
      ctx.ellipse(0, 0, r, r * 0.85, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  } else if (fish.fishTier === 'watermelon' || fish.color === 'watermelon') {
    const img = (fishWatermelonImg && fishWatermelonImg.complete && fishWatermelonImg.naturalWidth > 0)
      ? fishWatermelonImg : watermelonImg;
    if (img && img.complete && img.naturalWidth > 0) {
      ctx.drawImage(img, -img.naturalWidth / 2, -img.naturalHeight / 2);
    } else {
      const hw = REAL_IMG_SIZE.watermelon.w / 2, hh = REAL_IMG_SIZE.watermelon.h / 2;
      ctx.fillStyle = '#2ecc71';
      ctx.beginPath();
      ctx.ellipse(0, 0, hw, hh * 0.9, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#e74c3c';
      ctx.beginPath();
      ctx.ellipse(0, 0, hw * 0.35, hh * 0.3, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  } else if (fish.fishTier === 'theme_mid') {
    // 普通魚群中的主題魚（屎屎／鳥仔）
    const img = specialImgMap[fish.fishKind];
    if (img && img.complete && img.naturalWidth > 0) {
      ctx.drawImage(img, -img.naturalWidth / 2, -img.naturalHeight / 2);
    } else {
      const hw = 30, hh = 18;
      ctx.fillStyle = fish.fishKind === 'fish_bird' ? '#7ec8e3' : '#c4a484';
      ctx.beginPath();
      ctx.ellipse(0, 0, hw, hh, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  } else {
    // 黃色魚維持原樣
    ctx.fillStyle = fish.caught ? "#aaa" : fish.color;
    ctx.beginPath();
    ctx.ellipse(0, 0, 22, 12, 0, 0, Math.PI * 2);
    ctx.fill();
    // 魚尾
    ctx.beginPath();
    ctx.moveTo(-22, 0);
    ctx.lineTo(-32, -8);
    ctx.lineTo(-32, 8);
    ctx.closePath();
    ctx.fillStyle = fish.caught ? "#888" : "#f90";
    ctx.fill();
    // 眼睛
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(10, -4, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#000";
    ctx.beginPath();
    ctx.arc(11, -4, 1.5, 0, Math.PI * 2);
    ctx.fill();
    // 表情
    ctx.save();
    ctx.strokeStyle = "#000";
    ctx.lineWidth = 2;
    if (fish.face === 'smile') {
      ctx.beginPath();
      ctx.arc(10, 2, 3, 0, Math.PI, false);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.arc(10, 2, 1, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
  }
  ctx.restore();
}

// --- 遊戲結束 POPUP ---
function formatPlayTime(seconds) {
  const s = Math.max(0, Math.floor(seconds));
  const m = Math.floor(s / 60);
  const r = s % 60;
  if (m > 0) return m + ' 分 ' + r + ' 秒';

}
/** 載入單張圖（已 cache 會很快） */
function loadShareImage(src) {
  return new Promise(function(resolve) {
    if (!src) { resolve(null); return; }
    const im = new Image();
    im.onload = function() { resolve(im); };
    im.onerror = function() { resolve(null); };
    im.src = src;
  });
}

/**
 * Grid Generator：產生社群分享用結果圖（1080×1350）
 * @returns {Promise<HTMLCanvasElement|null>}
 */
function generateResultShareCard() {
  const W = 1080;
  const keys = Object.keys(collectedFishCounts);
  keys.sort(function(a, b) {
    return (collectedFishCounts[b] || 0) - (collectedFishCounts[a] || 0);
  });
  let totalFish = 0;
  for (let i = 0; i < keys.length; i++) totalFish += collectedFishCounts[keys[i]] || 0;
  const playTime = formatPlayTime(elapsedGameTime);

  // —— 先算版面：全部魚獲、高度隨內容變化 ——
  const cardX = 56, cardY = 56, cardW = W - 112;
  const gridPad = 36;
  const gridLeft = cardX + gridPad;
  const gridW = cardW - gridPad * 2;
  const maxCells = keys.length; // 全部列出
  const cols = maxCells <= 0 ? 1 : (maxCells <= 4 ? Math.max(1, maxCells) : (maxCells <= 9 ? 3 : 4));
  const rows = Math.max(1, Math.ceil(Math.max(1, maxCells) / cols));
  const gap = 16;
  const cellW = (gridW - gap * (cols - 1)) / cols;
  const cellH = Math.min(188, Math.max(140, cellW * 1.02));

  const headerH = 150; // 兩排標題色帶
  const scoreBlockH = 210; // EDAN + 分數區
  const statsH = 90;
  const gridTopOff = 24;
  const gridH = maxCells === 0 ? 140 : (rows * cellH + (rows - 1) * gap);
  const footerPad = 72;
  const cardInner = headerH + scoreBlockH + statsH + gridTopOff + gridH + 40;
  const cardH = Math.max(900, cardInner);
  const H = cardY + cardH + footerPad + 36; // 整圖高度可變

  const loads = keys.map(function(k) { return loadShareImage(fishTypeImgSrc(k)); });
  loads.push(loadShareImage('img/EDAN.png'));
  return Promise.all(loads).then(function(allImgs) {
    const edanImg = allImgs[allImgs.length - 1];
    const imgs = allImgs.slice(0, keys.length);
    const c = document.createElement('canvas');
    c.width = W;
    c.height = H;
    const g = c.getContext('2d');

    // —— 背景：海空漸層 ——
    const bg = g.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#b8e0ff');
    bg.addColorStop(0.2, '#d6efff');
    bg.addColorStop(0.45, '#7ec8f0');
    bg.addColorStop(0.75, '#2a6fa0');
    bg.addColorStop(1, '#0c2a48');
    g.fillStyle = bg;
    g.fillRect(0, 0, W, H);

    g.fillStyle = 'rgba(255,255,255,0.18)';
    g.beginPath(); g.arc(180, 140, 110, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.arc(920, 240, 80, 0, Math.PI * 2); g.fill();
    g.fillStyle = 'rgba(255,200,120,0.2)';
    g.beginPath(); g.arc(860, 100, 64, 0, Math.PI * 2); g.fill();

    // 主卡片
    g.save();
    g.shadowColor = 'rgba(20,50,90,0.35)';
    g.shadowBlur = 40;
    g.shadowOffsetY = 16;
    roundRectPath(g, cardX, cardY, cardW, cardH, 40);
    const cardGrad = g.createLinearGradient(cardX, cardY, cardX, cardY + cardH);
    cardGrad.addColorStop(0, 'rgba(255,255,255,0.96)');
    cardGrad.addColorStop(0.55, 'rgba(245,248,253,0.94)');
    cardGrad.addColorStop(1, 'rgba(220,232,248,0.92)');
    g.fillStyle = cardGrad;
    g.fill();
    g.restore();

    // 頂部色帶
    g.save();
    roundRectPath(g, cardX, cardY, cardW, headerH, 40);
    g.clip();
    const band = g.createLinearGradient(cardX, cardY, cardX + cardW, cardY);
    band.addColorStop(0, '#5b9cf5');
    band.addColorStop(0.5, '#7c5cbf');
    band.addColorStop(1, '#ff708b');
    g.fillStyle = band;
    g.fillRect(cardX, cardY, cardW, headerH);
    g.restore();
    // 色帶下緣柔和過渡到卡片白底
    g.fillStyle = 'rgba(255,255,255,0.96)';
    g.fillRect(cardX, cardY + headerH - 28, cardW, 36);

    // 標題（兩排）
    g.fillStyle = '#fff';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    // 第1排：粗體
    g.font = '800 28px "Noto Sans TC", "Segoe UI", system-ui, sans-serif';
    g.fillText('自稱姜太公後人 EDlui 釣魚記', W / 2, cardY + 52);
    // 第2排
    g.font = '600 22px "Noto Sans TC", "Segoe UI", system-ui, sans-serif';
    g.fillText('---願者上鉤---', W / 2, cardY + 92);

    // —— 分數列：EDAN（約 2 倍大）在左，分數在右 ——
    const scoreRowY = cardY + headerH + 20;
    let edanW = 0, edanH = 0;
    if (edanImg && edanImg.naturalWidth) {
      edanW = 300; // 原 150 → 大一倍
      edanH = edanW * (edanImg.naturalHeight / edanImg.naturalWidth);
      const edanX = cardX + 28;
      const edanY = scoreRowY + Math.max(0, (scoreBlockH - 40 - edanH) * 0.35);
      g.drawImage(edanImg, edanX, edanY, edanW, edanH);
    }
    // 分數靠右半／置中偏右，避開 EDAN
    const scoreCX = cardX + Math.max(cardW * 0.58, 28 + edanW + 40 + (cardW - 28 - edanW - 40) * 0.5);
    g.fillStyle = '#4a86d8';
    g.font = '800 96px "Noto Sans TC", "Segoe UI", system-ui, sans-serif';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText(String(score), scoreCX, scoreRowY + 70);
    g.fillStyle = '#6b7c99';
    g.font = '600 28px "Noto Sans TC", "Segoe UI", system-ui, sans-serif';
    g.fillText('SCORE', scoreCX, scoreRowY + 130);

    // 統計列
    const statsY = cardY + headerH + scoreBlockH;
    const statItems = [
      { label: '時間', value: playTime },
      { label: '種類', value: keys.length + ' 種' },
      { label: '總隻', value: totalFish + ' 隻' },
      { label: '垃圾', value: String(trashCaughtCount) }
    ];
    const statW = cardW / 4;
    for (let i = 0; i < statItems.length; i++) {
      const cx = cardX + statW * (i + 0.5);
      g.fillStyle = '#8a9bb5';
      g.font = '500 22px "Noto Sans TC", "Segoe UI", system-ui, sans-serif';
      g.textAlign = 'center';
      g.fillText(statItems[i].label, cx, statsY);
      g.fillStyle = '#354560';
      g.font = '700 28px "Noto Sans TC", "Segoe UI", system-ui, sans-serif';
      g.fillText(statItems[i].value, cx, statsY + 36);
    }

    // 全部魚獲 grid
    const gridTop = statsY + statsH;
    if (maxCells === 0) {
      g.fillStyle = '#8a9bb5';
      g.font = '500 28px "Noto Sans TC", "Segoe UI", system-ui, sans-serif';
      g.textAlign = 'center';
      g.fillText('本局尚未釣到魚…下次加油！', W / 2, gridTop + 80);
    }

    for (let i = 0; i < maxCells; i++) {
      const col = i % cols;
      const row = Math.floor(i / cols);
      const x = gridLeft + col * (cellW + gap);
      const y = gridTop + row * (cellH + gap);

      g.save();
      g.shadowColor = 'rgba(80,110,170,0.12)';
      g.shadowBlur = 12;
      g.shadowOffsetY = 4;
      roundRectPath(g, x, y, cellW, cellH, 22);
      g.fillStyle = '#fff';
      g.fill();
      g.restore();

      const im = imgs[i];
      const n = collectedFishCounts[keys[i]] || 0;
      if (im && im.naturalWidth) {
        const maxImgW = cellW * 0.72;
        const maxImgH = cellH * 0.55;
        const scale = Math.min(maxImgW / im.naturalWidth, maxImgH / im.naturalHeight);
        const iw = im.naturalWidth * scale;
        const ih = im.naturalHeight * scale;
        g.drawImage(im, x + (cellW - iw) / 2, y + 14, iw, ih);
      } else {
        g.fillStyle = '#c5d0e0';
        g.font = '600 22px sans-serif';
        g.textAlign = 'center';
        g.fillText(fishTypeLabel(keys[i]).slice(0, 4), x + cellW / 2, y + cellH * 0.4);
      }

      const badge = '×' + n;
      g.font = '700 26px "Noto Sans TC", "Segoe UI", system-ui, sans-serif';
      const bw = g.measureText(badge).width + 28;
      const bx = x + (cellW - bw) / 2;
      const by = y + cellH - 46;
      roundRectPath(g, bx, by, bw, 34, 17);
      const bgad = g.createLinearGradient(bx, by, bx + bw, by);
      bgad.addColorStop(0, '#5b9cf5');
      bgad.addColorStop(1, '#7c5cbf');
      g.fillStyle = bgad;
      g.fill();
      g.fillStyle = '#fff';
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.fillText(badge, x + cellW / 2, by + 17);
    }

    // 底欄
    g.fillStyle = 'rgba(255,255,255,0.8)';
    g.font = '600 24px "Noto Sans TC", "Segoe UI", system-ui, sans-serif';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText('UNOFFICIA.FANART BY LI_MEI.ART', W / 2, H - 36);

    return c;
  });
}

function roundRectPath(ctx2, x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  ctx2.beginPath();
  ctx2.moveTo(x + rr, y);
  ctx2.arcTo(x + w, y, x + w, y + h, rr);
  ctx2.arcTo(x + w, y + h, x, y + h, rr);
  ctx2.arcTo(x, y + h, x, y, rr);
  ctx2.arcTo(x, y, x + w, y, rr);
  ctx2.closePath();
}

let lastResultShareCanvas = null;
let lastResultShareUrl = null;

function showResultSharePreview(canvasEl) {
  lastResultShareCanvas = canvasEl;
  const wrap = document.getElementById('resultShareWrap');
  const preview = document.getElementById('resultSharePreview');
  if (!wrap || !preview || !canvasEl) return;
  if (lastResultShareUrl) {
    try { URL.revokeObjectURL(lastResultShareUrl); } catch (e) { /* ignore */ }
  }
  canvasEl.toBlob(function(blob) {
    if (!blob) {
      preview.src = canvasEl.toDataURL('image/png');
    } else {
      lastResultShareUrl = URL.createObjectURL(blob);
      preview.src = lastResultShareUrl;
    }
    wrap.style.display = 'block';
  }, 'image/png');
}

function downloadResultShare() {
  if (!lastResultShareCanvas) return;
  const a = document.createElement('a');
  a.download = 'fishing-result-' + Date.now() + '.png';
  a.href = lastResultShareCanvas.toDataURL('image/png');
  a.click();
  if (typeof sfx === 'function') sfx('ui_click', { throttleMs: 80 });
}

async function shareResultShare() {
  if (!lastResultShareCanvas) return;
  if (typeof sfx === 'function') sfx('ui_click', { throttleMs: 80 });
  const title = '自稱姜太公後人 EDlui釣魚記 · 得分 ' + score;
  const text = '自稱姜太公後人／EDlui釣魚記 ---願者上鉤--- 得分 ' + score + '！';
  try {
    const blob = await new Promise(function(resolve) {
      lastResultShareCanvas.toBlob(resolve, 'image/png');
    });
    if (blob && navigator.share && navigator.canShare) {
      const file = new File([blob], 'fishing-result.png', { type: 'image/png' });
      if (navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: title, text: text });
        return;
      }
    }
    if (navigator.share) {
      await navigator.share({ title: title, text: text });
      return;
    }
  } catch (e) {
    if (e && e.name === 'AbortError') return;
  }
  // 後備：下載
  downloadResultShare();
}

// 魚／垃圾／特殊海洋生物出生時的「最高路徑」高度，跟著海平面高度參數走
// （海平面調高，這條線跟著往下；海平面調低，這條線跟著往上，魚群活動範圍隨之整體平移）
function getFishTopY() {
  // 與海面拉開距離，魚群不會貼在水線上
  return LINE_PARAMS.seaSurfaceY + 85;
}

// 遊戲內部畫布的高度（對應 resizeGameCanvas 裡的 GAME_HEIGHT，固定 600）。
// 這裡獨立寫死一份常數，是因為 spawnFish() 等生成函式在遊戲一開始執行時，
// canvas.height 可能還沒被 resizeGameCanvas() 設定成正式尺寸，用 canvas.height 算會不準。
const GAME_CANVAS_HEIGHT = 960;

// 魚／垃圾／特殊海洋生物出生時的「最低路徑」高度上限：
// 扣掉上下漂動的最大幅度（bobAmplitude 最高約 32）與圖片本身的高度，
// 抓一個安全邊界，確保生成出來的最低路徑，整隻圖片都還在畫面裡，不會有一部分掉到畫面下緣看不到。
function getFishBottomY() {
  return GAME_CANVAS_HEIGHT - 70;
}

// --- 新增：海浪波動 ---
let wavePhase = 0;
function getWaveY(x, t) {
  // 主波浪 + 次波浪疊加
  let y = LINE_PARAMS.seaSurfaceY + Math.sin((x/120) + t) * LINE_PARAMS.waveAmplitudeMain + Math.sin((x/40) - t*1.7) * LINE_PARAMS.waveAmplitudeSecondary;
  // --- 疊加主角擾動波 ---
  let dx = x - waveDisturb.x;
  let disturb = waveDisturb.v * Math.exp(-dx*dx/900) * Math.sin(t*2 + dx/30);
  y += disturb * LINE_PARAMS.waveDisturbAmplitude; // 擾動強度
  return y;
}

// --- 分數／元氣 HUD（Claymorphism 風格：軟質圓角膠囊、柔和陰影、糖果漸層量表）---
function drawRoundedRectPath(x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}

  // —— 元氣列 ——
  const energyBoxX = 14;
  const energyBoxY = 58;
  const energyBoxW = Math.min(canvas.width - 28, 360);
  const energyBoxH = 34;

  ctx.shadowColor = 'rgba(80, 110, 170, 0.26)';
  ctx.shadowBlur = 12;
  ctx.shadowOffsetX = 3;
  ctx.shadowOffsetY = 5;
  drawRoundedRectPath(energyBoxX, energyBoxY, energyBoxW, energyBoxH, 17);
  const energyBgGrad = ctx.createLinearGradient(energyBoxX, energyBoxY, energyBoxX, energyBoxY + energyBoxH);
  energyBgGrad.addColorStop(0, '#ffffff');
  energyBgGrad.addColorStop(0.55, '#f5f8fd');
  energyBgGrad.addColorStop(1, '#e4ebf7');
  ctx.fillStyle = energyBgGrad;
  ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(255,255,255,0.95)';
  ctx.lineWidth = 2;
  drawRoundedRectPath(energyBoxX + 1, energyBoxY + 1, energyBoxW - 2, energyBoxH - 2, 15);
  ctx.stroke();

  // 「元氣」標籤
  const eTagX = energyBoxX + 8;
  const eTagY = energyBoxY + 5;
  const eTagW = 42;
  const eTagH = 24;
  drawRoundedRectPath(eTagX, eTagY, eTagW, eTagH, 12);
  const eTagGrad = ctx.createLinearGradient(eTagX, eTagY, eTagX + eTagW, eTagY + eTagH);
  eTagGrad.addColorStop(0, '#ffe08a');
  eTagGrad.addColorStop(0.45, '#ffc14d');
